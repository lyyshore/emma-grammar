ng now! We ___ miss it! (will / be going to)","answer":["are going to","'re going to"],"why":"We can see it is about to happen: are going to."},{"type":"fill","q":"Hmm, let me think… OK, I ___ have the chicken rice, please. (will / be going to)","answer":["will","'ll"],"why":"You decide right now at the restaurant: will."}]},{"name":"Challenge","items":[{"type":"order","words":["I","will","help","you","with","your","homework"],"end":".","alt":[],"why":"Will + base verb help."},{"type":"order","words":["we","are","going","to","visit","Grandma","on","Sunday"],"end":".","alt":[["on","Sunday","we","are","going","to","visit","Grandma"]],"why":"A plan: are going to + visit."},{"type":"order","words":["are","you","going","to","watch","the","fireworks"],"end":"?","alt":[],"why":"Questions: Are + you + going to + base verb."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I will to call you tomorrow.","answer":["I will call you tomorrow.","I'll call you tomorrow."],"why":"No to after will."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Look at those black clouds! It going to rain.","answer":["Look at those black clouds! It is going to rain.","Look at those black clouds! It's going to rain."],"why":"Don't forget is: It is going to rain."},{"type":"rewrite","task":"Make it negative.","s":"Leo will come to the party.","answer":["Leo won't come to the party.","Leo will not come to the party."],"why":"Will not = won't."},{"type":"rewrite","task":"Make it a question.","s":"Ava is going to join the swimming team.","answer":["Is Ava going to join the swimming team?"],"why":"Move is to the front: Is Ava going to …?"},{"type":"rewrite","task":"Find and fix the mistake.","s":"Emma going to learn the violin next year.","answer":["Emma is going to learn the violin next year.","Emma's going to learn the violin next year."],"why":"Going to needs am/is/are: Emma is going to."}]}]},{"id":"present-perfect","num":25,"title":"Present Perfect","zh":"现在完成时","bigIdea":"The present perfect joins the past to **now**. We use it for experiences in your life (I **have been** to Japan), things that are done by now (I **have finished** my homework), and things that started in the past and are still true (I **have lived** here **for** five years). Make it with **have / has + past participle**.","zhNote":"中文常用“过”“已经”“了”来表达，英语用 have/has + 过去分词。for 后面接一段时间（for 3 years），since 后面接开始的时间点（since 2020）。been to 是“去过（已经回来了）”，gone to 是“去了（还在那里）”。","rules":[{"rule":"have / has + past participle. Negative: haven't / hasn't.","examples":["I **have finished** my homework.","She **has eaten** lunch.","They **haven't seen** the film."]},{"rule":"Past participles: regular verbs look like the past (-ed). Irregular verbs must be learned.","examples":["play → **played**, visit → **visited**","go → **gone**, be → **been**, do → **done**, see → **seen**","eat → **eaten**, write → **written**, take → **taken**"]},{"rule":"ever / never (experiences), just / already (done by now), yet (in questions and negatives, at the end).","examples":["**Have** you **ever been** to Japan? — No, I've **never** been there.","I've **just** had lunch. I've **already** finished.","Have you finished **yet**? I haven't finished **yet**."]},{"rule":"for + an amount of time; since + the starting point.","examples":["**for** two years, **for** a week, **for** ten minutes","**since** 2020, **since** Monday, **since** I was six","I **have lived** in Hong Kong **since** 2019."]},{"rule":"been vs gone.","examples":["Leo **has been** to Beijing. (He went and came back.)","Leo **has gone** to Beijing. (He is there now.)"]}],"tip":"**For** = how long (for 3 days). **Since** = from when (since Monday). **Just** and **already** go in the middle; **yet** goes at the end.","mistakes":[{"wrong":"I have saw that film.","right":"I have **seen** that film."},{"wrong":"She have finished her homework.","right":"She **has** finished her homework."},{"wrong":"I have lived here since three years.","right":"I have lived here **for** three years."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I ___ finished my homework.","options":["has","have","am"],"answer":1,"why":"I goes with have."},{"type":"mc","q":"Emma ___ eaten all her dumplings.","options":["has","have","is"],"answer":0,"why":"Emma = she, so has."},{"type":"mc","q":"Have you ever ___ a shark?","options":["see","saw","seen"],"answer":2,"why":"Have + past participle: seen."},{"type":"mc","q":"Leo has ___ three emails today.","options":["written","wrote","writed"],"answer":0,"why":"Has + past participle: written."},{"type":"mc","q":"We have lived in Hong Kong ___ 2020.","options":["for","since","ago"],"answer":1,"why":"2020 is a starting point, so since."},{"type":"mc","q":"Mia has played the violin ___ five years.","options":["since","ago","for"],"answer":2,"why":"Five years is an amount of time, so for."},{"type":"mc","q":"I'm not hungry. I've ___ had lunch.","options":["yet","just","ever"],"answer":1,"why":"Just = a very short time ago; it goes in the middle."},{"type":"mc","q":"Have you done your homework ___?","options":["yet","since","for"],"answer":0,"why":"Yet goes at the end of questions."},{"type":"mc","q":"I have ___ been to Disneyland. I'd love to go!","options":["ever","yet","never"],"answer":2,"why":"Never = not at any time in my life."},{"type":"mc","q":"Dad isn't here. He has ___ to the supermarket.","options":["been","gone","went"],"answer":1,"why":"He is still there, so gone."}]},{"name":"Practice","items":[{"type":"fill","q":"I ___ in this flat since I was a baby. (live)","answer":["have lived","'ve lived","have been living","'ve been living"],"why":"Since + starting point, and it is still true now: have lived."},{"type":"fill","q":"Sam ___ Mr Chan since he was in Grade 1. (know)","answer":["has known","'s known"],"why":"Know → knew → known. Sam = he, so has known."},{"type":"fill","q":"We ___ this film three times so far! (see)","answer":["have seen","'ve seen"],"why":"Have + past participle: seen."},{"type":"fill","q":"Isabelle ___ to Japan twice. She loves it there. (be)","answer":["has been","'s been"],"why":"An experience: has been."},{"type":"fill","q":"Ava ___ her homework yet. (not finish)","answer":["hasn't finished","has not finished"],"why":"Ava = she, so hasn't + finished."},{"type":"fill","q":"I ___ durian. I'm scared of the smell! (never try)","answer":["have never tried","'ve never tried"],"why":"Have + never + past participle."},{"type":"fill","q":"My grandparents have lived in Sha Tin ___ forty years.","answer":["for"],"why":"Forty years is an amount of time: for."},{"type":"fill","q":"Leo has been ill ___ Monday.","answer":["since"],"why":"Monday is the starting point: since."},{"type":"fill","q":"Have you ever ___ a horse? (ride)","answer":["ridden"],"why":"Ride → rode → ridden."},{"type":"fill","q":"Mum isn't at home. She has ___ to work. (go / be)","answer":["gone"],"why":"She is still at work, so gone (not been)."}]},{"name":"Challenge","items":[{"type":"order","words":["I","have","never","been","to","London"],"end":".","alt":[],"why":"Never goes between have and the past participle."},{"type":"order","words":["have","you","ever","seen","a","rainbow"],"end":"?","alt":[],"why":"Have + you + ever + past participle."},{"type":"order","words":["she","has","just","finished","her","lunch"],"end":".","alt":[],"why":"Just goes between has and the past participle."},{"type":"order","words":["they","have","lived","here","for","six","years"],"end":".","alt":[],"why":"For + an amount of time."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I have saw this film before.","answer":["I have seen this film before.","I've seen this film before."],"why":"Have + past participle: seen, not saw."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Leo have already done his homework.","answer":["Leo has already done his homework.","Leo's already done his homework.","Leo has done his homework already."],"why":"Leo = he, so has."},{"type":"rewrite","task":"Find and fix the mistake.","s":"We have lived here since three years.","answer":["We have lived here for three years.","We've lived here for three years."],"why":"Three years is an amount of time, so for."},{"type":"rewrite","task":"Make it a question.","s":"Emma has finished her project.","answer":["Has Emma finished her project?","Has Emma finished her project yet?"],"why":"Move has to the front: Has Emma …?"}]}]},{"id":"perfect-vs-past","num":26,"title":"Present Perfect or Past Simple?","zh":"现在完成时还是一般过去时","bigIdea":"If you say **when** something happened, at a finished time (yesterday, last week, in 2022, two days ago), use the **past simple**: I **saw** that film **yesterday**. If there is no time, or the time isn't finished yet (ever, never, already, yet, since, for … until now), use the **present perfect**: I **have seen** that film.","zhNote":"关键看时间词：有明确的过去时间（yesterday、last week、in 2022、…ago、when I was 6）就用一般过去时；没有具体时间、谈经历、或者一直持续到现在的事，用现在完成时。注意：现在完成时不能和 yesterday、ago 这类词一起用，问 When…? 也要用一般过去时。","rules":[{"rule":"A finished time is given → past simple.","examples":["I **visited** Beijing **in 2022**.","We **ate** dim sum **last Sunday**.","Leo **lost** his tooth **two days ago**."]},{"rule":"No time given, life experience, or ever / never / already / yet / just → present perfect.","examples":["I **have visited** Beijing. **Have** you **ever eaten** durian?","I **have already finished** my homework.","**Has** the bus **come yet**?"]},{"rule":"Still true now (for / since) → present perfect. Finished and over → past simple.","examples":["I **have lived** here **for** five years. (I still live here.)","I **lived** in Shanghai **for** two years. (I don't live there now.)"]},{"rule":"A common pattern: ask with the present perfect, give details with the past simple.","examples":["**Have** you **ever been** to Japan? — Yes, I **went** there **last summer**.","**When did** you **go**? (When … ? → past simple)"]}],"tip":"Can you point to **when** on a calendar? → Past simple. No 'when', or still going on? → Present perfect.","mistakes":[{"wrong":"I have seen him yesterday.","right":"I **saw** him yesterday."},{"wrong":"I have gone to Japan in 2023.","right":"I **went** to Japan in 2023."},{"wrong":"I know Mia since 2019.","right":"I **have known** Mia since 2019."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I ___ Mr Chan yesterday.","options":["saw","have seen","see"],"answer":0,"why":"Yesterday is a finished time, so use the past simple."},{"type":"mc","q":"___ you ever been to Ocean Park?","options":["Did","Have","Were"],"answer":1,"why":"Ever + been = an experience: Have you ever been …?"},{"type":"mc","q":"We ___ to Japan in 2022.","options":["went","have gone","have been"],"answer":0,"why":"In 2022 is a finished time: went."},{"type":"mc","q":"Mia ___ in Hong Kong since 2019.","options":["lived","lives","has lived"],"answer":2,"why":"Since 2019 until now: present perfect."},{"type":"mc","q":"Leo ___ his tooth two days ago.","options":["has lost","lost","loses"],"answer":1,"why":"Ago = finished time, so past simple."},{"type":"mc","q":"Have you ever eaten sushi? — Yes, I ___ it last week in Japan.","options":["ate","have eaten","eat"],"answer":0,"why":"Last week is a finished time: ate."},{"type":"mc","q":"Sam ___ at this school for three years, and he still loves it.","options":["has been","was","is"],"answer":0,"why":"He is still there now, so present perfect."},{"type":"mc","q":"When ___ you start learning the piano?","options":["have","has","did"],"answer":2,"why":"Questions with When … ? use the past simple."},{"type":"mc","q":"My grandpa ___ in Shanghai for ten years when he was young. Now he lives in Hong Kong.","options":["has lived","lived","lives"],"answer":1,"why":"That time is finished, so use the past simple."},{"type":"mc","q":"Which sentence is correct?","options":["I have visit the Peak last Sunday.","I have visited the Peak last Sunday.","I visited the Peak last Sunday."],"answer":2,"why":"Last Sunday is a finished time: past simple."}]},{"name":"Practice","items":[{"type":"fill","q":"I ___ my grandma last weekend. (visit)","answer":["visited"],"why":"Last weekend is finished: past simple."},{"type":"fill","q":"I ___ my grandma in Shanghai three times so far. (visit)","answer":["have visited","'ve visited"],"why":"So far = up to now: present perfect."},{"type":"fill","q":"Leo ___ to the dentist two weeks ago. (go)","answer":["went"],"why":"Ago = finished time: went."},{"type":"fill","q":"Ava ___ her phone since Friday. She can't find it anywhere! (not see)","answer":["hasn't seen","has not seen"],"why":"Since Friday until now: hasn't seen."},{"type":"fill","q":"We ___ to Ocean Park when I was six. (go)","answer":["went"],"why":"When I was six is a finished time: went."},{"type":"fill","q":"Emma ___ the piano since she was five. (play)","answer":["has played","'s played","has been playing","'s been playing"],"why":"Since + starting point, still true now: has played."},{"type":"fill","q":"___ you watch the football match last night? (do / have)","answer":["Did","did"],"why":"Last night is finished, so the question starts with Did."},{"type":"fill","q":"Mr Chan ___ teaching at our school in 2015. (start)","answer":["started"],"why":"In 2015 is a finished time: started."},{"type":"fill","q":"Mr Chan ___ at our school for ten years now. (teach)","answer":["has taught","'s taught","has been teaching","'s been teaching"],"why":"For ten years up to now: has taught."},{"type":"fill","q":"Isabelle ___ in my class since Grade 3. (be)","answer":["has been","'s been"],"why":"Since Grade 3 until now: has been."}]},{"name":"Challenge","items":[{"type":"order","words":["I","went","to","Japan","last","summer"],"end":".","alt":[["last","summer","I","went","to","Japan"]],"why":"Last summer is finished: went."},{"type":"order","words":["have","you","ever","eaten","snake","soup"],"end":"?","alt":[],"why":"Ever = experience: Have you ever eaten …?"},{"type":"order","words":["she","has","lived","in","Hong","Kong","since","2015"],"end":".","alt":[["since","2015","she","has","lived","in","Hong","Kong"]],"why":"Since 2015 until now: has lived."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I have seen Isabelle yesterday.","answer":["I saw Isabelle yesterday.","Yesterday I saw Isabelle."],"why":"Yesterday is finished, so use the past simple: saw."},{"type":"rewrite","task":"Find and fix the mistake.","s":"We have gone to Beijing in 2023.","answer":["We went to Beijing in 2023.","In 2023 we went to Beijing."],"why":"In 2023 is a finished time: went."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I know Leo since we were five.","answer":["I have known Leo since we were five.","I've known Leo since we were five."],"why":"Since + until now needs the present perfect: have known."},{"type":"rewrite","task":"Find and fix the mistake.","s":"When have you arrived?","answer":["When did you arrive?"],"why":"When … ? questions use the past simple."},{"type":"rewrite","task":"Change 'already' to 'yesterday'.","s":"I have already cleaned my room.","answer":["I cleaned my room yesterday.","Yesterday I cleaned my room."],"why":"Yesterday is a finished time, so use the past simple."}]}]},{"id":"questions","num":27,"title":"Questions & Negatives","zh":"疑问句和否定句","bigIdea":"To ask a question in English, put a **helper verb** (do, does, did, is, are, can, have) in front of the subject: **Do** you like pizza? To say 'no', put **not** (n't) after the helper: I **don't** like pizza. Question words like what, where and why go at the very front.","zhNote":"中文问句常常只在句末加“吗”，语序不变；英语要把助动词（do/does/did/is/can/have…）放到主语前面。否定句也要用“助动词 + not”，而且 does/did 后面的动词要变回原形。","rules":[{"rule":"With be, can or have: move the helper to the front.","examples":["She is happy. → **Is** she happy?","You can swim. → **Can** you swim?","They have finished. → **Have** they finished?"]},{"rule":"No helper? Use do / does / did. The main verb goes back to its base form.","examples":["You like dim sum. → **Do** you like dim sum?","He plays chess. → **Does** he **play** chess?","Mia went home. → **Did** Mia **go** home?"]},{"rule":"Wh-questions: question word + helper + subject + verb.","examples":["**Where** do you live?","**What** is she reading?","**How many** books did you borrow?"]},{"rule":"Negatives: helper + not (n't). After doesn't / didn't, use the base verb.","examples":["I am **not** tired.","He **doesn't like** spinach.","We **didn't go** out yesterday."]},{"rule":"When who or what is the subject (the doer), don't use do / does / did.","examples":["**Who broke** the window?","**What happened**?","**Who wants** ice cream?"]}],"tip":"Question order = Q-H-S-V: Question word, Helper, Subject, Verb. Remember it as 'Quiet Hamsters Sleep Very well'!","mistakes":[{"wrong":"Where you live?","right":"Where **do** you live?"},{"wrong":"Does she likes cats?","right":"Does she **like** cats?"},{"wrong":"He didn't went to school.","right":"He didn't **go** to school."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"___ you like dim sum?","options":["Does","Are","Do"],"answer":2,"why":"With 'you', we use Do to make a question."},{"type":"mc","q":"___ Emma play the piano?","options":["Do","Does","Is"],"answer":1,"why":"Emma = she, so we use Does."},{"type":"mc","q":"___ they at school yesterday?","options":["Were","Did","Was"],"answer":0,"why":"The verb is 'be' in the past. With 'they' we use were."},{"type":"mc","q":"___ you ever been to Victoria Peak?","options":["Did","Do","Have"],"answer":2,"why":"'been' is present perfect, so the helper is have."},{"type":"mc","q":"Does Leo ___ football?","options":["plays","play","playing"],"answer":1,"why":"After does, use the base verb with no -s."},{"type":"mc","q":"___ do you live? — In Sha Tin.","options":["What","Who","Where"],"answer":2,"why":"The answer is a place, so we ask Where."},{"type":"mc","q":"___ do you go swimming? — Twice a week.","options":["How often","How long","How many"],"answer":0,"why":"'Twice a week' tells us how many times, so we ask How often."},{"type":"mc","q":"Which sentence is correct?","options":["Where she is going?","Where is she going?","Where she going is?"],"answer":1,"why":"Question word, then helper (is), then subject (she), then verb."},{"type":"mc","q":"Which sentence is correct?","options":["He doesn't likes broccoli.","He don't like broccoli.","He doesn't like broccoli."],"answer":2,"why":"He → doesn't, and after doesn't the verb has no -s."},{"type":"mc","q":"Who ___ the window? — Sam did.","options":["did broke","broke","breaked"],"answer":1,"why":"'Who' is the doer here, so no did. Just use the past verb broke."}]},{"name":"Practice","items":[{"type":"fill","q":"___ you like bubble tea?","answer":["Do"],"why":"With 'you' in the present, start the question with Do."},{"type":"fill","q":"___ your brother play basketball?","answer":["Does"],"why":"Your brother = he, so we use Does."},{"type":"fill","q":"___ you go to the beach last Sunday?","answer":["Did"],"why":"'Last Sunday' is the past, so we use Did."},{"type":"fill","q":"Mia ___ horror films. (not / like)","answer":["doesn't like","does not like","didn't like","did not like"],"why":"Mia = she, so doesn't + base verb like."},{"type":"fill","q":"We ___ Mr Chan yesterday. (not / see)","answer":["didn't see","did not see"],"why":"Past negative: didn't + base verb see."},{"type":"fill","q":"___ is your best friend? — Isabelle.","answer":["Who"],"why":"The answer is a person, so we ask Who."},{"type":"fill","q":"___ did you get to school today? — By MTR.","answer":["How"],"why":"'By MTR' tells us the way, so we ask How."},{"type":"fill","q":"___ were you late? — Because I missed the bus.","answer":["Why"],"why":"The answer starts with 'because', so we ask Why."},{"type":"fill","q":"___ books did you read last month? — Five.","answer":["How many"],"why":"We can count books, so we ask How many."},{"type":"fill","q":"___ bag is this? — It's Ava's.","answer":["Whose"],"why":"We want to know who owns it, so we ask Whose."}]},{"name":"Challenge","items":[{"type":"order","words":["does","your","cat","like","fish"],"end":"?","alt":[],"why":"Helper (does) + subject (your cat) + base verb (like)."},{"type":"rewrite","task":"Make it a question.","s":"Sam can ride a bike.","answer":["Can Sam ride a bike?"],"why":"Move 'can' to the front, before the subject."},{"type":"rewrite","task":"Make it a question.","s":"Isabelle lives in Tai Po.","answer":["Does Isabelle live in Tai Po?"],"why":"Add Does at the front, and lives goes back to live."},{"type":"rewrite","task":"Make it negative.","s":"They went to Ocean Park.","answer":["They didn't go to Ocean Park.","They did not go to Ocean Park."],"why":"Past negative: didn't + base verb, so went becomes go."},{"type":"order","words":["where","did","you","go","last","summer"],"end":"?","alt":[],"why":"Question word + helper + subject + base verb."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Why you are sad?","answer":["Why are you sad?"],"why":"In a question, the helper (are) comes before the subject (you)."},{"type":"order","words":["who","ate","the","last","egg","tart"],"end":"?","alt":[],"why":"'Who' is the doer, so no did — just who + past verb."},{"type":"order","words":["how","long","have","you","lived","in","Hong","Kong"],"end":"?","alt":[],"why":"How long + have + you + lived: question word, helper, subject, verb."}]}]},{"id":"modals","num":28,"title":"Modal Verbs: can, could, must, should, may, might","zh":"情态动词","bigIdea":"Modal verbs are little helpers like **can**, **should** and **must**. They show if something is possible, a good idea, or very important. After a modal, always use the plain base verb: no 'to' and no '-s' — She **can swim**.","zhNote":"情态动词（can, must, should, may…）后面直接跟动词原形，不加 to，也不加 -s，即使主语是 he/she/it。特别注意：mustn't 是“禁止、不可以”，don't have to 是“不必、不需要”，意思完全不同。","rules":[{"rule":"Modal + base verb. No 'to', no '-s' — not even with he, she or it.","examples":["She **can swim** very fast.","He **should eat** more vegetables.","He musts to go. → He **must go**."]},{"rule":"Ability: can (now), could (in the past). Permission: can or may.","examples":["I **can** play the piano.","When I was five, I **could** read.","**May** I go to the toilet, please?"]},{"rule":"Advice (a good idea): should / shouldn't.","examples":["You **should** wear a jacket. It's cold.","You **shouldn't** eat too many sweets."]},{"rule":"must / have to = necessary. mustn't = not allowed. don't have to = not necessary.","examples":["You **must** (or **have to**) wear a uniform.","You **mustn't** run near the pool.","We **don't have to** go to school on Sunday."]},{"rule":"Possibility (maybe): may, might, could.","examples":["It **might** rain later.","Ms Lee **may** be in the library.","That **could** be Leo's bag."]}],"tip":"mustn't = STOP, don't do it! don't have to = RELAX, you can if you want to.","mistakes":[{"wrong":"She can sings well.","right":"She can **sing** well."},{"wrong":"You must to wear a helmet.","right":"You must **wear** a helmet."},{"wrong":"You mustn't bring lunch. The school gives you lunch.","right":"You **don't have to** bring lunch. The school gives you lunch."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Ava can ___ the guitar.","options":["plays","to play","play"],"answer":2,"why":"After can, use the base verb: no -s, no to."},{"type":"mc","q":"You should ___ your teeth twice a day.","options":["brush","to brush","brushes"],"answer":0,"why":"After should, use the base verb."},{"type":"mc","q":"He ___ ride a bike when he was four.","options":["can","could","cans"],"answer":1,"why":"'When he was four' is the past, so we use could."},{"type":"mc","q":"It's very cold. You ___ wear a coat.","options":["should","shouldn't","mustn't"],"answer":0,"why":"Wearing a coat is a good idea, so we use should."},{"type":"mc","q":"You ___ eat or drink on the MTR. It's not allowed.","options":["mustn't","don't have to","should"],"answer":0,"why":"Not allowed = mustn't."},{"type":"mc","q":"Tomorrow is Saturday, so we ___ get up early.","options":["mustn't","don't have to","must"],"answer":1,"why":"It's not necessary to get up early, so don't have to."},{"type":"mc","q":"Look at those dark clouds! It ___ rain.","options":["must to","mights","might"],"answer":2,"why":"Might = maybe. It has no -s and no to."},{"type":"mc","q":"(Asking for permission) ___ I borrow your pencil, please?","options":["Must","May","Should"],"answer":1,"why":"We use may (or can) to ask for permission politely."},{"type":"mc","q":"Which sentence is correct?","options":["Leo cans speak French.","Leo can speaks French.","Leo can speak French."],"answer":2,"why":"can + base verb. Modals never take -s."},{"type":"mc","q":"Which sentence means 'It is not necessary'?","options":["You mustn't bring an umbrella.","You don't have to bring an umbrella.","You can't bring an umbrella."],"answer":1,"why":"Don't have to = not necessary. Mustn't and can't = not allowed."}]},{"name":"Practice","items":[{"type":"fill","q":"My dad can ___ very good dumplings. (make)","answer":["make"],"why":"After can, use the base verb with no -s."},{"type":"fill","q":"Mia should ___ to bed earlier. (go)","answer":["go"],"why":"After should, use the base verb."},{"type":"fill","q":"When I was six, I ___ swim 50 metres. I was very fast! (can, past)","answer":["could"],"why":"The past of can is could."},{"type":"fill","q":"You ___ touch the hot pan! It's dangerous. (must, negative)","answer":["mustn't","must not"],"why":"It's not allowed, so we use mustn't."},{"type":"fill","q":"We ___ wear a uniform on Friday. It's free-dress day. (have to, negative)","answer":["don't have to","do not have to"],"why":"A uniform is not necessary, so don't have to."},{"type":"fill","q":"Emma ___ practise the piano every day. (have to)","answer":["has to"],"why":"With he/she/it, have to becomes has to."},{"type":"fill","q":"You look tired. You ___ have a rest. (advice)","answer":["should","ought to"],"why":"For advice, we use should."},{"type":"fill","q":"You ___ eat so many sweets. They're bad for your teeth. (advice, negative)","answer":["shouldn't","should not"],"why":"It's not a good idea, so we use shouldn't."},{"type":"fill","q":"Take an umbrella. It ___ rain this afternoon. (maybe)","answer":["might","may","could"],"why":"For maybe, use might, may or could."},{"type":"fill","q":"Sam isn't at school today. He ___ be ill. (maybe)","answer":["might","may","could"],"why":"We're not sure, so we use might, may or could."}]},{"name":"Challenge","items":[{"type":"order","words":["you","should","drink","more","water"],"end":".","alt":[],"why":"should + base verb (drink)."},{"type":"rewrite","task":"Find and fix the mistake.","s":"She can dances very well.","answer":["She can dance very well."],"why":"After can, use the base verb: dance, not dances."},{"type":"rewrite","task":"Find and fix the mistake.","s":"We must to finish our project today.","answer":["We must finish our project today."],"why":"No 'to' after must."},{"type":"order","words":["may","I","open","the","window","please"],"end":"?","alt":[["please","may","I","open","the","window"]],"why":"May + I + base verb asks for permission politely."},{"type":"rewrite","task":"Make it negative (it is NOT necessary).","s":"You have to bring your lunch tomorrow.","answer":["You don't have to bring your lunch tomorrow.","You do not have to bring your lunch tomorrow."],"why":"Not necessary = don't have to."},{"type":"order","words":["we","mustn't","run","in","the","corridor"],"end":".","alt":[],"why":"mustn't + base verb = it's not allowed."},{"type":"rewrite","task":"Rewrite using 'might'.","s":"Maybe it will snow in Beijing.","answer":["It might snow in Beijing.","In Beijing it might snow."],"why":"Might means maybe, and it is followed by the base verb snow."},{"type":"rewrite","task":"Find and fix the mistake.","s":"When he was little, Leo can't read.","answer":["When he was little, Leo couldn't read.","When he was little, Leo could not read."],"why":"'When he was little' is the past, so can't becomes couldn't."}]}]},{"id":"conjunctions","num":29,"title":"Joining Words: and, but, or, so, because","zh":"连词 and/but/or/so/because","bigIdea":"Joining words (conjunctions) glue two ideas together to make one longer sentence. **and** adds, **but** shows something different, **or** gives a choice, **because** gives the reason, and **so** tells the result.","zhNote":"中文常说“因为……所以……”，但英语里 because 和 so 不能在同一个句子里一起用！只选一个：because 后面接原因，so 后面接结果。","rules":[{"rule":"and = adds more information.","examples":["I like cats **and** dogs.","Leo plays the piano **and** sings in the choir."]},{"rule":"but = something different or surprising.","examples":["The cake is small **but** delicious.","I wanted to go out, **but** it was raining."]},{"rule":"or = a choice.","examples":["Do you want tea **or** juice?","We can walk **or** take the bus."]},{"rule":"because = the reason (why?). so = the result (what happened?).","examples":["I'm hungry **because** I didn't eat breakfast.","I didn't eat breakfast, **so** I'm hungry."]},{"rule":"Never use because and so in the same sentence. Choose one!","examples":["Because it rained, so we stayed home. → It rained, **so** we stayed home.","Because it rained, so we stayed home. → We stayed home **because** it rained."]}],"tip":"BECAUSE looks back (why did it happen?). SO looks forward (what happened next?).","mistakes":[{"wrong":"Because I was tired, so I went to bed.","right":"I was tired, **so** I went to bed."},{"wrong":"I studied hard because I passed the test.","right":"I studied hard, **so** I passed the test."},{"wrong":"I like apples but I like bananas.","right":"I like apples **and** I like bananas."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I have a cat ___ a dog.","options":["and","but","or"],"answer":0,"why":"We are adding information, so we use and."},{"type":"mc","q":"Do you want rice ___ noodles?","options":["so","or","because"],"answer":1,"why":"It's a choice between two things, so we use or."},{"type":"mc","q":"My bag is old, ___ it's still very useful.","options":["or","because","but"],"answer":2,"why":"Old but useful — the second idea is different, so but."},{"type":"mc","q":"I was thirsty, ___ I drank some water.","options":["because","so","or"],"answer":1,"why":"Drinking water is the result, so we use so."},{"type":"mc","q":"I drank some water ___ I was thirsty.","options":["so","but","because"],"answer":2,"why":"Being thirsty is the reason, so we use because."},{"type":"mc","q":"It was raining, ___ we stayed inside.","options":["so","because","or"],"answer":0,"why":"Staying inside is the result of the rain, so we use so."},{"type":"mc","q":"Mia is happy ___ she got a new puppy.","options":["so","because","or"],"answer":1,"why":"The puppy is the reason she is happy, so because."},{"type":"mc","q":"Sam is good at maths, ___ he finds English hard.","options":["so","but","or"],"answer":1,"why":"Good at maths, hard at English — different ideas, so but."},{"type":"mc","q":"Which sentence is correct and makes sense?","options":["Because it was late, so we went home.","It was late, so we went home.","It was late because we went home."],"answer":1,"why":"Use only so here. Never put because and so together."},{"type":"mc","q":"Which sentence makes sense?","options":["I got wet, so I forgot my umbrella.","So I forgot my umbrella, I got wet.","I forgot my umbrella, so I got wet."],"answer":2,"why":"Forgetting the umbrella came first. Getting wet is the result."}]},{"name":"Practice","items":[{"type":"fill","q":"I like swimming ___ playing badminton.","answer":["and"],"why":"We are adding a second thing she likes, so and."},{"type":"fill","q":"Would you like a pen ___ a pencil?","answer":["or"],"why":"It's a choice, so we use or."},{"type":"fill","q":"Leo is small, ___ he is very strong.","answer":["but","yet"],"why":"Small but strong — a surprise, so we use but."},{"type":"fill","q":"The MTR was very crowded, ___ we took a taxi. (result)","answer":["so","and so","and"],"why":"Taking a taxi is the result, so we use so."},{"type":"fill","q":"We took a taxi ___ the MTR was very crowded. (reason)","answer":["because","as","since"],"why":"The crowded MTR is the reason, so we use because."},{"type":"fill","q":"Ava had a fever, ___ she didn't go to school. (result)","answer":["so","and so","and"],"why":"Staying home is the result of the fever, so we use so."},{"type":"fill","q":"Ava didn't go to school ___ she had a fever. (reason)","answer":["because","as","since"],"why":"The fever is the reason, so we use because."},{"type":"fill","q":"I wanted to play outside, ___ there was a typhoon.","answer":["but"],"why":"She wanted to, but something stopped her — that's but."},{"type":"fill","q":"Hurry up, ___ we will miss the bus!","answer":["or","or else"],"why":"Or here means 'if you don't'."},{"type":"fill","q":"Emma practised every day, ___ she won the piano competition. (result)","answer":["so","and so","and"],"why":"Winning is the result of practising, so we use so."}]},{"name":"Challenge","items":[{"type":"order","words":["I","like","dim","sum","and","noodles"],"end":".","alt":[["I","like","noodles","and","dim","sum"]],"why":"And joins two things you like."},{"type":"order","words":["do","you","want","juice","or","milk"],"end":"?","alt":[["do","you","want","milk","or","juice"]],"why":"Or gives a choice between two things."},{"type":"rewrite","task":"Join the sentences using 'but'.","s":"The test was hard. I passed it.","answer":["The test was hard, but I passed it.","The test was hard but I passed it."],"why":"Hard but passed — a surprise, so we join with but."},{"type":"rewrite","task":"Join the sentences using 'so'.","s":"It was hot. We went to the beach.","answer":["It was hot, so we went to the beach.","It was hot so we went to the beach."],"why":"Going to the beach is the result, so it comes after so."},{"type":"rewrite","task":"Join the sentences using 'because'.","s":"We went to the beach. It was hot.","answer":["We went to the beach because it was hot.","Because it was hot, we went to the beach.","Because it was hot we went to the beach."],"why":"The hot weather is the reason, so it goes after because."},{"type":"order","words":["she","was","tired","so","she","went","to","bed","early"],"end":".","alt":[],"why":"First the cause (tired), then so + the result."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Because Leo was sick, so he stayed at home.","answer":["Because Leo was sick, he stayed at home.","Because Leo was sick he stayed at home.","Leo was sick, so he stayed at home.","Leo was sick so he stayed at home.","Leo stayed at home because he was sick."],"why":"Use because OR so, never both in one sentence."},{"type":"rewrite","task":"Rewrite the sentence using 'so' instead of 'because'.","s":"I didn't hear the alarm because I was very sleepy.","answer":["I was very sleepy, so I didn't hear the alarm.","I was very sleepy so I didn't hear the alarm."],"why":"With so, the reason comes first and the result comes after so."}]}]},{"id":"complex","num":30,"title":"Bigger Sentences: when, if, although, while, before, after, until, unless","zh":"复合句","bigIdea":"Words like **when**, **if**, **before**, **after**, **until**, **while**, **although** and **unless** join two ideas and tell us about time, conditions or surprises. The part with the joining word can go first or second. If it goes first, put a **comma** after it.","zhNote":"中文说“虽然……但是……”，英语只能用 although 或 but 其中一个，不能一起用。另外，when / if / before / after / until 后面说将来的事情时，用一般现在时，不用 will：When I get home, I will call you.","rules":[{"rule":"Time words: when, before, after, while, until.","examples":["Look both ways **before** you cross the road.","I was reading **while** Mum was cooking.","We waited **until** the rain stopped."]},{"rule":"if = on this condition. unless = if … not.","examples":["**If** it rains, we will stay inside.","You will be late **unless** you hurry. (= if you don't hurry)"]},{"rule":"Joining part first → put a comma after it. Joining part second → usually no comma.","examples":["**When** I got home, I had a snack.","I had a snack **when** I got home."]},{"rule":"although and but mean almost the same. Use only ONE of them.","examples":["**Although** it was cold, we went swimming.","It was cold, **but** we went swimming.","Although it was cold, but we went swimming. → **Although** it was cold, we went swimming."]},{"rule":"Talking about the future? Use the present tense after when, if, before, after and until.","examples":["**When** I **get** home, I will call you.","**If** it **rains** tomorrow, we will stay inside.","I'll wait **until** you **finish**."]}],"tip":"Joining word first? Add a comma! And remember: 'although' and 'but' are not friends — they never sit in the same sentence.","mistakes":[{"wrong":"Although it was raining, but we played outside.","right":"**Although** it was raining, we played outside."},{"wrong":"When I will get home, I will call you.","right":"When I **get** home, I will call you."},{"wrong":"If you will study, you will pass.","right":"If you **study**, you will pass."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Look both ways ___ you cross the road.","options":["before","after","until"],"answer":0,"why":"You look first and then cross, so we use before."},{"type":"mc","q":"I was reading a book ___ my brother was playing games.","options":["unless","while","until"],"answer":1,"why":"Both things happened at the same time, so we use while."},{"type":"mc","q":"We waited at the bus stop ___ the bus came.","options":["until","while","although"],"answer":0,"why":"We waited, then stopped waiting when the bus came — until."},{"type":"mc","q":"___ it rains tomorrow, we will stay at home.","options":["Although","Until","If"],"answer":2,"why":"Staying home depends on the rain, so we use if."},{"type":"mc","q":"When I ___ home, I will call you.","options":["will get","get","got"],"answer":1,"why":"After when, use the present tense for the future: get, not will get."},{"type":"mc","q":"If Emma ___ hard, she will pass the test.","options":["study","studies","will study"],"answer":1,"why":"After if, use the present tense. Emma = she, so studies."},{"type":"mc","q":"___ it was raining heavily, we still played football outside.","options":["Although","Because","Unless"],"answer":0,"why":"Rain but still played — a surprise, so we use although."},{"type":"mc","q":"You will miss the bus ___ you hurry.","options":["unless","if","although"],"answer":0,"why":"Unless = if not. You'll miss it if you don't hurry."},{"type":"mc","q":"Which sentence is correct?","options":["Although the film was long, but it was fun.","Although the film was long, it was fun.","The film was long, but although it was fun."],"answer":1,"why":"Use although OR but, never both."},{"type":"mc","q":"Which sentence is correct?","options":["After I will finish my homework, I will watch TV.","After I finished my homework, I will watch TV.","After I finish my homework, I will watch TV."],"answer":2,"why":"For the future, use the present tense after 'after': finish."}]},{"name":"Practice","items":[{"type":"fill","q":"Brush your teeth ___ you go to bed. (before / after)","answer":["before"],"why":"You brush first, then go to bed."},{"type":"fill","q":"We had ice cream for dessert ___ we finished dinner. (before / after)","answer":["after"],"why":"Dessert comes after dinner."},{"type":"fill","q":"Mum was cooking ___ I was doing my homework. (at the same time)","answer":["while","when","as"],"why":"At the same time = while."},{"type":"fill","q":"Please wait here ___ I come back.","answer":["until","till"],"why":"Keep waiting, and stop when I come back — until."},{"type":"fill","q":"___ you don't hurry, you will be late. (if / unless)","answer":["If"],"why":"If you don't hurry = unless you hurry. Don't use unless with don't."},{"type":"fill","q":"You will be late ___ you hurry. (if / unless)","answer":["unless"],"why":"Unless you hurry = if you don't hurry."},{"type":"fill","q":"___ Sam is only eleven, he can speak four languages.","answer":["Although","Though","Even though"],"why":"Only eleven but four languages — a surprise, so although."},{"type":"fill","q":"When I ___ home, I will feed the cat. (get)","answer":["get"],"why":"After when, use the present tense for the future."},{"type":"fill","q":"If it ___ tomorrow, we will have the picnic indoors. (rain)","answer":["rains"],"why":"After if, use the present tense. It → rains."},{"type":"fill","q":"I will text you after the film ___. (finish)","answer":["finishes","has finished"],"why":"After 'after', use the present tense for the future. The film → finishes."}]},{"name":"Challenge","items":[{"type":"order","words":["if","you","are","hungry","eat","an","apple"],"end":".","alt":[["eat","an","apple","if","you","are","hungry"]],"why":"If + condition, then the instruction. A comma goes after hungry."},{"type":"rewrite","task":"Join the sentences using 'when'.","s":"I got home. I had a snack.","answer":["When I got home, I had a snack.","When I got home I had a snack.","I had a snack when I got home."],"why":"When joins the two times. Comma if the when-part comes first."},{"type":"order","words":["we","stayed","inside","until","the","typhoon","passed"],"end":".","alt":[["until","the","typhoon","passed","we","stayed","inside"]],"why":"Until tells us when staying inside stopped."},{"type":"rewrite","task":"Join the sentences using 'although'.","s":"It was raining. We played outside.","answer":["Although it was raining, we played outside.","Although it was raining we played outside.","We played outside although it was raining.","We played outside, although it was raining."],"why":"Although shows a surprise. Don't add but."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Although the test was hard, but I passed it.","answer":["Although the test was hard, I passed it.","Although the test was hard I passed it.","The test was hard, but I passed it.","The test was hard but I passed it."],"why":"Use although OR but — not both."},{"type":"rewrite","task":"Find and fix the mistake.","s":"When I will grow up, I will be a vet.","answer":["When I grow up, I will be a vet.","When I grow up I will be a vet.","I will be a vet when I grow up."],"why":"After when, use the present tense for the future: grow, not will grow."},{"type":"order","words":["before","you","go","out","put","on","your","jacket"],"end":".","alt":[["put","on","your","jacket","before","you","go","out"],["put","your","jacket","on","before","you","go","out"],["before","you","go","out","put","your","jacket","on"]],"why":"Before tells us which thing happens first."},{"type":"rewrite","task":"Rewrite the sentence using 'unless'.","s":"If you don't take your medicine, you won't get better.","answer":["Unless you take your medicine, you won't get better.","Unless you take your medicine you won't get better.","You won't get better unless you take your medicine.","You will not get better unless you take your medicine."],"why":"Unless = if not, so 'if you don't take' becomes 'unless you take'."}]}]},{"id":"relative","num":31,"title":"Relative Clauses: who, which, that, where, whose","zh":"定语从句","bigIdea":"A relative clause is a mini-description that comes right after a noun and tells us which one we mean. It starts with **who**, **which**, **that**, **where** or **whose**: The girl **who sits next to me** is Mia.","zhNote":"中文把修饰的部分放在名词前面（“坐在我旁边的女孩”），英语却放在名词后面（the girl who sits next to me）。who / which 已经代替了 she / it，后面不要再重复。","rules":[{"rule":"who = for people.","examples":["The boy **who** won the race is Leo.","I have a friend **who** can speak Japanese."]},{"rule":"which = for things (and animals).","examples":["The book **which** I borrowed is great.","The bus **which** goes to Stanley is a double-decker."]},{"rule":"that = for people OR things.","examples":["The cake **that** Mum made was yummy.","The girl **that** sings in the choir is Ava."]},{"rule":"where = for places. whose = for belonging (his / her / their).","examples":["This is the park **where** we play football.","That's the boy **whose** dad is a pilot."]},{"rule":"Don't repeat the person or thing. who / which already stands for it.","examples":["the girl who she sings → the girl **who** sings","the book which I read it → the book **which** I read"]}],"tip":"WHO for people, WHICH for things, WHERE for places, WHOSE for 'his / her / their'. THAT can help people and things!","mistakes":[{"wrong":"The girl who she lives next door is Isabelle.","right":"The girl **who lives** next door is Isabelle."},{"wrong":"The book who I bought is about space.","right":"The book **that** I bought is about space."},{"wrong":"This is the museum which we saw the dinosaurs.","right":"This is the museum **where** we saw the dinosaurs."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"The boy ___ won the race is my cousin.","options":["who","which","where"],"answer":0,"why":"A boy is a person, so we use who."},{"type":"mc","q":"The pizza ___ we ordered was cold.","options":["who","which","where"],"answer":1,"why":"Pizza is a thing, so we use which."},{"type":"mc","q":"This is the restaurant ___ we eat dim sum on Sundays.","options":["which","who","where"],"answer":2,"why":"A restaurant is a place where something happens, so where."},{"type":"mc","q":"That's the girl ___ mum is a doctor.","options":["who","whose","which"],"answer":1,"why":"Her mum = the girl's mum. For belonging, use whose."},{"type":"mc","q":"I have a friend ___ can speak Japanese.","options":["which","who","where"],"answer":1,"why":"A friend is a person, so we use who."},{"type":"mc","q":"The phone ___ Dad bought is very fast.","options":["where","whose","that"],"answer":2,"why":"A phone is a thing. That works for things."},{"type":"mc","q":"Hong Kong is the city ___ I was born.","options":["which","where","who"],"answer":1,"why":"A city is a place where I was born, so where."},{"type":"mc","q":"The teacher ___ teaches us music is Ms Lee.","options":["who","which","whose"],"answer":0,"why":"A teacher is a person, so we use who."},{"type":"mc","q":"Which sentence is correct?","options":["The girl who she sits next to me is kind.","The girl who sits next to me is kind.","The girl which sits next to me is kind."],"answer":1,"why":"Who for people, and don't repeat 'she' after who."},{"type":"mc","q":"Which sentence is correct?","options":["This is the book which I told you about it.","This is the book where I told you about.","This is the book that I told you about."],"answer":2,"why":"That for a thing, and don't repeat 'it' at the end."}]},{"name":"Practice","items":[{"type":"fill","q":"A vet is a person ___ looks after sick animals.","answer":["who","that"],"why":"A vet is a person, so who (or that)."},{"type":"fill","q":"A fridge is a machine ___ keeps food cold.","answer":["which","that"],"why":"A fridge is a thing, so which (or that)."},{"type":"fill","q":"Ocean Park is a place ___ you can see pandas.","answer":["where","in which"],"why":"It's a place where something happens, so where."},{"type":"fill","q":"Mia is the girl ___ dog is called Mochi.","answer":["whose"],"why":"The dog belongs to Mia, so we use whose."},{"type":"fill","q":"The cake ___ Grandma made was delicious.","answer":["which","that"],"why":"A cake is a thing, so which (or that)."},{"type":"fill","q":"Mr Chan is the teacher ___ helped me with maths.","answer":["who","that"],"why":"Mr Chan is a person, so who (or that)."},{"type":"fill","q":"This is the beach ___ we found the starfish.","answer":["where","on which"],"why":"A beach is a place where something happened, so where."},{"type":"fill","q":"I know a boy ___ sister plays for the Hong Kong team.","answer":["whose"],"why":"His sister = the boy's sister, so whose."},{"type":"fill","q":"The Peak Tram is a tram ___ goes up to Victoria Peak.","answer":["which","that"],"why":"A tram is a thing, so which (or that)."},{"type":"fill","q":"I lost the umbrella ___ my aunt gave me.","answer":["which","that"],"why":"An umbrella is a thing, so which (or that)."}]},{"name":"Challenge","items":[{"type":"order","words":["the","girl","who","sings","is","my","sister"],"end":".","alt":[["my","sister","is","the","girl","who","sings"]],"why":"'Who sings' comes right after 'the girl' to describe her."},{"type":"order","words":["this","is","the","park","where","we","play"],"end":".","alt":[],"why":"A park is a place, so where comes after it."},{"type":"rewrite","task":"Join the sentences using 'who'.","s":"I have a friend. She lives in Stanley.","answer":["I have a friend who lives in Stanley."],"why":"Who takes the place of 'she', so we drop 'she'."},{"type":"rewrite","task":"Join the sentences using 'which'.","s":"I read a book. It was about volcanoes.","answer":["I read a book which was about volcanoes."],"why":"Which takes the place of 'it', so we drop 'it'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"The boy who he broke the window said sorry.","answer":["The boy who broke the window said sorry.","The boy that broke the window said sorry."],"why":"Who already means 'the boy', so remove 'he'."},{"type":"rewrite","task":"Join the sentences using 'whose'.","s":"That's the boy. His dad is a pilot.","answer":["That's the boy whose dad is a pilot.","That is the boy whose dad is a pilot."],"why":"Whose takes the place of 'his'."},{"type":"order","words":["the","cake","that","Mum","made","was","delicious"],"end":".","alt":[],"why":"'That Mum made' comes right after 'the cake' to describe it."},{"type":"rewrite","task":"Find and fix the mistake.","s":"The dumplings which we ate them were very tasty.","answer":["The dumplings which we ate were very tasty.","The dumplings that we ate were very tasty.","The dumplings we ate were very tasty."],"why":"Which already means 'the dumplings', so remove 'them'."}]}]},{"id":"gerund-infinitive","num":32,"title":"-ing or to? (Gerunds & Infinitives)","zh":"动名词和不定式","bigIdea":"When one verb follows another, the second verb changes. Some verbs want **-ing** (I **enjoy swimming**), and some want **to + verb** (I **want to swim**). After a little word like at, in, about or before, always use **-ing** (good **at drawing**).","zhNote":"中文两个动词可以直接连在一起（“我喜欢游泳”“我想游泳”），动词不变形；英语要看前面是哪个动词：enjoy 后面用 -ing，want 后面用 to + 动词原形。介词（at, in, before…）后面一定用 -ing。","rules":[{"rule":"These verbs + -ing: enjoy, finish, mind, stop, keep, practise (US: practice).","examples":["I **enjoy reading**.","Leo **finished doing** his homework.","Don't give up — **keep trying**!"]},{"rule":"These verbs + to + verb: want, hope, decide, need, plan, learn, would like.","examples":["I **want to be** a vet.","We **decided to go** to Lamma Island.","**Would** you **like to come** to my party?"]},{"rule":"After a preposition (at, in, of, about, for, before, after), use -ing.","examples":["Emma is good **at drawing**.","I'm interested **in learning** Japanese.","Wash your hands **before eating**."]},{"rule":"like, love, hate, start, begin: both are OK! (But would like → only 'to'.)","examples":["I like **swimming**. = I like **to swim**.","It started **raining**. = It started **to rain**.","I'd like **to swim**. (not 'I'd like swimming')"]}],"tip":"Enjoy, finish, mind, practise — they love -ING! Want, hope, decide, plan — they WANT 'to'!","mistakes":[{"wrong":"I enjoy to play the piano.","right":"I enjoy **playing** the piano."},{"wrong":"I want going to Ocean Park.","right":"I want **to go** to Ocean Park."},{"wrong":"Mia is good at swim.","right":"Mia is good at **swimming**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I enjoy ___ comics.","options":["reading","to read","read"],"answer":0,"why":"Enjoy is followed by -ing."},{"type":"mc","q":"Leo wants ___ a vet.","options":["being","to be","be"],"answer":1,"why":"Want is followed by to + verb."},{"type":"mc","q":"Have you finished ___ your room?","options":["to tidy","tidy","tidying"],"answer":2,"why":"Finish is followed by -ing."},{"type":"mc","q":"We hope ___ Japan next summer.","options":["visiting","to visit","visit"],"answer":1,"why":"Hope is followed by to + verb."},{"type":"mc","q":"Emma is good at ___.","options":["draw","to draw","drawing"],"answer":2,"why":"After a preposition like 'at', use -ing."},{"type":"mc","q":"Do you mind ___ the window?","options":["opening","to open","open"],"answer":0,"why":"Mind is followed by -ing."},{"type":"mc","q":"It was raining, so we decided ___ a taxi.","options":["taking","take","to take"],"answer":2,"why":"Decide is followed by to + verb."},{"type":"mc","q":"She is interested in ___ about space.","options":["to learn","learning","learn"],"answer":1,"why":"After a preposition like 'in', use -ing."},{"type":"mc","q":"Would you like ___ some dim sum?","options":["to have","having","have"],"answer":0,"why":"Would like is always followed by to + verb."},{"type":"mc","q":"Which sentence is NOT correct?","options":["I like swimming.","I like to swim.","I enjoy to swim."],"answer":2,"why":"Like can take both, but enjoy only takes -ing."}]},{"name":"Practice","items":[{"type":"fill","q":"Ava enjoys ___ the piano. (play)","answer":["playing"],"why":"Enjoy + -ing."},{"type":"fill","q":"I want ___ a new storybook. (buy)","answer":["to buy"],"why":"Want + to + verb."},{"type":"fill","q":"Please stop ___! I'm trying to sleep. (talk)","answer":["talking"],"why":"Stop + -ing means 'don't do it any more'."},{"type":"fill","q":"We need ___ some milk on the way home. (get)","answer":["to get","to buy"],"why":"Need + to + verb."},{"type":"fill","q":"Sam keeps ___ his water bottle at school. (forget)","answer":["forgetting","leaving"],"why":"Keep + -ing."},{"type":"fill","q":"We are planning ___ a party for Mr Chan. (have)","answer":["to have"],"why":"Plan + to + verb."},{"type":"fill","q":"Thank you for ___ me with my homework. (help)","answer":["helping"],"why":"After the preposition 'for', use -ing."},{"type":"fill","q":"Wash your hands before ___ lunch. (eat)","answer":["eating"],"why":"After the preposition 'before', use -ing."},{"type":"fill","q":"I love ___ at the beach. (swim)","answer":["swimming","to swim"],"why":"Love can take -ing or to + verb. Both are correct!"},{"type":"fill","q":"Suddenly it started ___. (rain)","answer":["raining","to rain"],"why":"Start can take -ing or to + verb. Both are correct!"}]},{"name":"Challenge","items":[{"type":"order","words":["I","enjoy","playing","badminton","with","my","friends"],"end":".","alt":[],"why":"Enjoy + -ing (playing)."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I want go to Disneyland.","answer":["I want to go to Disneyland."],"why":"Want needs 'to' before the next verb."},{"type":"order","words":["we","decided","to","visit","Victoria","Peak"],"end":".","alt":[],"why":"Decide + to + verb."},{"type":"rewrite","task":"Find and fix the mistake.","s":"My brother enjoys to cook pasta.","answer":["My brother enjoys cooking pasta."],"why":"Enjoy is followed by -ing, not to."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Isabelle is good at play chess.","answer":["Isabelle is good at playing chess."],"why":"After the preposition 'at', use -ing."},{"type":"order","words":["she","is","interested","in","learning","about","dinosaurs"],"end":".","alt":[],"why":"After the preposition 'in', use -ing."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Would you like going to the cinema with us?","answer":["Would you like to go to the cinema with us?"],"why":"Would like is always followed by to + verb."},{"type":"rewrite","task":"Join the sentences using 'before' + -ing.","s":"I put on sunscreen. Then I go to the beach.","answer":["I put on sunscreen before going to the beach.","Before going to the beach, I put on sunscreen.","Before going to the beach I put on sunscreen.","I put sunscreen on before going to the beach.","Before going to the beach, I put sunscreen on."],"why":"After the preposition 'before', use -ing: before going."}]}]},{"id":"conditionals","num":33,"title":"If Sentences (Conditionals)","zh":"条件句","bigIdea":"An if sentence has two parts: the **if-part** (the condition) and the **result**. Some if sentences talk about facts that are always true, some talk about things that will probably happen, and some talk about imaginary things that are not real.","zhNote":"中文说“如果……就……”时动词不变，英语却要看情况选时态：真实的将来，if 部分用一般现在时（不用 will）；想象的情况，if 部分用过去式（were/had），结果用 would + 动词原形。","rules":[{"rule":"Facts that are always true (zero conditional): If + present simple, present simple.","examples":["If you **heat** ice, it **melts**.","If plants **don't get** water, they **die**.","If you **mix** red and blue, you **get** purple."]},{"rule":"Things that will probably happen (first conditional): If + present simple, will + verb.","examples":["If it **rains**, we **will stay** home.","If you **hurry**, you**'ll catch** the MTR.","If Emma **finishes** her homework, she **will play** the piano."]},{"rule":"Never put will in the if-part. Use the present simple there, even when you mean the future.","examples":["If it will rain tomorrow… → If it **rains** tomorrow…","If you will come… → If you **come**…"]},{"rule":"Imaginary or unlikely things (second conditional): If + past simple, would + verb. The past tense here does NOT mean the past – it means 'not real'.","examples":["If I **had** a dog, I **would walk** it every day.","If I **won** a million dollars, I**'d buy** a house for my family.","If we **lived** near the beach, we **would swim** every day."]},{"rule":"Giving advice: If I were you… We use were with I, he, she and it in imaginary sentences (people also say was, but were is best).","examples":["If I **were** you, I **would** ask Ms Lee for help.","If Sam **were** taller, he **would** reach the top shelf."]}],"tip":"Will never sleeps in the if-part! Real future → **present + will**. Dream world → **past + would**.","mistakes":[{"wrong":"If it will rain tomorrow, we will stay home.","right":"If it **rains** tomorrow, we will stay home."},{"wrong":"If I have wings, I would fly to the moon.","right":"If I **had** wings, I would fly to the moon."},{"wrong":"If I am you, I would tell the teacher.","right":"If I **were** you, I would tell the teacher."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"If you heat ice, it ___.","options":["melts","melted","would melt"],"answer":0,"why":"It's a fact that is always true, so we use the present simple in both parts."},{"type":"mc","q":"If you mix red and blue, you ___ purple.","options":["got","get","would get"],"answer":1,"why":"Colour mixing is always true: present simple + present simple."},{"type":"mc","q":"If it ___ tomorrow, we will stay at home.","options":["will rain","rained","rains"],"answer":2,"why":"No will in the if-part. Use the present simple: rains."},{"type":"mc","q":"If Emma finishes her homework, she ___ play the piano.","options":["will","would","is"],"answer":0,"why":"A real future plan: if + present, will + verb."},{"type":"mc","q":"If you hurry, you ___ the MTR.","options":["caught","will catch","would catch"],"answer":1,"why":"This can really happen, so we use will + verb."},{"type":"mc","q":"If I ___ a dog, I would walk it every day.","options":["had","have","will have"],"answer":0,"why":"Imaginary (I don't have a dog): if + past simple, would + verb."},{"type":"mc","q":"If I won a million dollars, I ___ buy a house for my family.","options":["will","am","would"],"answer":2,"why":"Winning a million is a dream, so we use would."},{"type":"mc","q":"If I ___ you, I would ask Ms Lee for help.","options":["am","were","be"],"answer":1,"why":"'If I were you' is how we give advice."},{"type":"mc","q":"Which sentence is correct?","options":["If it will be sunny, we will go to the beach.","If it is sunny, we will go to the beach.","If it is sunny, we would go to the beach."],"answer":1,"why":"Real future: if + present simple, will + verb. No will after if."},{"type":"mc","q":"Which sentence talks about something imaginary (not real)?","options":["If I see Leo, I will tell him.","If you press this button, the light comes on.","If I had wings, I would fly to Paris every weekend."],"answer":2,"why":"Past simple + would shows an imaginary situation. People don't have wings!"}]},{"name":"Practice","items":[{"type":"fill","q":"If you drop an egg, it ___. (break)","answer":["breaks","will break"],"why":"A fact that is always true: present simple (will break is OK too)."},{"type":"fill","q":"Water boils if you ___ it to 100°C. (heat)","answer":["heat"],"why":"A science fact: present simple in the if-part."},{"type":"fill","q":"If it ___ this afternoon, we will play football. (not rain)","answer":["doesn't rain","does not rain"],"why":"No will in the if-part: use the present simple negative."},{"type":"fill","q":"If Mia studies hard, she ___ the test. (pass)","answer":["will pass"],"why":"A real future result: will + verb."},{"type":"fill","q":"If we miss the bus, we ___ late for school. (be)","answer":["will be"],"why":"A real future result: will + be."},{"type":"fill","q":"If you ___ your umbrella, you will get wet. (forget)","answer":["forget"],"why":"The if-part uses the present simple, not will."},{"type":"fill","q":"If I had more time, I ___ more books. (read)","answer":["would read","'d read"],"why":"Imaginary: if + past simple, would + verb."},{"type":"fill","q":"If Sam ___ a bike, he would ride it to school. (have)","answer":["had"],"why":"Sam doesn't have a bike, so we use the past simple: had."},{"type":"fill","q":"If we lived near Victoria Peak, we ___ up there every weekend. (walk)","answer":["would walk","'d walk"],"why":"We don't live there – it's imaginary, so use would + verb."},{"type":"fill","q":"If I ___ you, I would wear a warm coat. (be)","answer":["were","was"],"why":"For advice we say 'If I were you…' (was is also heard)."}]},{"name":"Challenge","items":[{"type":"order","words":["if","you","heat","ice","it","melts"],"end":".","alt":[["ice","melts","if","you","heat","it"]],"why":"A fact: if + present simple, present simple."},{"type":"order","words":["if","it","rains","we","will","stay","at","home"],"end":".","alt":[["we","will","stay","at","home","if","it","rains"]],"why":"Real future: if + present simple, will + verb."},{"type":"rewrite","task":"Find and fix the mistake.","s":"If it will rain tomorrow, we will take the MTR.","answer":["If it rains tomorrow, we will take the MTR.","We will take the MTR if it rains tomorrow."],"why":"No will in the if-part: if it rains."},{"type":"order","words":["if","I","were","you","I","would","say","sorry"],"end":".","alt":[["I","would","say","sorry","if","I","were","you"]],"why":"Advice: If I were you, I would…"},{"type":"rewrite","task":"Find and fix the mistake.","s":"If I had wings, I will fly to the moon.","answer":["If I had wings, I would fly to the moon.","I would fly to the moon if I had wings."],"why":"Imaginary: past simple (had) goes with would, not will."},{"type":"rewrite","task":"Join the sentences using 'if'.","s":"Leo practises every day. He will win the race.","answer":["If Leo practises every day, he will win the race.","Leo will win the race if he practises every day.","If he practises every day, Leo will win the race.","If Leo practices every day, he will win the race.","Leo will win the race if he practices every day.","If he practices every day, Leo will win the race."],"why":"Real future: if + present simple, will + verb."},{"type":"order","words":["what","would","you","do","if","you","met","a","dragon"],"end":"?","alt":[["if","you","met","a","dragon","what","would","you","do"]],"why":"An imaginary question: would + verb, if + past simple."},{"type":"rewrite","task":"Make it imaginary (if + past simple, would + verb).","s":"If I have time, I will help you.","answer":["If I had time, I would help you.","I would help you if I had time.","If I had time, I'd help you.","I'd help you if I had time."],"why":"Imaginary: have → had, will → would."}]}]},{"id":"passive","num":34,"title":"The Passive Voice","zh":"被动语态","bigIdea":"In most sentences the doer comes first: 'Leo **kicked** the ball.' In a passive sentence, the thing that something happens to comes first: 'The ball **was kicked** (by Leo).' We use the passive when we don't know who did it, or when the doer is not important.","zhNote":"被动语态 = be 动词 + 过去分词。中文很多句子没有“被”字，例如“这座桥建于1900年”，但英语仍然要用被动：The bridge was built in 1900. 别忘了 be 动词！","rules":[{"rule":"Passive = be + past participle (the 3rd form of the verb).","examples":["make → is **made**","build → was **built**","eat → were **eaten**"]},{"rule":"Present simple passive: am / is / are + past participle.","examples":["Rice **is grown** in many parts of Asia.","These toys **are made** in Japan.","English **is spoken** at Emma's school."]},{"rule":"Past simple passive: was / were + past participle.","examples":["The Peak Tram **was built** in 1888.","The cakes **were eaten** in five minutes."]},{"rule":"Use by + the doer when it is important to say who did it.","examples":["Leo broke the window. → The window **was broken by Leo**.","Roald Dahl wrote this book. → This book **was written by Roald Dahl**."]},{"rule":"Leave out the doer when it is unknown or unimportant (someone, people). For the future, use will be + past participle.","examples":["Someone stole my bike. → My bike **was stolen**.","People speak English here. → English **is spoken** here.","The results **will be announced** next Monday."]}],"tip":"Passive = **BE + 3rd form** (made, eaten, built). Ask: Who did it? If we don't know or don't care, the passive is perfect!","mistakes":[{"wrong":"The bridge built in 1900.","right":"The bridge **was built** in 1900."},{"wrong":"The cake was eat by Mia.","right":"The cake was **eaten** by Mia."},{"wrong":"These phones is made in Korea.","right":"These phones **are** made in Korea."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Rice ___ in many parts of Asia.","options":["is grown","is grow","grown"],"answer":0,"why":"Passive = is + past participle (grown)."},{"type":"mc","q":"These toys ___ in Japan.","options":["is made","are made","are make"],"answer":1,"why":"Toys is plural, so use are + made."},{"type":"mc","q":"English ___ at Emma's school.","options":["speaks","is speak","is spoken"],"answer":2,"why":"English doesn't speak – people speak it. Passive: is spoken."},{"type":"mc","q":"The Peak Tram ___ in 1888.","options":["built","was built","were built"],"answer":1,"why":"One tram, in the past: was + built."},{"type":"mc","q":"The cakes ___ in five minutes!","options":["was eaten","were eaten","were eat"],"answer":1,"why":"Cakes is plural: were + past participle (eaten)."},{"type":"mc","q":"My bike ___ last night.","options":["stolen","was stole","was stolen"],"answer":2,"why":"Past passive: was + stolen (past participle of steal)."},{"type":"mc","q":"Harry Potter was written ___ J.K. Rowling.","options":["from","by","with"],"answer":1,"why":"We use by to show who did the action."},{"type":"mc","q":"Which sentence is passive?","options":["Leo broke the window.","Leo was breaking the window.","The window was broken by Leo."],"answer":2,"why":"The thing comes first, then was + past participle."},{"type":"mc","q":"Which sentence is correct?","options":["The letters were sent yesterday.","The letters was sent yesterday.","The letters were send yesterday."],"answer":0,"why":"Letters is plural (were), and the past participle of send is sent."},{"type":"mc","q":"The results ___ next Monday.","options":["will announce","will be announced","will announced"],"answer":1,"why":"Future passive: will be + past participle."}]},{"name":"Practice","items":[{"type":"fill","q":"Dim sum ___ in many restaurants in Hong Kong. (serve)","answer":["is served"],"why":"Present passive: is + served."},{"type":"fill","q":"These shoes ___ in Vietnam. (make)","answer":["are made"],"why":"Shoes is plural: are + made."},{"type":"fill","q":"Our classroom ___ every day. (clean)","answer":["is cleaned"],"why":"It happens every day: present passive, is + cleaned."},{"type":"fill","q":"Football ___ all over the world. (play)","answer":["is played"],"why":"Present passive: is + played."},{"type":"fill","q":"The Great Wall ___ a long time ago. (build)","answer":["was built"],"why":"In the past, one wall: was + built."},{"type":"fill","q":"Two windows ___ by the typhoon last night. (break)","answer":["were broken"],"why":"Plural, in the past: were + broken."},{"type":"fill","q":"Charlie and the Chocolate Factory ___ by Roald Dahl. (write)","answer":["was written"],"why":"The book was written in the past: was + written."},{"type":"fill","q":"All the cookies ___ by the children yesterday. (eat)","answer":["were eaten"],"why":"Cookies is plural, yesterday is past: were + eaten."},{"type":"fill","q":"The school play ___ next Friday. (will + perform)","answer":["will be performed"],"why":"Future passive: will be + past participle."},{"type":"fill","q":"My bike ___ last night. It's still here! (not steal)","answer":["wasn't stolen","was not stolen"],"why":"Negative past passive: was not + stolen."}]},{"name":"Challenge","items":[{"type":"order","words":["these","toys","are","made","in","Japan"],"end":".","alt":[],"why":"Present passive: are + made."},{"type":"order","words":["the","window","was","broken","by","a","football"],"end":".","alt":[],"why":"Past passive with by: was broken by…"},{"type":"rewrite","task":"Rewrite using the passive.","s":"Leo broke the window.","answer":["The window was broken by Leo."],"why":"The window comes first, then was broken by Leo."},{"type":"rewrite","task":"Rewrite using the passive.","s":"Mr Wong cleans the classroom every day.","answer":["The classroom is cleaned by Mr Wong every day.","The classroom is cleaned every day by Mr Wong.","Every day, the classroom is cleaned by Mr Wong.","Every day the classroom is cleaned by Mr Wong."],"why":"Present passive: is cleaned, plus by Mr Wong."},{"type":"rewrite","task":"Rewrite using the passive.","s":"The children ate all the cakes.","answer":["All the cakes were eaten by the children.","All of the cakes were eaten by the children."],"why":"Cakes is plural and it's past: were eaten by the children."},{"type":"order","words":["was","this","book","written","by","Roald","Dahl"],"end":"?","alt":[],"why":"In a passive question, was comes first: Was it written by…?"},{"type":"rewrite","task":"Rewrite using the passive. (You can leave out the doer.)","s":"Someone stole my bike.","answer":["My bike was stolen.","My bike was stolen by someone."],"why":"We don't know who did it, so we can leave out 'by someone'."},{"type":"rewrite","task":"Rewrite using the passive. (You can leave out the doer.)","s":"People speak English and Chinese in Hong Kong.","answer":["English and Chinese are spoken in Hong Kong.","In Hong Kong, English and Chinese are spoken.","English and Chinese are spoken in Hong Kong by people.","English and Chinese are spoken by people in Hong Kong.","Chinese and English are spoken in Hong Kong."],"why":"Two languages = plural: are spoken. 'People' is not important, so drop it."}]}]},{"id":"reported-speech","num":35,"title":"Reported Speech","zh":"间接引语","bigIdea":"Reported speech is how we tell someone what another person said, without using their exact words or speech marks. We usually move the verb one step back into the past (is → **was**, will → **would**) and change words like I and you so they fit the new speaker.","zhNote":"中文转述别人的话时动词不变（她说她很累），但英语通常要把动词“往过去退一步”：am/is → was，are → were，will → would，can → could，还要把 I、my 等人称代词改成合适的 he/she/his/her。","rules":[{"rule":"said or told? We say something, but we tell SOMEONE. 'That' after said/told is optional.","examples":["Emma **said** (that) she was tired.","Emma **told me** (that) she was tired.","She said me… ✗ → She **told me**… ✓"]},{"rule":"Move the verb one step back: am/is → was, are → were, present simple → past simple.","examples":["\"I am hungry.\" → Leo said he **was** hungry.","\"We are late.\" → They said they **were** late.","\"I like pizza.\" → Mia said she **liked** pizza."]},{"rule":"will → would, can → could.","examples":["\"I will help you.\" → Sam said he **would** help me.","\"I can swim.\" → Ava said she **could** swim."]},{"rule":"Change the pronouns so they match who is speaking now.","examples":["Emma: \"I love my cat.\" → Emma said **she** loved **her** cat.","Leo to me: \"You are my friend.\" → Leo told me **I** was **his** friend."]},{"rule":"Reported questions: asked + if (yes/no questions) or a question word. Use normal sentence order and no question mark.","examples":["\"Are you ready?\" → Ms Lee asked **if we were** ready.","\"Where do you live?\" → He asked me **where I lived**."]}],"tip":"Step back in time: is → was, can → could, will → would. And remember: you **say** something, but you **tell** someone.","mistakes":[{"wrong":"She said me that she was tired.","right":"She **told** me that she was tired."},{"wrong":"He asked me where did I live.","right":"He asked me **where I lived**."},{"wrong":"Sam: \"I will help you.\" → Sam said that I will help you.","right":"Sam said that **he would** help me."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Emma ___ me that she was tired.","options":["said","told","spoke"],"answer":1,"why":"Told is followed by a person (me)."},{"type":"mc","q":"Leo ___ that he was hungry.","options":["said","told","talked"],"answer":0,"why":"No person after the verb, so we use said."},{"type":"mc","q":"Sam ___ the class that he had a new puppy.","options":["said","say","told"],"answer":2,"why":"We tell someone (the class) something."},{"type":"mc","q":"\"I am cold,\" said Ava. → Ava said she ___ cold.","options":["am","was","were"],"answer":1,"why":"am moves back to was (she was)."},{"type":"mc","q":"\"We are late,\" said the boys. → The boys said they ___ late.","options":["is","was","were"],"answer":2,"why":"are moves back to were (they were)."},{"type":"mc","q":"\"I like dim sum,\" said Isabelle. → Isabelle said she ___ dim sum.","options":["like","liked","liking"],"answer":1,"why":"Present simple moves back to past simple: liked."},{"type":"mc","q":"\"I will help you,\" Leo said to me. Which is the correct reported speech?","options":["Leo said he would help me.","Leo said I would help you.","Leo said he would helped me."],"answer":0,"why":"will → would, and I/you change to he/me."},{"type":"mc","q":"\"I can swim,\" said Mia. Which is the correct reported speech?","options":["Mia said I could swim.","Mia said she could swam.","Mia said she could swim."],"answer":2,"why":"can → could, I → she, and could is followed by the base verb."},{"type":"mc","q":"\"Are you ready?\" Ms Lee asked us. → Ms Lee asked ___ we were ready.","options":["if","that","what"],"answer":0,"why":"For yes/no questions we use asked if."},{"type":"mc","q":"\"Where do you live?\" he asked me. Which is correct?","options":["He asked me where did I live.","He asked me where I lived.","He asked me where I lived?"],"answer":1,"why":"Normal word order (I lived) and no question mark."}]},{"name":"Practice","items":[{"type":"fill","q":"\"I am tired,\" said Emma. → Emma said she ___ tired.","answer":["was"],"why":"am → was."},{"type":"fill","q":"\"We are hungry,\" said the twins. → The twins said they ___ hungry.","answer":["were"],"why":"are → were."},{"type":"fill","q":"\"I love swimming,\" said Ava. → Ava said she ___ swimming.","answer":["loved"],"why":"Present simple → past simple: love → loved."},{"type":"fill","q":"\"I have a new phone,\" said Sam. → Sam said he ___ a new phone.","answer":["had"],"why":"have → had."},{"type":"fill","q":"\"I will call you,\" Mum said to me. → Mum said she ___ call me.","answer":["would"],"why":"will → would."},{"type":"fill","q":"\"I can play the piano,\" said Leo. → Leo said he ___ the piano.","answer":["could play"],"why":"can → could, then the base verb play."},{"type":"fill","q":"\"My cat is sick,\" said Mia. → Mia said ___ cat was sick.","answer":["her"],"why":"Mia is a girl, so my → her."},{"type":"fill","q":"\"I'm busy,\" Leo said to me. → Leo ___ me that he was busy.","answer":["told"],"why":"There is a person (me) after the verb, so use told."},{"type":"fill","q":"\"Do you like pizza?\" Isabelle asked me. → Isabelle asked me ___ I liked pizza.","answer":["if","whether"],"why":"Yes/no questions are reported with if."},{"type":"fill","q":"\"Where is the MTR station?\" the tourist asked. → The tourist asked where the MTR station ___.","answer":["was"],"why":"Normal order (the station was) and is → was."}]},{"name":"Challenge","items":[{"type":"order","words":["Emma","said","that","she","was","tired"],"end":".","alt":[],"why":"said (that) + she + was."},{"type":"rewrite","task":"Change to reported speech.","s":"\"I am hungry,\" said Sam.","answer":["Sam said he was hungry.","Sam said that he was hungry."],"why":"I → he, am → was."},{"type":"rewrite","task":"Change to reported speech.","s":"\"I can ride a bike,\" said Ava.","answer":["Ava said she could ride a bike.","Ava said that she could ride a bike."],"why":"I → she, can → could."},{"type":"rewrite","task":"Find and fix the mistake.","s":"She said me that she was late.","answer":["She told me that she was late.","She told me she was late.","She said that she was late.","She said she was late.","She said to me that she was late."],"why":"We tell someone, so said me → told me."},{"type":"order","words":["she","asked","me","where","I","lived"],"end":".","alt":[],"why":"Reported questions use normal order (I lived) and a full stop."},{"type":"order","words":["Ms","Lee","asked","if","we","were","ready"],"end":".","alt":[],"why":"asked if + normal order: we were ready."},{"type":"rewrite","task":"Change to reported speech. Use 'told'.","s":"\"I will finish my homework later,\" Leo told his mum.","answer":["Leo told his mum he would finish his homework later.","Leo told his mum that he would finish his homework later.","Leo told his mom he would finish his homework later.","Leo told his mom that he would finish his homework later."],"why":"I → he, will → would, my → his."},{"type":"rewrite","task":"Change to reported speech.","s":"\"Are you happy?\" Mia asked me.","answer":["Mia asked me if I was happy.","Mia asked me whether I was happy.","Mia asked if I was happy.","Mia asked whether I was happy."],"why":"Yes/no question: asked if + I was (normal order, you → I)."}]}]},{"id":"punctuation","num":36,"title":"Punctuation: Commas, Apostrophes & Speech Marks","zh":"标点符号：逗号、撇号和引号","bigIdea":"Punctuation marks are like traffic signs for readers. **Commas** tell you to pause, **apostrophes** show missing letters or who owns something, and **speech marks** show the exact words someone said.","zhNote":"英语撇号（'）有两种用法：缩写（it's = it is）和所有格（the dog's bone）。注意 its 表示“它的”，没有撇号！另外，英语引号里的逗号、句号和问号都要放在引号里面。","rules":[{"rule":"Commas in a list: put a comma between the items. Before the last item we use and (a comma before and is optional).","examples":["I like apples**,** bananas and grapes.","We need pens**,** paper**,** glue and scissors."]},{"rule":"Put a comma after an opening word or clause, and before (or after) a name when you speak to someone.","examples":["After lunch**,** we played football.","When it rains**,** we stay inside.","Come here**,** Leo! / Mia**,** are you ready?"]},{"rule":"Apostrophes for short forms (contractions) show where letters are missing. its = belonging to it (no apostrophe!).","examples":["it is → **it's**, do not → **don't**, I am → **I'm**","**It's** raining. (It is raining.)","The cat licked **its** paw. (the paw belongs to it)"]},{"rule":"Apostrophes for owning: one owner → 's. Plural owners ending in s → just add '. Plurals without s → 's.","examples":["the dog**'s** bowl (one dog)","the dogs**'** bowls (many dogs)","the children**'s** toys"]},{"rule":"Speech marks go around th
