s or sisters. (not have)","answer":["doesn't have","does not have","hasn't got","has not got"],"why":"Sam = he: doesn't have (or hasn't got)."},{"type":"fill","q":"___ you have a library card? (Do / Does)","answer":["Do"],"why":"With 'you' we ask 'Do you have…?'"},{"type":"fill","q":"___ Ava have a piano at home? (Do / Does)","answer":["Does"],"why":"Ava = she, so 'Does'."},{"type":"fill","q":"___ your school got a swimming pool? (Have / Has)","answer":["Has"],"why":"Your school = it, so 'Has … got'."},{"type":"fill","q":"Has Leo got a scooter? – No, he ___.","answer":["hasn't","has not"],"why":"Short answer repeats 'has': No, he hasn't."}]},{"name":"Challenge","items":[{"type":"order","words":["she","has","got","long","black","hair"],"end":".","alt":[],"why":"She + has got + what she has."},{"type":"rewrite","task":"Find and fix the mistake.","s":"My brother have a new football.","answer":["My brother has a new football.","My brother has got a new football."],"why":"My brother = he, so 'has'."},{"type":"order","words":["do","you","have","any","pets"],"end":"?","alt":[],"why":"Questions: Do + you + have…?"},{"type":"rewrite","task":"Make it negative.","s":"Isabelle has a piano.","answer":["Isabelle doesn't have a piano.","Isabelle does not have a piano.","Isabelle hasn't got a piano.","Isabelle has not got a piano."],"why":"She → doesn't have (has changes back to have)."},{"type":"order","words":["has","your","school","got","a","big","hall"],"end":"?","alt":[],"why":"Has + subject + got…? makes a question."},{"type":"rewrite","task":"Make it a question.","s":"Leo has a scooter.","answer":["Does Leo have a scooter?","Has Leo got a scooter?"],"why":"Does + Leo + have…? (has becomes have)."},{"type":"order","words":["we","haven't","got","any","homework","today"],"end":".","alt":[["today","we","haven't","got","any","homework"]],"why":"We + haven't got + any…"},{"type":"rewrite","task":"Find and fix the mistake.","s":"Does she has a sister?","answer":["Does she have a sister?","Has she got a sister?"],"why":"After 'does' we use 'have', not 'has'."}]}]},{"id":"adjectives","num":12,"title":"Adjectives","zh":"形容词","bigIdea":"Adjectives are describing words. They tell us what a person or thing is like: **big**, **tiny**, **funny**, **red**, **delicious**. An adjective can go before a noun (a **red** bag) or after words like is, look, feel and seem (The bag is **red**).","zhNote":"形容词用来描述名词。英语形容词没有单复数变化：two red bags，不能说 two reds bags。-ed 形容词表示人的感受（bored 感到无聊），-ing 形容词表示事物的特点（boring 令人无聊的）。","rules":[{"rule":"Adjectives usually go before a noun.","examples":["a **tall** girl","a **delicious** egg tart","an **old** tram"]},{"rule":"Adjectives can also go after be, look, feel and seem.","examples":["The soup is **hot**.","You look **happy**!","I feel **tired**."]},{"rule":"Adjectives never add -s, even with plural nouns.","examples":["two **red** balloons (not reds)","three **funny** stories"]},{"rule":"-ed tells how a person feels; -ing tells what the thing is like.","examples":["I'm **bored**. This film is **boring**.","Leo is **excited**. The trip is **exciting**.","Mia is **interested** in science. Science is **interesting**."]},{"rule":"Two or three adjectives go in this order: opinion – size – age – shape – colour – origin – material.","examples":["a **lovely little** puppy","a **big round red** ball","a **beautiful old Chinese** vase"]}],"tip":"Feelings end in **-ed** (I'm bored); the thing that causes the feeling ends in **-ing** (it's boring). Order trick 'OSASCOM': Opinion, Size, Age, Shape, Colour, Origin, Material.","mistakes":[{"wrong":"I have two reds pens.","right":"I have two **red** pens."},{"wrong":"I am boring in this lesson.","right":"I am **bored** in this lesson."},{"wrong":"She has a dress red.","right":"She has a **red dress**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Which word is an adjective?","options":["run","happy","table"],"answer":1,"why":"'Happy' describes a person, so it is an adjective."},{"type":"mc","q":"Leo has a ___.","options":["dog brown","brown dog","dogs brown"],"answer":1,"why":"The adjective goes before the noun: a brown dog."},{"type":"mc","q":"I have two ___ kites.","options":["reds","red","a red"],"answer":1,"why":"Adjectives never add -s."},{"type":"mc","q":"The dumplings ___.","options":["are delicious","delicious are","are deliciouses"],"answer":0,"why":"The adjective comes after 'are' and never adds -s."},{"type":"mc","q":"This film is so ___. I want to sleep.","options":["bored","boring","bore"],"answer":1,"why":"The film makes you feel bored, so the film is boring."},{"type":"mc","q":"I'm ___ because there is nothing to do.","options":["bored","boring","bores"],"answer":0,"why":"This is how I feel, so use -ed: bored."},{"type":"mc","q":"The rollercoaster at Ocean Park is really ___!","options":["excited","exciting","excite"],"answer":1,"why":"The ride causes the feeling, so use -ing."},{"type":"mc","q":"Mia is ___ about her birthday party.","options":["exciting","excite","excited"],"answer":2,"why":"This is how Mia feels, so use -ed."},{"type":"mc","q":"She has ___ hair.","options":["black long","long black","longs black"],"answer":1,"why":"Size/length comes before colour."},{"type":"mc","q":"We live in a ___ house.","options":["lovely old","old lovely","olds lovely"],"answer":0,"why":"Opinion (lovely) comes before age (old)."}]},{"name":"Practice","items":[{"type":"fill","q":"I have three ___ pencils. (yellow)","answer":["yellow"],"why":"Adjectives never add -s."},{"type":"fill","q":"There are five ___ ducks in the pond. (little)","answer":["little"],"why":"Adjectives stay the same with plural nouns."},{"type":"fill","q":"This book is very ___. I love it! (interest)","answer":["interesting"],"why":"The book causes the feeling, so use -ing."},{"type":"fill","q":"Sam is ___ in dinosaurs. (interest)","answer":["interested"],"why":"This is how Sam feels, so use -ed."},{"type":"fill","q":"Swimming for an hour is ___. (tire)","answer":["tiring"],"why":"Swimming causes the feeling, so use -ing."},{"type":"fill","q":"After swimming, I always feel ___. (tire)","answer":["tired"],"why":"This is how I feel, so use -ed."},{"type":"fill","q":"I'm so ___! We're going to Japan tomorrow! (excite)","answer":["excited"],"why":"This is how I feel, so use -ed."},{"type":"fill","q":"She has a ___ cat. (white / small)","answer":["small white"],"why":"Size comes before colour."},{"type":"fill","q":"He lives in a ___ house. (old / big)","answer":["big old"],"why":"Size comes before age."},{"type":"fill","q":"My mum has a ___ bag. (leather / beautiful)","answer":["beautiful leather"],"why":"Opinion comes first; material comes last."}]},{"name":"Challenge","items":[{"type":"order","words":["Emma","has","a","cute","little","puppy"],"end":".","alt":[],"why":"Opinion (cute) before size (little), then the noun."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I have three blues pens.","answer":["I have three blue pens."],"why":"Adjectives never add -s."},{"type":"order","words":["the","egg","tarts","look","delicious"],"end":".","alt":[],"why":"Adjectives can come after 'look'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"This game is so bored.","answer":["This game is so boring."],"why":"The game causes the feeling, so use -ing."},{"type":"order","words":["my","grandpa","has","a","lovely","old","watch"],"end":".","alt":[],"why":"Opinion (lovely) before age (old)."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Leo is boring because it is raining.","answer":["Leo is bored because it is raining.","Leo is bored because it's raining."],"why":"This is how Leo feels, so use -ed."},{"type":"order","words":["she","has","a","big","round","red","balloon"],"end":".","alt":[],"why":"Size, then shape, then colour."},{"type":"rewrite","task":"Put the adjectives in the right order.","s":"I have a silk Chinese beautiful scarf.","answer":["I have a beautiful Chinese silk scarf."],"why":"Opinion – origin – material: beautiful Chinese silk."}]}]},{"id":"comparatives","num":13,"title":"Comparing: -er, -est, more, most","zh":"比较级和最高级","bigIdea":"When we compare two things, we use a comparative: tall**er**, **more** exciting. When we pick the top one out of three or more, we use a superlative: **the** tall**est**, **the most** exciting.","zhNote":"中文用'比''最'，形容词本身不变；英语要把形容词变成 -er/-est，或在前面加 more/most。比较两个用 than，最高级前面要加 the。","rules":[{"rule":"Short adjectives: add -er / -est. If it ends in -e, just add -r / -st.","examples":["tall → taller → the tallest","nice → nicer → the nicest"]},{"rule":"One vowel + one consonant at the end: double the last letter. Ending in -y: change y to i.","examples":["big → bigger → the biggest","hot → hotter → the hottest","happy → happier → the happiest"]},{"rule":"Long adjectives (like beautiful, expensive, difficult): use more / most.","examples":["beautiful → more beautiful → the most beautiful","expensive → more expensive → the most expensive"]},{"rule":"Irregular adjectives: learn them by heart.","examples":["good → better → the best","bad → worse → the worst","far → further → the furthest (or farther → the farthest)"]},{"rule":"Use than to compare two things, the + superlative for the top one, and as … as when they are the same.","examples":["Leo is **taller than** Sam.","Emma is **the tallest** in the class.","My bag is **as heavy as** yours."]}],"tip":"Two things? Use -er + **than**. The top one? Use **the** + -est. Never use 'more' AND -er together — not 'more bigger'!","mistakes":[{"wrong":"My dog is more bigger than your dog.","right":"My dog is **bigger** than your dog."},{"wrong":"She is the most tall girl.","right":"She is **the tallest** girl."},{"wrong":"This cake is gooder than that one.","right":"This cake is **better** than that one."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"An elephant is ___ than a cat.","options":["big","bigger","biggest"],"answer":1,"why":"Comparing two things with 'than': bigger."},{"type":"mc","q":"Leo is ___ than his brother.","options":["taller","tall","more tall"],"answer":0,"why":"Tall is short, so add -er."},{"type":"mc","q":"Today is ___ than yesterday.","options":["hoter","more hot","hotter"],"answer":2,"why":"Hot doubles the t: hotter."},{"type":"mc","q":"My puppy is ___ than my cat.","options":["more funny","funnier","funnyer"],"answer":1,"why":"Funny ends in -y: change y to i and add -er."},{"type":"mc","q":"This book is ___ than that one.","options":["interestinger","more interesting","most interesting"],"answer":1,"why":"Interesting is long, so use 'more … than'."},{"type":"mc","q":"Mount Everest is ___ mountain in the world.","options":["the highest","higher","the most high"],"answer":0,"why":"The top one of all: the + -est."},{"type":"mc","q":"Emma's test score is ___ than mine.","options":["gooder","better","best"],"answer":1,"why":"Good is irregular: good → better → best."},{"type":"mc","q":"This is ___ day of my life!","options":["the worse","the baddest","the worst"],"answer":2,"why":"Bad is irregular: bad → worse → the worst."},{"type":"mc","q":"My bag is as ___ as yours.","options":["heavy","heavier","heaviest"],"answer":0,"why":"In 'as … as' the adjective doesn't change."},{"type":"mc","q":"I think Victoria Peak is ___ place in Hong Kong.","options":["the beautifulest","more beautiful","the most beautiful"],"answer":2,"why":"Beautiful is long, so the top one is 'the most beautiful'."}]},{"name":"Practice","items":[{"type":"fill","q":"A cheetah is ___ than a horse. (fast)","answer":["faster"],"why":"Short adjective + -er."},{"type":"fill","q":"Sam is ___ than Leo. (old)","answer":["older"],"why":"Short adjective + -er."},{"type":"fill","q":"Your box is ___ than mine. (big)","answer":["bigger"],"why":"Big doubles the g: bigger."},{"type":"fill","q":"July is ___ than January in Hong Kong. (hot)","answer":["hotter"],"why":"Hot doubles the t: hotter."},{"type":"fill","q":"Mia is ___ than me today. (happy)","answer":["happier"],"why":"Change y to i, then add -er."},{"type":"fill","q":"For me, maths is ___ than PE. (difficult)","answer":["more difficult"],"why":"Difficult is long, so use 'more'."},{"type":"fill","q":"Ava is the ___ girl in our class. (funny)","answer":["funniest"],"why":"The + superlative; y changes to i: funniest."},{"type":"fill","q":"This is the ___ ride at Ocean Park. (exciting)","answer":["most exciting"],"why":"Exciting is long, so 'the most exciting'."},{"type":"fill","q":"My cold is ___ today than yesterday. (bad)","answer":["worse"],"why":"Bad is irregular: bad → worse."},{"type":"fill","q":"Whose home is ___ from school, yours or Mia's? (far)","answer":["further","farther"],"why":"Far is irregular: further (or farther)."}]},{"name":"Challenge","items":[{"type":"order","words":["Leo","is","taller","than","his","dad"],"end":".","alt":[],"why":"Comparative + than + the other person."},{"type":"rewrite","task":"Find and fix the mistake.","s":"My cat is more fat than your cat.","answer":["My cat is fatter than your cat."],"why":"Fat is short: double the t and add -er."},{"type":"order","words":["this","is","the","best","dim","sum","in","town"],"end":".","alt":[],"why":"The + best (good → better → best)."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Ava is the most kind girl I know.","answer":["Ava is the kindest girl I know."],"why":"Kind is short, so add -est: the kindest."},{"type":"order","words":["my","bag","is","as","heavy","as","yours"],"end":".","alt":[],"why":"as + adjective + as means 'the same'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Today is more hotter than yesterday.","answer":["Today is hotter than yesterday."],"why":"Never use 'more' and -er together."},{"type":"order","words":["which","is","the","most","expensive","toy","in","the","shop"],"end":"?","alt":[],"why":"Expensive is long: the most expensive."},{"type":"rewrite","task":"Join the two sentences into one using 'than'.","s":"Sam is 12. Mia is 10.","answer":["Sam is older than Mia.","Mia is younger than Sam.","Sam is two years older than Mia.","Mia is two years younger than Sam."],"why":"Compare two people: older/younger + than."}]}]},{"id":"adverbs","num":14,"title":"Adverbs","zh":"副词","bigIdea":"Adjectives describe nouns, but adverbs describe verbs — they tell us **how** or **how often** we do something. Many 'how' adverbs end in **-ly**: She sings **beautifully**. 'How often' words like **always** and **never** tell us how many times.","zhNote":"中文常用'地'来修饰动词（快乐地笑），英语一般在形容词后加 -ly。频率副词放在实义动词前面，但放在 am/is/are 后面。","rules":[{"rule":"Adjective + -ly = adverb of manner (it tells how).","examples":["quick → quickly","slow → slowly","careful → carefully"]},{"rule":"Spelling: -y → -ily; -le → -ly.","examples":["happy → happily","easy → easily","gentle → gently"]},{"rule":"Rule breakers: good → well; fast and hard stay the same.","examples":["She is a good singer. → She sings **well**.","He is a fast runner. → He runs **fast**.","She is a hard worker. → She works **hard**."]},{"rule":"An adjective describes a noun; an adverb describes a verb.","examples":["Emma is **quiet**. → Emma reads **quietly**.","Leo is a **careful** writer. → Leo writes **carefully**."]},{"rule":"Frequency: always, usually, often, sometimes, rarely, never. They go before the main verb, but after am / is / are.","examples":["I **always** brush my teeth.","She **never** eats broccoli.","He is **often** late."]}],"tip":"How? Add **-ly** (watch the rule breakers: **well**, **fast**, **hard**). How often? Put it before the action verb — but after am, is, are.","mistakes":[{"wrong":"She sings beautiful.","right":"She sings **beautifully**."},{"wrong":"He plays the piano very good.","right":"He plays the piano very **well**."},{"wrong":"I go always to school by MTR.","right":"I **always go** to school by MTR."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"The turtle walks ___.","options":["slow","slowly","slowed"],"answer":1,"why":"It tells how the turtle walks, so use the adverb."},{"type":"mc","q":"Please close the door ___.","options":["quietly","quiet","quietful"],"answer":0,"why":"It tells how to close the door: quietly."},{"type":"mc","q":"Mia smiles ___.","options":["happy","happyly","happily"],"answer":2,"why":"Happy → change y to i → happily."},{"type":"mc","q":"Leo swims very ___.","options":["good","well","goodly"],"answer":1,"why":"Good is a rule breaker: the adverb is 'well'."},{"type":"mc","q":"Sam runs very ___.","options":["fastly","fast","fasted"],"answer":1,"why":"Fast stays the same as an adverb."},{"type":"mc","q":"Emma is a ___ girl.","options":["careful","carefully","carefuly"],"answer":0,"why":"It describes the noun 'girl', so use the adjective."},{"type":"mc","q":"She does her homework ___.","options":["careful","carefully","care"],"answer":1,"why":"It tells how she does it, so use the adverb."},{"type":"mc","q":"I eat breakfast every single day. I ___ eat breakfast.","options":["never","always","rarely"],"answer":1,"why":"Every day = always."},{"type":"mc","q":"Which sentence is correct?","options":["I walk usually to school.","I usually walk to school.","I walk to usually school."],"answer":1,"why":"Frequency words go before the main verb 'walk'."},{"type":"mc","q":"Which sentence is correct?","options":["Leo late is often.","Leo often late is.","Leo is often late."],"answer":2,"why":"Frequency words go after am, is, are."}]},{"name":"Practice","items":[{"type":"fill","q":"Ava speaks ___. (soft)","answer":["softly"],"why":"Soft + -ly = softly."},{"type":"fill","q":"The dog barks ___ at night. (loud)","answer":["loudly"],"why":"Loud + -ly = loudly."},{"type":"fill","q":"Please write ___. (neat)","answer":["neatly"],"why":"Neat + -ly = neatly."},{"type":"fill","q":"The kitten sleeps ___ on the sofa. (peaceful)","answer":["peacefully"],"why":"Peaceful + -ly = peacefully."},{"type":"fill","q":"I can solve this puzzle ___. (easy)","answer":["easily"],"why":"Easy: change y to i, add -ly."},{"type":"fill","q":"Hold the baby bird ___. (gentle)","answer":["gently"],"why":"Gentle: -le becomes -ly."},{"type":"fill","q":"Isabelle plays the piano very ___. (good)","answer":["well"],"why":"Good → well (rule breaker)."},{"type":"fill","q":"Mr Chan works very ___. (hard)","answer":["hard"],"why":"Hard stays the same; 'hardly' means something different."},{"type":"fill","q":"I ___ my teeth before bed. (always / brush)","answer":["always brush"],"why":"Frequency word goes before the main verb."},{"type":"fill","q":"Emma ___ tired after swimming. (usually / is)","answer":["is usually"],"why":"Frequency word goes after 'is'."}]},{"name":"Challenge","items":[{"type":"order","words":["Leo","always","takes","the","MTR","to","school"],"end":".","alt":[],"why":"'Always' goes before the main verb 'takes'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"The cat runs quick.","answer":["The cat runs quickly."],"why":"It tells how the cat runs, so use the adverb 'quickly'."},{"type":"order","words":["my","sister","is","never","late"],"end":".","alt":[],"why":"'Never' goes after 'is'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Emma speaks English very good.","answer":["Emma speaks English very well."],"why":"To describe a verb, good becomes 'well'."},{"type":"order","words":["I","rarely","watch","TV","on","school","nights"],"end":".","alt":[["on","school","nights","I","rarely","watch","TV"]],"why":"'Rarely' goes before the main verb 'watch'."},{"type":"rewrite","task":"Put the word in brackets in the right place.","s":"Mia is happy on Fridays. (always)","answer":["Mia is always happy on Fridays.","On Fridays Mia is always happy."],"why":"Frequency words go after 'is'."},{"type":"order","words":["he","plays","the","piano","beautifully"],"end":".","alt":[],"why":"The adverb comes after the verb and its object."},{"type":"rewrite","task":"Put the word in brackets in the right place.","s":"We go swimming in winter. (never)","answer":["We never go swimming in winter.","In winter we never go swimming."],"why":"Frequency words go before the main verb 'go'."}]}]},{"id":"prep-place","num":15,"title":"Prepositions of Place","zh":"表示地点的介词","bigIdea":"Prepositions of place tell us **where** something is: **in** the box, **on** the table, **under** the bed. They are tiny words, but they help us draw a clear picture in our heads!","zhNote":"中文说'在桌子上''在盒子里'，'上/里'放在后面；英语把介词放在名词前面：on the desk，in the box。at 用于一个具体的地点，如 at school、at the bus stop。","rules":[{"rule":"in = inside; on = on top of or touching a surface; under = below something, often covered by it.","examples":["The pencils are **in** the box.","The cup is **on** the table.","The cat is **under** the bed."]},{"rule":"next to, near, behind, in front of, opposite.","examples":["Emma sits **next to** Mia. My flat is **near** the park.","The car is **in front of** the house. The garden is **behind** it.","The bank is **opposite** the park (on the other side of the road)."]},{"rule":"between = in the middle of two things or people.","examples":["The bakery is **between** the bank and the post office.","I sit **between** Leo and Sam."]},{"rule":"above / below = higher / lower, usually not touching.","examples":["The clock is **above** the door.","The fish swim **below** the boat."]},{"rule":"at = a place where something happens, or a point.","examples":["I'm **at** school.","Wait **at** the bus stop.","She is **at** home."]}],"tip":"Picture a ball and a box: the ball can be **in**, **on**, **under**, **behind**, **in front of** or **next to** the box. Use **at** for a place point: at school, at home, at the bus stop.","mistakes":[{"wrong":"The book is in the table.","right":"The book is **on** the table."},{"wrong":"The cat is in front the door.","right":"The cat is **in front of** the door."},{"wrong":"Wait for me on the bus stop.","right":"Wait for me **at** the bus stop."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"The goldfish swim ___ the fish tank.","options":["in","on","under"],"answer":0,"why":"The fish are inside the tank, so 'in'."},{"type":"mc","q":"There are pictures ___ the wall.","options":["in","under","on"],"answer":2,"why":"Pictures touch the surface of the wall, so 'on'."},{"type":"mc","q":"Your pencil is on the floor. Look ___ your chair!","options":["under","above","on"],"answer":0,"why":"The floor is below the chair, so 'under'."},{"type":"mc","q":"I sit ___ Mia. She is right beside me.","options":["opposite","under","next to"],"answer":2,"why":"Right beside = next to."},{"type":"mc","q":"The letter B is ___ A and C.","options":["between","next","above"],"answer":0,"why":"B is in the middle of A and C, so 'between'."},{"type":"mc","q":"Wait for me ___ the bus stop.","options":["in","at","under"],"answer":1,"why":"A bus stop is a point, so 'at'."},{"type":"mc","q":"Emma is ___ school now.","options":["on","at","under"],"answer":1,"why":"We say 'at school'."},{"type":"mc","q":"The teacher stands ___ the class, so everyone can see her.","options":["behind","in front of","under"],"answer":1,"why":"Everyone can see her, so she is in front of the class."},{"type":"mc","q":"The lamp hangs ___ the table.","options":["above","under","between"],"answer":0,"why":"A hanging lamp is higher than the table: above."},{"type":"mc","q":"The library is ___ the school, on the other side of the road.","options":["in","on","opposite"],"answer":2,"why":"On the other side of the road = opposite."}]},{"name":"Practice","items":[{"type":"fill","q":"My pencils are ___ my pencil case. (in / on / at)","answer":["in"],"why":"Inside the pencil case, so 'in'."},{"type":"fill","q":"There is a poster ___ the wall. (in / on / at)","answer":["on"],"why":"Touching the surface of the wall, so 'on'."},{"type":"fill","q":"Our cat likes to sleep ___ the bed, where it is dark. (on / under / above)","answer":["under"],"why":"Dark and covered by the bed, so 'under'."},{"type":"fill","q":"Mia sits ___ me. Our desks touch. (next to / opposite)","answer":["next to"],"why":"Desks touching side by side = next to."},{"type":"fill","q":"The number 5 is ___ 4 and 6. (between / behind)","answer":["between"],"why":"5 is in the middle of 4 and 6."},{"type":"fill","q":"I'm waiting ___ the bus stop. (in / on / at)","answer":["at"],"why":"A bus stop is a point, so 'at'."},{"type":"fill","q":"Ms Lee parks her car ___ the building, so you can't see it from the street. (in front of / behind)","answer":["behind"],"why":"You can't see it from the front, so it's behind."},{"type":"fill","q":"The café is across the road from the bank. It is ___ the bank. (opposite / between)","answer":["opposite"],"why":"Across the road = opposite."},{"type":"fill","q":"Look up! The kite is high ___ the trees. (above / below)","answer":["above"],"why":"High up = above."},{"type":"fill","q":"I live ___ the MTR station — it's only a two-minute walk! (near / under)","answer":["near"],"why":"A short walk away = near."}]},{"name":"Challenge","items":[{"type":"order","words":["the","cat","is","under","the","table"],"end":".","alt":[],"why":"Preposition + the place: under the table."},{"type":"rewrite","task":"Find and fix the mistake.","s":"The book is in the table.","answer":["The book is on the table."],"why":"A book lies on the surface of a table, so 'on'."},{"type":"order","words":["Emma","sits","between","Leo","and","Mia"],"end":".","alt":[["Emma","sits","between","Mia","and","Leo"]],"why":"between + one person + and + another person."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Please wait for me in front the school.","answer":["Please wait for me in front of the school."],"why":"Always say 'in front of'."},{"type":"order","words":["the","bakery","is","opposite","the","MTR","station"],"end":".","alt":[],"why":"'Opposite' goes right before the place."},{"type":"rewrite","task":"Find and fix the mistake.","s":"We meet our friends on the bus stop.","answer":["We meet our friends at the bus stop."],"why":"A bus stop is a point, so 'at'."},{"type":"order","words":["is","there","a","park","near","your","flat"],"end":"?","alt":[],"why":"Is there + a thing + preposition + place?"},{"type":"rewrite","task":"Find and fix the mistake.","s":"The clock is above of the door.","answer":["The clock is above the door."],"why":"'Above' doesn't need 'of'."}]}]},{"id":"prep-time","num":16,"title":"Prepositions of Time: in, on, at","zh":"时间介词 in/on/at","bigIdea":"We use **at**, **on** and **in** to say **when** something happens. Think of a camera zooming out: **at** for exact times, **on** for days and dates, **in** for longer times like months, years and seasons.","zhNote":"中文说'在三点''在星期一''在七月'都用'在'，英语要分 at / on / in。有 this、next、last、every 时不用介词：next Monday，不说 on next Monday。","rules":[{"rule":"at + clock times and short moments.","examples":["**at** 7:30","**at** night","**at** lunchtime"]},{"rule":"on + days and dates (and special days).","examples":["**on** Monday","**on** 25th December / **on** my birthday","**on** Saturday morning"]},{"rule":"in + months, years, seasons and parts of the day.","examples":["**in** July","**in** 2026","**in** summer / **in** the morning"]},{"rule":"No preposition before this, next, last or every.","examples":["See you **next** Friday! (not on next Friday)","I'm busy **this** afternoon.","I have piano **every** Tuesday."]},{"rule":"before, after, during, until, for.","examples":["Wash your hands **before** lunch. We play **after** school.","Don't talk **during** the test.","The shop is open **until** 9 p.m. I read **for** 30 minutes."]}],"tip":"Zoom out: **AT** a time → **ON** a day → **IN** a month, year or season. Watch out: **at** night but **in** the morning!","mistakes":[{"wrong":"My birthday is on June.","right":"My birthday is **in** June."},{"wrong":"See you on next Monday.","right":"See you **next Monday**."},{"wrong":"I get up in 7 o'clock.","right":"I get up **at** 7 o'clock."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"School starts ___ 8 o'clock.","options":["in","on","at"],"answer":2,"why":"Clock times use 'at'."},{"type":"mc","q":"I have swimming ___ Wednesday.","options":["on","in","at"],"answer":0,"why":"Days use 'on'."},{"type":"mc","q":"My birthday is ___ May.","options":["at","in","on"],"answer":1,"why":"Months use 'in'."},{"type":"mc","q":"We go to bed ___ night.","options":["in","at","on"],"answer":1,"why":"We always say 'at night'."},{"type":"mc","q":"Hong Kong is very hot ___ summer.","options":["in","on","at"],"answer":0,"why":"Seasons use 'in'."},{"type":"mc","q":"Christmas is ___ 25th December.","options":["in","at","on"],"answer":2,"why":"Dates use 'on'."},{"type":"mc","q":"I do my homework ___ the evening.","options":["at","in","on"],"answer":1,"why":"Parts of the day use 'in': in the evening."},{"type":"mc","q":"We have a music test ___.","options":["on next Friday","next Friday","in next Friday"],"answer":1,"why":"No preposition before 'next'."},{"type":"mc","q":"Please be quiet ___ the film.","options":["during","until","at"],"answer":0,"why":"'During' means all through the film."},{"type":"mc","q":"I practise the piano ___ 30 minutes every day.","options":["for","during","until"],"answer":0,"why":"'For' + how long something lasts."}]},{"name":"Practice","items":[{"type":"fill","q":"The bell rings ___ 3:30. (at / on / in)","answer":["at"],"why":"Clock times use 'at'."},{"type":"fill","q":"We have PE ___ Tuesdays. (at / on / in)","answer":["on"],"why":"Days use 'on'."},{"type":"fill","q":"The school trip is ___ March. (at / on / in)","answer":["in"],"why":"Months use 'in'."},{"type":"fill","q":"Leaves fall from the trees ___ autumn. (at / on / in)","answer":["in","in the"],"why":"Seasons use 'in'."},{"type":"fill","q":"Owls hunt ___ night. (at / on / in)","answer":["at"],"why":"We say 'at night'."},{"type":"fill","q":"I often feel sleepy ___ the afternoon. (at / on / in)","answer":["in"],"why":"Parts of the day use 'in'."},{"type":"fill","q":"My party is ___ Saturday afternoon. (at / on / in)","answer":["on"],"why":"A day is named (Saturday), so use 'on'."},{"type":"fill","q":"We have a spelling test ___ week. (next / on next)","answer":["next"],"why":"No preposition before 'next'."},{"type":"fill","q":"Don't eat ___ the lesson. (during / for)","answer":["during","in"],"why":"'During' = at some time in the lesson."},{"type":"fill","q":"I read ___ an hour before bed. (for / during)","answer":["for"],"why":"'For' + how long: for an hour."}]},{"name":"Challenge","items":[{"type":"order","words":["I","get","up","at","seven","o'clock"],"end":".","alt":[],"why":"Clock times use 'at'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"My birthday is on July.","answer":["My birthday is in July."],"why":"Months use 'in'."},{"type":"order","words":["we","have","art","on","Friday","afternoon"],"end":".","alt":[["on","Friday","afternoon","we","have","art"]],"why":"A named day + afternoon still uses 'on'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"See you on next Monday!","answer":["See you next Monday!"],"why":"No preposition before 'next'."},{"type":"order","words":["the","library","is","open","until","six","o'clock"],"end":".","alt":[],"why":"'Until' shows when something stops."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I go to sleep in night.","answer":["I go to sleep at night."],"why":"We say 'at night', but 'in the morning'."},{"type":"order","words":["do","you","go","swimming","in","the","summer"],"end":"?","alt":[],"why":"Seasons use 'in'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I play football at every Saturday.","answer":["I play football every Saturday.","I play football on Saturdays."],"why":"No preposition before 'every'."}]}]},{"id":"sva","num":17,"title":"Subject–Verb Agreement","zh":"主谓一致","bigIdea":"The subject (who or what the sentence is about) and the verb must match, like a pair of socks. One person or thing → singular verb (**is**, **has**, **likes**). Two or more → plural verb (**are**, **have**, **like**).","zhNote":"中文动词不随主语变化，但英语一般现在时里，主语是第三人称单数时，动词要加 -s，或用 is / has。everyone、nobody、each 当作单数；'A and B' 当作复数。","rules":[{"rule":"Singular subject (he, she, it, one thing) → singular verb: is, has, verb + -s.","examples":["Leo **likes** pizza.","The dog **is** hungry.","My mum **has** a car."]},{"rule":"Plural subject (or I / you) → plural verb: are, have, verb with no -s.","examples":["The dogs **are** hungry.","My friends **like** pizza.","I **have** a cat."]},{"rule":"Two subjects joined by 'and' = plural.","examples":["Emma and Leo **are** friends.","My cat and my dog **play** together."]},{"rule":"Everyone, everybody, nobody, someone and each = singular.","examples":["Everyone **is** here.","Nobody **knows** the answer.","Each student **has** a locker."]},{"rule":"Find the main noun — not the noun after 'of' or in a describing phrase.","examples":["The box of pencils **is** on the desk.","One of my friends **lives** in Tai Po.","The books on the shelf **are** new."]}],"tip":"Find the real subject, then ask: one or more than one? One → **is / has / -s**. More → **are / have / no -s**. 'Everyone' is one big group — use **is**!","mistakes":[{"wrong":"She like ice cream.","right":"She **likes** ice cream."},{"wrong":"Everyone are happy.","right":"Everyone **is** happy."},{"wrong":"The box of crayons are on the floor.","right":"The box of crayons **is** on the floor."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"The cat ___ black.","options":["are","is","am"],"answer":1,"why":"One cat = singular, so 'is'."},{"type":"mc","q":"My friends ___ funny.","options":["are","is","be"],"answer":0,"why":"Friends = plural, so 'are'."},{"type":"mc","q":"Leo ___ football every day.","options":["play","plays","playing"],"answer":1,"why":"Leo = he, so the verb adds -s."},{"type":"mc","q":"The children ___ in the playground.","options":["is","has","are"],"answer":2,"why":"Children = plural, so 'are'."},{"type":"mc","q":"Mia ___ two brothers.","options":["have","has","are"],"answer":1,"why":"Mia = she, so 'has'."},{"type":"mc","q":"Emma and Ava ___ best friends.","options":["are","is","has"],"answer":0,"why":"Two people joined by 'and' = plural."},{"type":"mc","q":"Everyone ___ excited about the trip.","options":["are","is","am"],"answer":1,"why":"Everyone is singular, so 'is'."},{"type":"mc","q":"Each student ___ a locker.","options":["have","has","are"],"answer":1,"why":"Each is singular, so 'has'."},{"type":"mc","q":"The box of crayons ___ on the shelf.","options":["are","have","is"],"answer":2,"why":"The main noun is 'box' (one), so 'is'."},{"type":"mc","q":"Which sentence is correct?","options":["Nobody knows the answer.","Nobody know the answer.","Nobody are know the answer."],"answer":0,"why":"Nobody is singular, so the verb adds -s."}]},{"name":"Practice","items":[{"type":"fill","q":"My sister ___ maths. (love)","answer":["loves"],"why":"My sister = she, so add -s."},{"type":"fill","q":"The birds ___ every morning. (sing)","answer":["sing"],"why":"Birds = plural, so no -s."},{"type":"fill","q":"Mr Chan ___ to school by MTR. (go)","answer":["goes"],"why":"Mr Chan = he; go → goes."},{"type":"fill","q":"Leo and Sam ___ in the same class. (be)","answer":["are"],"why":"Two people joined by 'and' = plural."},{"type":"fill","q":"My dog ___ a long tail. (have)","answer":["has"],"why":"My dog = it, so 'has'."},{"type":"fill","q":"Everybody ___ the summer holidays. (enjoy)","answer":["enjoys"],"why":"Everybody is singular, so add -s."},{"type":"fill","q":"Each child ___ a present. (get)","answer":["gets"],"why":"Each is singular, so add -s."},{"type":"fill","q":"The bag of oranges ___ heavy. (be)","answer":["is"],"why":"The main noun is 'bag' (one), so 'is'."},{"type":"fill","q":"One of my friends ___ in Stanley. (live)","answer":["lives"],"why":"The subject is 'one', so add -s."},{"type":"fill","q":"The pencils in my bag ___ new. (be)","answer":["are"],"why":"The main noun is 'pencils' (plural), not 'bag'."}]},{"name":"Challenge","items":[{"type":"order","words":["my","brother","watches","cartoons","after","school"],"end":".","alt":[["after","school","my","brother","watches","cartoons"]],"why":"My brother = he, so watch → watches."},{"type":"rewrite","task":"Find and fix the mistake.","s":"She have a new phone.","answer":["She has a new phone.","She has got a new phone."],"why":"With 'she' we use 'has'."},{"type":"order","words":["Isabelle","and","Mia","are","on","the","swim","team"],"end":".","alt":[["Mia","and","Isabelle","are","on","the","swim","team"]],"why":"Two people joined by 'and' take 'are'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Everyone in my class like pizza.","answer":["Everyone in my class likes pizza."],"why":"Everyone is singular, so 'likes'."},{"type":"order","words":["the","box","of","toys","is","under","my","bed"],"end":".","alt":[],"why":"The main noun is 'box' (one), so 'is'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"The cake and the juice is on the table.","answer":["The cake and the juice are on the table."],"why":"Two things joined by 'and' = plural, so 'are'."},{"type":"order","words":["each","student","has","a","library","card"],"end":".","alt":[],"why":"Each is singular, so 'has'."},{"type":"rewrite","task":"Rewrite the sentence. Start with 'My cousin'.","s":"My cousins live in Canada and love snow.","answer":["My cousin lives in Canada and loves snow."],"why":"One cousin = singular, so both verbs add -s."}]}]},{"id":"present-simple","num":18,"title":"Present Simple","zh":"一般现在时","bigIdea":"We use the present simple for things that happen again and again (habits) and things that are always true (facts). With he, she, it or one person, the verb gets an **-s**: I play → she **plays**.","zhNote":"中文动词不变形（我吃、他吃），但英语里主语是 he/she/it 或一个人名时，动词要加 -s/-es/-ies。否定和疑问要用 do/does 帮忙，而且 does/doesn't 后面的动词要用原形。","rules":[{"rule":"I / you / we / they + base verb.","examples":["I **play** the piano every day.","They **walk** to school."]},{"rule":"He / she / it + verb + -s. Add -es after s, sh, ch, x, o. Consonant + y → -ies. have → has.","examples":["play → **plays**, watch → **watches**, go → **goes**","study → **studies**, fly → **flies**","have → **has**"]},{"rule":"Negative: don't / doesn't + base verb (no -s!).","examples":["I **don't like** spiders.","Leo **doesn't eat** fish."]},{"rule":"Questions: Do / Does + person + base verb?","examples":["**Do** you **swim** on Saturdays?","**Does** Emma **play** the piano? — Yes, she does."]},{"rule":"Time words: every day, usually, always, often, sometimes, never, on Mondays.","examples":["Mia **usually** takes the MTR.","We have PE **on Mondays**."]}],"tip":"He, she, it — add the **-s**! But after does / doesn't the -s goes away: She **plays** → **Does** she **play**?","mistakes":[{"wrong":"She go to school by bus.","right":"She **goes** to school by bus."},{"wrong":"He doesn't likes milk.","right":"He doesn't **like** milk."},{"wrong":"Does she plays tennis?","right":"Does she **play** tennis?"}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Emma ___ the piano every day.","options":["play","plays","playing"],"answer":1,"why":"Emma = she, so add -s: plays."},{"type":"mc","q":"I ___ to school by MTR every morning.","options":["go","goes","going"],"answer":0,"why":"With I, use the base verb: go."},{"type":"mc","q":"My cat ___ on the sofa every afternoon.","options":["sleep","sleeping","sleeps"],"answer":2,"why":"My cat = it, so add -s: sleeps."},{"type":"mc","q":"Leo ___ TV after dinner every evening.","options":["watchs","watches","watch"],"answer":1,"why":"Verbs ending in -ch add -es: watches."},{"type":"mc","q":"Mia ___ maths on Tuesdays.","options":["studys","study","studies"],"answer":2,"why":"Consonant + y: change y to i and add -es: studies."},{"type":"mc","q":"My dad ___ coffee every morning.","options":["drinks","drink","drinkes"],"answer":0,"why":"My dad = he, so add -s: drinks."},{"type":"mc","q":"We ___ like spiders.","options":["doesn't","don't","aren't"],"answer":1,"why":"With we, the negative is don't + base verb."},{"type":"mc","q":"Sam ___ eat fish.","options":["don't","isn't","doesn't"],"answer":2,"why":"Sam = he, so use doesn't."},{"type":"mc","q":"___ your brother play football after school?","options":["Do","Does","Is"],"answer":1,"why":"Your brother = he, so the question starts with Does."},{"type":"mc","q":"Which sentence is correct?","options":["Does she like pizza?","Does she likes pizza?","Do she like pizza?"],"answer":0,"why":"Does + she + base verb (like, no -s)."}]},{"name":"Practice","items":[{"type":"fill","q":"Isabelle ___ to the park every Sunday. (go)","answer":["goes"],"why":"Isabelle = she, and go ends in -o, so add -es."},{"type":"fill","q":"My mum ___ dinner at 7 pm every day. (cook)","answer":["cooks"],"why":"My mum = she, so add -s."},{"type":"fill","q":"Leo ___ his teeth twice a day. (brush)","answer":["brushes"],"why":"Verbs ending in -sh add -es."},{"type":"fill","q":"Ava ___ hard for her tests every week. (study)","answer":["studies"],"why":"Consonant + y → -ies: studies."},{"type":"fill","q":"Mr Chan ___ a big black dog. (have)","answer":["has"],"why":"With he/she/it, have becomes has."},{"type":"fill","q":"The sun ___ in the east every morning. (rise)","answer":["rises"],"why":"It is a fact, and the sun = it, so add -s."},{"type":"fill","q":"My sister ___ dim sum. (not like)","answer":["doesn't like","does not like"],"why":"She → doesn't + base verb like."},{"type":"fill","q":"We ___ TV on school nights. (not watch)","answer":["don't watch","do not watch"],"why":"We → don't + base verb watch."},{"type":"fill","q":"___ Sam play basketball on Fridays? (do / does)","answer":["Does","does"],"why":"Sam = he, so the question starts with Does."},{"type":"fill","q":"Where ___ your grandma live? (do / does)","answer":["does"],"why":"Your grandma = she, so use does, and live stays plain."}]},{"name":"Challenge","items":[{"type":"order","words":["she","always","takes","the","MTR","to","school"],"end":".","alt":[],"why":"Always goes before the main verb, and she takes has -s."},{"type":"order","words":["does","your","dog","like","bananas"],"end":"?","alt":[],"why":"Questions: Does + person + base verb."},{"type":"order","words":["my","little","brother","doesn't","eat","carrots"],"end":".","alt":[],"why":"Doesn't comes before the base verb eat."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Mia watch cartoons every Saturday.","answer":["Mia watches cartoons every Saturday."],"why":"Mia = she, and watch ends in -ch, so watches."},{"type":"rewrite","task":"Make it negative.","s":"Sam likes swimming.","answer":["Sam doesn't like swimming.","Sam does not like swimming."],"why":"Use doesn't + base verb: like, not likes."},{"type":"rewrite","task":"Make it a question.","s":"Emma plays the piano every day.","answer":["Does Emma play the piano every day?"],"why":"Does + Emma + base verb play."},{"type":"rewrite","task":"Find and fix the mistake.","s":"He doesn't has a bike.","answer":["He doesn't have a bike.","He does not have a bike."],"why":"After doesn't, use the base verb have."},{"type":"rewrite","task":"Change 'I' to 'She'.","s":"I study science and I go to the library on Fridays.","answer":["She studies science and she goes to the library on Fridays.","She studies science and goes to the library on Fridays."],"why":"She needs -s: study → studies, go → goes."}]}]},{"id":"present-continuous","num":19,"title":"Present Continuous","zh":"现在进行时","bigIdea":"We use the present continuous for things happening right now, at this moment. It has two parts: **am / is / are + verb-ing**. I **am reading**. She **is swimming**. They **are singing**.","zhNote":"中文说“正在……”，动词本身不变；英语要用 am/is/are + 动词-ing，两部分都不能少。不能说 I reading，也不能说 I am read。","rules":[{"rule":"am / is / are + verb-ing.","examples":["I **am eating** lunch.","Leo **is playing** football.","They **are singing**."]},{"rule":"Spelling: most verbs add -ing. Silent -e: drop it. Short verbs ending consonant-vowel-consonant: double the last letter. -ie → -ying.","examples":["read → **reading**, make → **making**","swim → **swimming**, run → **running**","lie → **lying**, tie → **tying**"]},{"rule":"Negative: am not / isn't / aren't + verb-ing.","examples":["I **am not sleeping**.","She **isn't watching** TV.","We **aren't playing**."]},{"rule":"Questions: Am / Is / Are + person + verb-ing?","examples":["**Is** Emma **reading**? — Yes, she is.","**Are** they **swimming**? — No, they aren't."]},{"rule":"Clue words: now, right now, at the moment, Look!, Listen!","examples":["**Look!** The bus **is coming**.","**Listen!** Mia **is playing** the piano."]}],"tip":"Happening now? You need two parts, like a pair of shoes: **am/is/are** AND **-ing**!","mistakes":[{"wrong":"I reading a book now.","right":"I **am reading** a book now."},{"wrong":"She is swim right now.","right":"She is **swimming** right now."},{"wrong":"He is makeing a cake.","right":"He is **making** a cake."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Look! The baby ___.","options":["sleeping","is sleeping","sleeps"],"answer":1,"why":"Look! means now, so use is + -ing."},{"type":"mc","q":"I ___ my homework right now.","options":["am doing","is doing","doing"],"answer":0,"why":"I goes with am, plus -ing."},{"type":"mc","q":"They ___ football at the moment.","options":["is playing","are playing","play"],"answer":1,"why":"They goes with are, plus -ing."},{"type":"mc","q":"Listen! Emma ___ the piano.","options":["plays","playing","is playing"],"answer":2,"why":"Listen! means now: is + playing."},{"type":"mc","q":"Sam is ___ in the pool now.","options":["swiming","swimming","swimeing"],"answer":1,"why":"Swim is short and ends consonant-vowel-consonant, so double the m."},{"type":"mc","q":"Mum is ___ a cake right now.","options":["making","makeing","makking"],"answer":0,"why":"Make ends in a silent -e, so drop it: making."},{"type":"mc","q":"The cat is ___ on the sofa at the moment.","options":["liing","lieing","lying"],"answer":2,"why":"Verbs ending in -ie change to -ying: lie → lying."},{"type":"mc","q":"Leo ___ TV now. He's reading.","options":["isn't watching","aren't watching","not watching"],"answer":0,"why":"Leo = he, so use isn't + -ing."},{"type":"mc","q":"___ you listening to me right now?","options":["Is","Am","Are"],"answer":2,"why":"You goes with are."},{"type":"mc","q":"Which sentence is correct?","options":["Does she wearing a hat now?","Is she wearing a hat now?","Is she wear a hat now?"],"answer":1,"why":"Questions: Is + she + verb-ing."}]},{"name":"Practice","items":[{"type":"fill","q":"I ___ an apple right now. (eat)","answer":["am eating","'m eating"],"why":"I + am + eating."},{"type":"fill","q":"Isabelle ___ a letter at the moment. (write)","answer":["is writing","'s writing"],"why":"She + is; write drops the -e: writing."},{"type":"fill","q":"Look! The boys ___ in the sea. (swim)","answer":["are swimming","'re swimming"],"why":"The boys = they + are; double the m: swimming."},{"type":"fill","q":"Listen! The birds ___. (sing)","answer":["are singing","'re singing"],"why":"The birds = they, so are + singing."},{"type":"fill","q":"Dad ___ the car right now. (wash)","answer":["is washing","'s washing"],"why":"Dad = he, so is + washing."},{"type":"fill","q":"Shh! Mia ___ on the sofa right now. (lie)","answer":["is lying","'s lying"],"why":"Lie → lying, and Mia = she, so is."},{"type":"fill","q":"Ava and Leo ___ to the MTR station at the moment. (run)","answer":["are running","'re running"],"why":"Two people = are; double the n: running."},{"type":"fill","q":"I ___ TV now. I'm doing my homework. (not watch)","answer":["am not watching","'m not watching"],"why":"I + am not + watching."},{"type":"fill","q":"Sam ___ now. He's awake! (not sleep)","answer":["isn't sleeping","is not sleeping","'s not sleeping"],"why":"Sam = he, so isn't + sleeping."},{"type":"fill","q":"___ it raining in Hong Kong right now? (be)","answer":["Is","is"],"why":"It goes with is; the question starts with Is."}]},{"name":"Challenge","items":[{"type":"order","words":["the","children","are","playing","in","the","park"],"end":".","alt":[],"why":"The children = they, so are + playing."},{"type":"order","words":["is","your","brother","sleeping","now"],"end":"?","alt":[],"why":"Questions start with Is, then the person, then -ing."},{"type":"order","words":["we","aren't","swimming","at","the","moment"],"end":".","alt":[["at","the","moment","we","aren't","swimming"]],"why":"We + aren't + swimming."},{"type":"rewrite","task":"Find and fix the mistake.","s":"She is dance now.","answer":["She is dancing now.","She's dancing now."],"why":"After is, we need the -ing form: dancing."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Look! Leo is makeing a sandcastle.","answer":["Look! Leo is making a sandcastle.","Look! Leo's making a sandcastle."],"why":"Make loses its -e: making."},{"type":"rewrite","task":"Make it negative.","s":"Emma is reading a comic.","answer":["Emma isn't reading a comic.","Emma is not reading a comic.","Emma's not reading a comic."],"why":"Add not after is: isn't reading."},{"type":"rewrite","task":"Make it a question.","s":"They are waiting for the bus.","answer":["Are they waiting for the bus?"],"why":"Move are to the front: Are they …?"},{"type":"rewrite","task":"Find and fix the mistake.","s":"Listen! The baby cry.","answer":["Listen! The baby is crying.","Listen! The baby's crying."],"why":"Listen! means now, so use is + crying."}]}]},{"id":"simple-vs-continuous","num":20,"title":"Present Simple or Present Continuous?","zh":"一般现在时还是现在进行时","bigIdea":"Present simple = things that happen again and again, or are always true: I **walk** to school every day. Present continuous = something happening right now: I **am walking** to school now. Some 'thinking and feeling' verbs like **like, love, know, want, need** almost never use -ing.","zhNote":"先看时间词：every day、usually、on Mondays 用一般现在时；now、right now、at the moment、Look!、Listen! 用现在进行时。表示喜欢、知道、想要、需要的“状态动词”一般不用 -ing，即使说的是“现在”，也说 I want…，不说 I am wanting…。","rules":[{"rule":"Habits and facts → present simple.","examples":["Emma **plays** the piano **every day**.","Water **boils** at 100°C."]},{"rule":"Happening now → present continuous.","examples":["Emma **is playing** the piano **right now**.","**Look!** It **is raining**."]},{"rule":"Compare them: usual habit vs. what is happening now or today.","examples":["I **usually walk** to school, but today I **am taking** the bus.","Leo **plays** football on Saturdays. **Now** he **is playing** with Sam."]},{"rule":"State verbs (like, love, hate, know, want, need, believe, understand) usually do NOT take -ing.","examples":["I **want** a drink now. (not I am wanting)","Do you **understand**? (not Are you understanding)","She **knows** the answer."]},{"rule":"Clue words help you choose.","examples":["every day, usually, often, never, on Mondays → I **read**.","now, right now, at the moment, Look!, Listen! → I **am reading**."]}],"tip":"Ask: Is it a **habit** or is it happening **now**? Feeling and knowing verbs stay simple: I **know**, I **like**, I **want**.","mistakes":[{"wrong":"I am knowing the answer.","right":"I **know** the answer."},{"wrong":"Look! Sam plays in the rain.","right":"Look! Sam **is playing** in the rain."},{"wrong":"I am getting up at 7 every day.","right":"I **get up** at 7 every day."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Leo ___ to school every day.","options":["walks","is walking","walking"],"answer":0,"why":"Every day = a habit, so use the present simple."},{"type":"mc","q":"Look! Leo ___ to the bus stop.","options":["runs","is running","run"],"answer":1,"why":"Look! = happening now, so use is + -ing."},{"type":"mc","q":"My mum ___ coffee every morning.","options":["is drinking","drinks","drinking"],"answer":1,"why":"Every morning = a habit: drinks."},{"type":"mc","q":"Shh! The baby ___ right now.","options":["sleeps","sleeping","is sleeping"],"answer":2,"why":"Right now = present continuous."},{"type":"mc","q":"We ___ PE on Mondays.","options":["are having","have","having"],"answer":1,"why":"On Mondays = every Monday, a habit."},{"type":"mc","q":"I ___ a new bike. Can I have one for my birthday?","options":["want","am wanting","wanting"],"answer":0,"why":"Want is a state verb, so no -ing."},{"type":"mc","q":"Emma ___ the answer to this question.","options":["is knowing","knows","know"],"answer":1,"why":"Know is a state verb: she knows."},{"type":"mc","q":"Listen! Someone ___ at the door.","options":["knocks","is knocking","knock"],"answer":1,"why":"Listen! = happening now."},{"type":"mc","q":"Isabelle ___ dim sum. It's her favourite food.","options":["loves","is loving","love"],"answer":0,"why":"Love is a feeling verb, so use the present simple."},{"type":"mc","q":"Which sentence is correct?","options":["I am understanding the lesson now.","I understand the lesson now.","I understanding the lesson now."],"answer":1,"why":"Understand is a state verb, so no -ing, even with now."}]},{"name":"Practice","items":[{"type":"fill","q":"Mia usually ___ to bed at 9 pm. (go)","answer":["goes"],"why":"Usually = a habit: goes."},{"type":"fill","q":"Mia ___ a book in bed right now. (read)","answer":["is reading","'s reading"],"why":"Right now = is + reading."},{"type":"fill","q":"It often ___ in Hong Kong in summer. (rain)","answer":["rains"],"why":"Often = a habit: rains."},{"type":"fill","q":"Look! It ___ again. (rain)","answer":["is raining","'s raining"],"why":"Look! = happening now."},{"type":"fill","q":"My brother ___ basketball every Friday. (play)","answer":["plays"],"why":"Every Friday = a habit: plays."},{"type":"fill","q":"At the moment, my brother ___ basketball with his friends. (play)","answer":["is playing","'s playing"],"why":"At the moment = now: is playing."},{"type":"fill","q":"I ___ a glass of water now. I'm so thirsty! (need)","answer":["need"],"why":"Need is a state verb, so no -ing."},{"type":"fill","q":"Sam ___ this song. He sings it all the time! (love)","answer":["loves"],"why":"Love is a feeling verb: loves, not is loving."},{"type":"fill","q":"Be quiet! Dad ___ on the phone. (talk)","answer":["is talking","'s talking"],"why":"Be quiet! tells us it is happening now."},{"type":"fill","q":"We ___ the MTR to school today because Dad's car is broken. (take)","answer":["are taking","'re taking"],"why":"Today only, not a habit, so use are taking."}]},{"name":"Challenge","items":[{"type":"order","words":["I","usually","walk","to","school"],"end":".","alt":[["usually","I","walk","to","school"]],"why":"Usually = a habit, so use the present simple."},{"type":"order","words":["what","are","you","doing","right","now"],"end":"?","alt":[],"why":"Right now = are you + doing."},{"type":"order","words":["Leo","doesn't","understand","the","question"],"end":".","alt":[],"why":"Understand is a state verb, so use the present simple."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I am wanting an ice cream.","answer":["I want an ice cream.","I want ice cream.","I want some ice cream."],"why":"Want is a state verb, so no -ing."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Look! The cat climbs the tree.","answer":["Look! The cat is climbing the tree.","Look! The cat's climbing the tree."],"why":"Look! = happening now: is climbing."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Water is boiling at 100°C.","answer":["Water boils at 100°C.","Water boils at 100 °C.","Water boils at 100 degrees.","Water boils at 100 degrees Celsius."],"why":"This is a fact that is always true, so use the present simple."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Are you knowing Mr Chan?","answer":["Do you know Mr Chan?"],"why":"Know is a state verb: Do you know …?"},{"type":"rewrite","task":"Change 'every day' to 'right now'.","s":"Sam plays computer games every day.","answer":["Sam is playing computer games right now.","Sam's playing computer games right now.","Right now Sam is playing computer games."],"why":"Right now = is + playing."}]}]},{"id":"past-simple","num":21,"title":"Past Simple: Regular Verbs & was/were","zh":"一般过去时：规则动词和 was/were","bigIdea":"We use the past simple for things that started and finished in the past: yesterday, last week, two days ago. Most verbs just add **-ed**: play → **played**. For 'be', use **was** (I / he / she / it) and **were** (you / we / they).","zhNote":"中文用“了”“昨天”来表示过去，动词本身不变；英语的动词要变成过去式（play → played）。否定和疑问用 didn't / Did，后面的动词要变回原形。","rules":[{"rule":"Most verbs: add -ed. Verbs ending in -e: add -d.","examples":["play → **played**, watch → **watched**","like → **liked**, dance → **danced**"]},{"rule":"Spelling: short verbs ending consonant-vowel-consonant double the last letter. Consonant + y → -ied. Vowel + y → just add -ed.","examples":["stop → **stopped**, plan → **planned**","study → **studied**, cry → **cried**","play → **played**, enjoy → **enjoyed**"]},{"rule":"be: I / he / she / it → was. You / we / they → were.","examples":["I **was** tired yesterday.","They **were** at the beach last Sunday.","**Was** it hot? — Yes, it **was**. We **weren't** late."]},{"rule":"Negative and questions: didn't / Did + base verb (no -ed!).","examples":["She **didn't watch** TV last night.","**Did** you **visit** the Peak? — Yes, I did."]},{"rule":"Time words: yesterday, last night / week / year, … ago, in 2020.","examples":["I **cleaned** my room **yesterday**.","We **moved** to Hong Kong **in 2020**.","Leo **arrived ten minutes ago**."]}],"tip":"**Did** takes the -ed away: She play**ed** → **Did** she **play**? → She **didn't play**.","mistakes":[{"wrong":"I didn't watched TV.","right":"I didn't **watch** TV."},{"wrong":"We was at school yesterday.","right":"We **were** at school yesterday."},{"wrong":"Yesterday I play tennis.","right":"Yesterday I **played** tennis."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Yesterday I ___ football with Leo.","options":["play","played","playing"],"answer":1,"why":"Yesterday = past, so add -ed: played."},{"type":"mc","q":"We ___ a film last night.","options":["watched","watch","watches"],"answer":0,"why":"Last night = past: watched."},{"type":"mc","q":"The bus ___ at the bus stop two minutes ago.","options":["stops","stoped","stopped"],"answer":2,"why":"Stop is short (consonant-vowel-consonant), so double the p."},{"type":"mc","q":"Mia ___ for her test last weekend.","options":["studyed","studied","studies"],"answer":1,"why":"Consonant + y → -ied: studied."},{"type":"mc","q":"I ___ at home yesterday.","options":["were","was","am"],"answer":1,"why":"I goes with was in the past."},{"type":"mc","q":"My friends ___ at the park last Sunday.","options":["were","was","are"],"answer":0,"why":"My friends = they, so use were."},{"type":"mc","q":"Sam ___ his homework last night.","options":["didn't finish","didn't finished","not finished"],"answer":0,"why":"After didn't, use the base verb: finish."},{"type":"mc","q":"___ you enjoy the party yesterday?","options":["Do","Did","Were"],"answer":1,"why":"Yesterday = past, so the question starts with Did."},{"type":"mc","q":"___ it rainy in Hong Kong last Monday?","options":["Did","Were","Was"],"answer":2,"why":"It goes with was."},{"type":"mc","q":"Which sentence is correct?","options":["Did she called you yesterday?","Does she called you yesterday?","Did she call you yesterday?"],"answer":2,"why":"Did + she + base verb: call."}]},{"name":"Practice","items":[{"type":"fill","q":"Emma ___ her grandma last weekend. (visit)","answer":["visited"],"why":"Last weekend = past: add -ed."},{"type":"fill","q":"We ___ a lot at the party last night. (dance)","answer":["danced"],"why":"Dance ends in -e, so just add -d."},{"type":"fill","q":"The baby ___ a lot last night. (cry)","answer":["cried"],"why":"Consonant + y → -ied: cried."},{"type":"fill","q":"Leo ___ his trip to Japan a month ago. (plan)","answer":["planned"],"why":"Plan is short, so double the n: planned."},{"type":"fill","q":"Ava ___ the window five minutes ago. (open)","answer":["opened"],"why":"Open just adds -ed (no double n)."},{"type":"fill","q":"I ___ very happy yesterday. (be)","answer":["was"],"why":"I goes with was."},{"type":"fill","q":"Isabelle and Mia ___ at the library after school yesterday. (be)","answer":["were"],"why":"Two people = they, so were."},{"type":"fill","q":"Sam ___ the dishes last night. (not wash)","answer":["didn't wash","did not wash"],"why":"Didn't + base verb: wash."},{"type":"fill","q":"___ your dad cook dinner yesterday? (do)","answer":["Did","did"],"why":"Past questions start with Did."},{"type":"fill","q":"The shops ___ open on Christmas Day last year. (not be)","answer":["weren't","were not"],"why":"The shops = they, so weren't."}]},{"name":"Challenge","items":[{"type":"order","words":["we","played","badminton","yesterday"],"end":".","alt":[["yesterday","we","played","badminton"]],"why":"Yesterday = past: played."},{"type":"order","words":["did","you","watch","the","match","last","night"],"end":"?","alt":[],"why":"Did + you + base verb watch."},{"type":"order","words":["she","wasn't","at","school","on","Monday"],"end":".","alt":[["on","Monday","she","wasn't","at","school"]],"why":"She goes with wasn't."},{"type":"rewrite","task":"Change to the past simple. Add 'yesterday'.","s":"I walk to school.","answer":["I walked to school yesterday.","Yesterday I walked to school."],"why":"Past simple: walk → walked."},{"type":"rewrite","task":"Find and fix the mistake.","s":"We was very hungry after the hike.","answer":["We were very hungry after the hike."],"why":"We goes with were."},{"type":"rewrite","task":"Make it negative.","s":"Mia liked the film.","answer":["Mia didn't like the film.","Mia did not like the film."],"why":"Didn't + base verb: like."},{"type":"rewrite","task":"Make it a question.","s":"Leo stopped at the shop.","answer":["Did Leo stop at the shop?"],"why":"Did + Leo + base verb stop."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Did you studied for the test last week?","answer":["Did you study for the test last week?"],"why":"After Did, use the base verb: study."}]}]},{"id":"irregular-past","num":22,"title":"Past Simple: Irregular Verbs","zh":"一般过去时：不规则动词","bigIdea":"Some verbs don't use -ed in the past. They change in their own special way: go → **went**, eat → **ate**, buy → **bought**. You just have to learn them, like learning new friends' names!","zhNote":"不规则动词的过去式没有固定规律，要多读多背。最常见的错误是 didn't went：didn't 和 Did 后面一定要用动词原形（didn't go, Did you see…?）。","rules":[{"rule":"Many verbs change their vowel sound.","examples":["begin → **began**, swim → **swam**, run → **ran**, win → **won**","come → **came**, give → **gave**, eat → **ate**","write → **wrote**, speak → **spoke**, break → **broke**, choose → **chose**"]},{"rule":"The -ought / -aught family.","examples":["buy → **bought**, think → **thought**, bring → **brought**","catch → **caught**, teach → **taught**"]},{"rule":"Other changes — learn them by heart.","examples":["go → **went**, see → **saw**, take → **took**, make → **made**, have → **had**","fly → **flew**, know → **knew**, find → **found**, tell → **told**","sleep → **slept**, feel → **felt**, leave → **left**, lose → **lost**"]},{"rule":"Some verbs look the same in the past.","examples":["put → **put**, read → **read** (say it like 'red')","I **put** my bag on the chair yesterday."]},{"rule":"didn't / Did + base verb — never the past form!","examples":["I **didn't go** to the party. (NOT didn't went)","**Did** you **see** the fireworks?","She **didn't eat** her lunch."]}],"tip":"After **did** and **didn't**, the verb goes back home to its base form: didn't went ✗ → didn't **go** ✓.","mistakes":[{"wrong":"I didn't went to the party.","right":"I didn't **go** to the party."},{"wrong":"Did you saw the rainbow?","right":"Did you **see** the rainbow?"},{"wrong":"We buyed ice cream at the beach.","right":"We **bought** ice cream at the beach."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Last Saturday we ___ to Ocean Park.","options":["goed","went","go"],"answer":1,"why":"Go is irregular: go → went."},{"type":"mc","q":"I ___ a rainbow yesterday.","options":["saw","seed","see"],"answer":0,"why":"See → saw."},{"type":"mc","q":"Leo ___ three dumplings at dim sum yesterday.","options":["eats","eated","ate"],"answer":2,"why":"Eat → ate."},{"type":"mc","q":"Mum ___ me a new book last week.","options":["buyed","bought","buy"],"answer":1,"why":"Buy → bought."},{"type":"mc","q":"Mia ___ the race on Sports Day last Friday.","options":["won","winned","wins"],"answer":0,"why":"Win → won."},{"type":"mc","q":"Ms Lee ___ us about volcanoes yesterday.","options":["teached","thought","taught"],"answer":2,"why":"Teach → taught. (Thought comes from think!)"},{"type":"mc","q":"The plane ___ to Tokyo last night.","options":["flied","flew","flyed"],"answer":1,"why":"Fly → flew."},{"type":"mc","q":"I ___ my phone at the beach yesterday.","options":["lost","losed","lose"],"answer":0,"why":"Lose → lost."},{"type":"mc","q":"Last night I ___ my keys on the table.","options":["putted","puts","put"],"answer":2,"why":"Put stays the same in the past: put."},{"type":"mc","q":"Which sentence is correct?","options":["I didn't went to the party.","I didn't go to the party.","I not went to the party."],"answer":1,"why":"After didn't, use the base verb: go."}]},{"name":"Practice","items":[{"type":"fill","q":"Isabelle ___ a letter to her pen pal last week. (write)","answer":["wrote"],"why":"Write → wrote."},{"type":"fill","q":"We ___ in the sea at Repulse Bay yesterday. (swim)","answer":["swam"],"why":"Swim → swam."},{"type":"fill","q":"Sam ___ a big fish last Sunday. (catch)","answer":["caught"],"why":"Catch → caught."},{"type":"fill","q":"I ___ the answer, so I raised my hand. (know)","answer":["knew"],"why":"Raised tells us it is past: know → knew."},{"type":"fill","q":"Leo ___ his arm when he fell off his bike last year. (break)","answer":["broke"],"why":"Break → broke."},{"type":"fill","q":"The film ___ at 7 pm last night. (begin)","answer":["began"],"why":"Begin → began."},{"type":"fill","q":"Emma ___ very tired after the long hike yesterday. (feel)","answer":["felt"],"why":"Feel → felt."},{"type":"fill","q":"My uncle ___ us some mooncakes last Mid-Autumn Festival. (bring)","answer":["brought"],"why":"Bring → brought."},{"type":"fill","q":"We ___ home at 8 o'clock yesterday morning. (leave)","answer":["left"],"why":"Leave → left."},{"type":"fill","q":"Ava ___ her lunch yesterday. She wasn't hungry. (not eat)","answer":["didn't eat","did not eat"],"why":"Didn't + base verb: eat (not ate)."}]},{"name":"Challenge","items":[{"type":"order","words":["we","took","the","MTR","to","Central","yesterday"],"end":".","alt":[["yesterday","we","took","the","MTR","to","Central"]],"why":"Take → took."},{"type":"order","words":["Mia","didn't","sleep","well","last","night"],"end":".","alt":[["last","night","Mia","didn't","sleep","well"]],"why":"Didn't + base verb: sleep (not slept)."},{"type":"order","words":["did","Leo","make","this","cake","yesterday"],"end":"?","alt":[],"why":"Did + Leo + base verb: make (not made)."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Did you saw the fireworks last night?","answer":["Did you see the fireworks last night?"],"why":"After Did, use the base verb: see."},{"type":"rewrite","task":"Change to the past simple. Add 'yesterday'.","s":"Leo runs in the park.","answer":["Leo ran in the park yesterday.","Yesterday Leo ran in the park."],"why":"Run → ran."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Mr Chan telled us a funny story yesterday.","answer":["Mr Chan told us a funny story yesterday."],"why":"Tell → told."},{"type":"rewrite","task":"Make it negative.","s":"We had pizza for dinner last night.","answer":["We didn't have pizza for dinner last night.","We did not have pizza for dinner last night."],"why":"Didn't + base verb: have (not had)."},{"type":"rewrite","task":"Change 'Every day' to 'Yesterday'.","s":"Every day Emma comes home, has a snack and reads a book.","answer":["Yesterday Emma came home, had a snack and read a book.","Yesterday Emma came home, had a snack, and read a book."],"why":"Come → came, have → had, read → read."}]}]},{"id":"past-continuous","num":23,"title":"Past Continuous","zh":"过去进行时","bigIdea":"The past continuous tells us what was **in the middle of happening** at a time in the past: At 8 pm last night, I **was reading**. It's like pressing 'pause' on a video of the past. We make it with **was / were + verb-ing**.","zhNote":"相当于中文的“（那时）正在……”。I/he/she/it 用 was，you/we/they 用 were，再加动词-ing。一个长动作被一个短动作打断时：长动作用过去进行时（常和 while 连用），短动作用一般过去时（常和 when 连用）。","rules":[{"rule":"was / were + verb-ing for an action in progress at a past time.","examples":["I **was reading** at 8 pm last night.","They **were playing** football at 4 o'clock yesterday."]},{"rule":"Negatives and questions.","examples":["She **wasn't sleeping**. We **weren't watching** TV.","**Were** you **waiting** for the bus? — Yes, I was."]},{"rule":"A long action (past continuous) is interrupted by a short action (past simple).","examples":["I **was walking** home **when** it **started** to rain.","**While** Mia **was swimming**, she **saw** a turtle."]},{"rule":"Two long actions happening at the same time.","examples":["**While** Dad **was cooking**, I **was setting** the table."]}],"tip":"Long action = **was/were + -ing**. Short action that cuts in = **past simple**. **While** + long action, **when** + short action.","mistakes":[{"wrong":"I was watch TV at 8 pm.","right":"I was **watching** TV at 8 pm."},{"wrong":"They was playing in the park.","right":"They **were** playing in the park."},{"wrong":"While I walked home, it was starting to rain.","right":"While I **was walking** home, it **started** to rain."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"At 8 pm last night, I ___ a book.","options":["was reading","were reading","am reading"],"answer":0,"why":"I goes with was, plus -ing."},{"type":"mc","q":"At 4 pm yesterday, the boys ___ football.","options":["was playing","were playing","are playing"],"answer":1,"why":"The boys = they, so were + playing."},{"type":"mc","q":"Mum ___ dinner when I got home yesterday.","options":["cooking","were cooking","was cooking"],"answer":2,"why":"Mum = she, so was + cooking."},{"type":"mc","q":"We ___ TV at 9 o'clock last night. We were asleep.","options":["weren't watching","wasn't watching","didn't watching"],"answer":0,"why":"We goes with weren't + -ing."},{"type":"mc","q":"___ you sleeping when I called you last night?","options":["Was","Were","Did"],"answer":1,"why":"You goes with were."},{"type":"mc","q":"Emma was swimming when she ___ a jellyfish.","options":["was seeing","saw","sees"],"answer":1,"why":"Seeing the jellyfish is the short action, so use the past simple."},{"type":"mc","q":"I ___ to school when I met Isabelle on the way this morning.","options":["walked","was walking","walk"],"answer":1,"why":"Walking is the long action that was going on, so was walking."},{"type":"mc","q":"While Leo ___ his bike, he fell off.","options":["was riding","rides","is riding"],"answer":0,"why":"While + long action: was riding."},{"type":"mc","q":"___ I was doing my homework, my cat jumped on the desk.","options":["During","While","Then"],"answer":1,"why":"While goes with the long action."},{"type":"mc","q":"Which sentence is correct?","options":["They was playing in the rain.","They were play in the rain.","They were playing in the rain."],"answer":2,"why":"They + were + playing."}]},{"name":"Practice","items":[{"type":"fill","q":"I ___ breakfast at 7:30 am yesterday. I started at 7:15 and finished at 7:45. (have)","answer":["was having"],"why":"At 7:30 I was in the middle of breakfast: was having."},{"type":"fill","q":"At 3 pm last Saturday, Mia and Ava ___ in the pool, so they didn't hear the phone. (swim)","answer":["were swimming"],"why":"Two people = were; double the m: swimming."},{"type":"fill","q":"Dad ___ the car when I looked out of the window yesterday. (wash)","answer":["was washing"],"why":"Washing was going on when I looked: was washing."},{"type":"fill","q":"Leo ___ to Sam when the teacher came in, so he didn't see her. (talk)","answer":["was talking"],"why":"Talking was the long action going on."},{"type":"fill","q":"We ___ dim sum when Grandma arrived, so she sat down and joined us. (eat)","answer":["were eating"],"why":"We + were + eating; Grandma arrived cut in."},{"type":"fill","q":"I was reading in bed when the lights suddenly ___ off. (go)","answer":["went"],"why":"The lights going off is the short action: went."},{"type":"fill","q":"While Emma ___ the piano, her dog started to howl. (practise)","answer":["was practising","was practicing"],"why":"While + long action: was practising."},{"type":"fill","q":"It ___ when we left school, so we didn't need umbrellas. (not rain)","answer":["wasn't raining","was not raining"],"why":"It + wasn't + raining."},{"type":"fill","q":"___ they playing basketball at 5 pm yesterday? (be)","answer":["Were","were"],"why":"They goes with were."},{"type":"fill","q":"While I was walking up Victoria Peak, I ___ a big butterfly. (see)","answer":["saw"],"why":"Seeing the butterfly is the short action: saw."}]},{"name":"Challenge","items":[{"type":"order","words":["we","were","having","lunch","at","noon"],"end":".","alt":[["at","noon","we","were","having","lunch"]],"why":"We + were + having."},{"type":"order","words":["what","were","you","doing","last","night"],"end":"?","alt":[],"why":"Question word + were + you + doing."},{"type":"order","words":["it","was","raining","when","we","left","school"],"end":".","alt":[["when","we","left","school","it","was","raining"]],"why":"Long action: was raining. Short action: left."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I was watch TV at 8 pm last night.","answer":["I was watching TV at 8 pm last night."],"why":"After was, use the -ing form: watching."},{"type":"rewrite","task":"Find and fix the mistake.","s":"The children was singing when the bell rang.","answer":["The children were singing when the bell rang."],"why":"The children = they, so were."},{"type":"rewrite","task":"Make it a question.","s":"Sam was playing the guitar at 6 pm.","answer":["Was Sam playing the guitar at 6 pm?"],"why":"Move was to the front: Was Sam …?"},{"type":"rewrite","task":"Join the sentences using 'when'.","s":"I was walking home. It started to rain.","answer":["I was walking home when it started to rain.","It started to rain when I was walking home.","When I was walking home, it started to rain."],"why":"Long action: was walking. Short action: started."},{"type":"rewrite","task":"Join the sentences using 'while'.","s":"Mia was swimming. She saw a turtle.","answer":["While Mia was swimming, she saw a turtle.","Mia saw a turtle while she was swimming.","While she was swimming, Mia saw a turtle.","Mia saw a turtle while swimming."],"why":"While goes with the long action: was swimming."}]}]},{"id":"future","num":24,"title":"The Future: will & be going to","zh":"将来时：will 和 be going to","bigIdea":"We use **will** when we decide something right now, make a promise or an offer, or guess about the future. We use **be going to** for plans we made before, and when we can see something is about to happen. After both, use the base verb: I **will help**. It **is going to rain**.","zhNote":"中文都说“将要/会”，英语要分清：当场决定、承诺、提议、猜测用 will；事先计划好的事、以及看到迹象马上要发生的事用 be going to。will 和 going to 后面都用动词原形，will 后面不加 to。","rules":[{"rule":"will + base verb: decisions made right now, offers and promises. Negative: won't.","examples":["The phone's ringing. I**'ll answer** it.","That bag looks heavy. I**'ll carry** it for you.","I **won't tell** anyone. I promise!"]},{"rule":"will for predictions (what we think will happen).","examples":["I think it **will be** sunny tomorrow.","You **will love** this book!"]},{"rule":"am / is / are going to + base verb: plans made before.","examples":["I**'m going to visit** Grandma this weekend.","We **are going to fly** to Japan next month."]},{"rule":"going to when we can SEE it is about to happen.","examples":["**Look at those dark clouds!** It **is going to rain**.","Watch out! You**'re going to fall**!"]},{"rule":"Bonus: present continuous for fixed arrangements with a time.","examples":["I**'m meeting** Mia at 3 pm tomorrow.","We**'re flying** to Japan on Friday."]}],"tip":"Decide **now** → **will**. Planned **before** → **going to**. **See** it coming → **going to**!","mistakes":[{"wrong":"I will to call you tomorrow.","right":"I will **call** you tomorrow."},{"wrong":"She going to visit her aunt.","right":"She **is going to** visit her aunt."},{"wrong":"It will rains tomorrow.","right":"It will **rain** tomorrow."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Look at those dark clouds! It ___ rain.","options":["will","is going to","going to"],"answer":1,"why":"We can see the clouds, so use is going to."},{"type":"mc","q":"The phone is ringing. I ___ answer it.","options":["will","going to","am"],"answer":0,"why":"You decide right now, so use will."},{"type":"mc","q":"I will ___ you tomorrow.","options":["to call","calling","call"],"answer":2,"why":"After will, use the base verb with no to."},{"type":"mc","q":"We bought our tickets last week. We ___ fly to Tokyo next Monday.","options":["will","are going to","is going to"],"answer":1,"why":"It is a plan made before, so are going to."},{"type":"mc","q":"That bag looks heavy. I ___ carry it for you.","options":["will","going to","am"],"answer":0,"why":"An offer made right now: will."},{"type":"mc","q":"Don't worry, I ___ tell anyone your secret. I promise!","options":["won't","willn't","don't"],"answer":0,"why":"The negative of will is won't."},{"type":"mc","q":"Emma ___ going to visit her grandma this weekend.","options":["are","is","will"],"answer":1,"why":"Emma = she, so is going to."},{"type":"mc","q":"Look! That glass is right at the edge of the table. It ___ fall!","options":["is going to","going to","is go to"],"answer":0,"why":"We can see it coming: is going to + base verb."},{"type":"mc","q":"I think it ___ be sunny tomorrow.","options":["is going","will","does"],"answer":1,"why":"I think … + will for a prediction."},{"type":"mc","q":"Which sentence is correct?","options":["She will goes to the party tomorrow.","She will go to the party tomorrow.","She will going to the party tomorrow."],"answer":1,"why":"Will + base verb: go."}]},{"name":"Practice","items":[{"type":"fill","q":"You look thirsty. Wait — I ___ get you a drink. (will / be going to)","answer":["will","'ll"],"why":"A quick offer made right now: will."},{"type":"fill","q":"We ___ visit the Science Museum next Saturday. We booked the tickets yesterday. (will / be going to)","answer":["are going to","'re going to"],"why":"It is a plan made before: are going to."},{"type":"fill","q":"Look at Leo's face! He ___ cry. (will / be going to)","answer":["is going to","'s going to"],"why":"We can see it coming: is going to."},{"type":"fill","q":"I promise I ___ be late again. (will not)","answer":["won't","will not"],"why":"A promise: won't + base verb."},{"type":"fill","q":"Mia ___ study medicine when she grows up. That's her big plan. (be going to)","answer":["is going to","'s going to"],"why":"A plan: is going to."},{"type":"fill","q":"I think it ___ very hot tomorrow. (be)","answer":["will be","'ll be","is going to be","'s going to be"],"why":"A prediction with I think: will be (going to be is OK too)."},{"type":"fill","q":"___ you help me with this box, please? (will)","answer":["Will","will"],"why":"Asking for help: Will you …?"},{"type":"fill","q":"Sam ___ going to play tennis tomorrow. He's going to swim instead. (not be)","answer":["isn't","is not","'s not"],"why":"Sam = he, so isn't going to."},{"type":"fill","q":"Hurry! The bus is leavi
