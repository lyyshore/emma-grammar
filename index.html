<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Emma's Grammar Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: an MTR-style line map of 37 grammar "stations" in 4 colour-coded lines; each station opens a lesson + 3-level practice. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --sunk: #e8ecf0;
  --ink: #17202a;
  --muted: #5a6573;
  --rule: #d6dce3;
  --l1: #c8323c;
  --l2: #1f6fb2;
  --l3: #17864a;
  --l4: #7b48ab;
  --good: #17864a;
  --good-bg: #e2f4e9;
  --bad: #c0392b;
  --bad-bg: #fbe7e4;
  --star: #e2a200;
  --display: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --surface: #1a1f26; --sunk: #232a33; --ink: #e9edf1; --muted: #9aa6b2; --rule: #2d3540;
    --l1: #ff6b73; --l2: #5ea9ef; --l3: #4cc483; --l4: #b68ce6;
    --good: #4cc483; --good-bg: #173226; --bad: #ff7b6e; --bad-bg: #3a1d1a; --star: #f5c542;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --surface: #1a1f26; --sunk: #232a33; --ink: #e9edf1; --muted: #9aa6b2; --rule: #2d3540;
  --l1: #ff6b73; --l2: #5ea9ef; --l3: #4cc483; --l4: #b68ce6;
  --good: #4cc483; --good-bg: #173226; --bad: #ff7b6e; --bad-bg: #3a1d1a; --star: #f5c542;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--l2); outline-offset: 2px; }
.zh { font-family: var(--zh); }
.muted { color: var(--muted); }

/* ---------- Home ---------- */
.hero { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
.hero h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 800; letter-spacing: -0.5px; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
.tally { display: flex; gap: 10px; flex-wrap: wrap; }
.tally div { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 14px; min-width: 104px; }
.tally b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tally span { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }

.howto { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 18px; margin-bottom: 28px; font-size: 15px; display: grid; gap: 4px; }
.howto strong { font-family: var(--display); font-size: 17px; }
.howto-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

.lines { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr)); gap: 24px; align-items: start; }
.line { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 18px 18px 10px; min-width: 0; }
.line-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.line-badge { background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; border-radius: 999px; padding: 2px 12px; font-size: 15px; white-space: nowrap; }
.line-head h2 { font-size: 22px; }
.line-head .zh { font-size: 14px; color: var(--muted); }
.stations { list-style: none; margin: 0; padding: 0; position: relative; }
.stations::before { content: ""; position: absolute; left: 15px; top: 22px; bottom: 22px; width: 8px; background: var(--c); border-radius: 4px; }
.station { position: relative; }
.station button { width: 100%; display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 9px 6px 9px 0; border-radius: 10px; }
.station button:hover { background: var(--sunk); }
.dot { width: 30px; height: 30px; margin-left: 4px; border-radius: 50%; background: var(--surface); border: 6px solid var(--c); position: relative; z-index: 1; }
.station.done .dot { background: var(--c); box-shadow: inset 0 0 0 3px var(--surface); }
.st-title { font-weight: 700; line-height: 1.3; }
.st-title small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.st-num { font-family: var(--display); color: var(--muted); font-size: 13px; margin-right: 4px; font-variant-numeric: tabular-nums; }
.stars { color: var(--rule); font-size: 16px; letter-spacing: 1px; white-space: nowrap; }
.stars .on { color: var(--star); }
.mini-progress { font-size: 12px; color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { border: 0; border-radius: 12px; padding: 11px 20px; font-weight: 800; background: var(--c, var(--l2)); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--sunk); color: var(--ink); }
.btn.small { padding: 7px 14px; font-size: 14px; }
.linkish { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 14px; }

/* ---------- Topic ---------- */
.topic { max-width: 780px; margin: 0 auto; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.back { background: none; border: 0; font-weight: 800; color: var(--muted); padding: 6px 0; }
.t-head { border-left: 10px solid var(--c); padding: 2px 0 2px 16px; margin-bottom: 22px; }
.t-head .eyebrow { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--c); }
.t-head h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 800; }
.t-head .zh { color: var(--muted); font-size: 17px; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 22px; margin-bottom: 22px; }
.panel h2 { font-size: 24px; margin-bottom: 10px; }
.bigidea { font-size: 19px; margin: 0 0 12px; }
.zhnote { background: var(--sunk); border-radius: 10px; padding: 10px 14px; font-size: 15px; margin: 0 0 18px; }
.rules { display: grid; gap: 14px; margin: 0 0 18px; padding: 0; list-style: none; counter-reset: r; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.rules li::before { content: counter(r); width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; display: grid; place-items: center; font-size: 15px; }
.rules .rule { font-weight: 700; }
.rules ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.rules ul li { display: list-item; counter-increment: none; }
.rules ul li::before { content: none; }
.tip { border: 2px dashed var(--c); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; }
.tip b { font-family: var(--display); color: var(--c); }
.mistakes { display: grid; gap: 8px; }
.mistake { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; font-size: 16px; }
.mistake .w { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.mistake .r { color: var(--good); font-weight: 700; }
@media (max-width: 560px) { .mistake { grid-template-columns: 1fr; gap: 0; } .mistake .arrow { display: none; } .mistake { padding-bottom: 8px; border-bottom: 1px solid var(--rule); } }

.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.lvl { background: var(--sunk); border: 2px solid transparent; border-radius: 12px; padding: 10px 8px; text-align: center; line-height: 1.25; }
.lvl b { display: block; font-family: var(--display); font-size: 17px; }
.lvl span { font-size: 13px; color: var(--muted); }
.lvl.active { border-color: var(--c); background: var(--surface); }

.qbar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.qbar i { display: block; height: 100%; background: var(--c); transition: width .25s; }
.qmeta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.q { font-size: 21px; font-weight: 700; margin: 0 0 16px; line-height: 1.45; }
.task { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--c); margin-bottom: 6px; }
.given { font-size: 20px; background: var(--sunk); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--rule); border-radius: 12px; padding: 12px 16px; font-size: 18px; font-weight: 600; display: flex; gap: 12px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt .k { font-family: var(--display); color: var(--muted); font-weight: 800; }
.opt.picked { border-color: var(--c); background: var(--sunk); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.blank { font: inherit; font-weight: 700; color: var(--c); border: 0; border-bottom: 3px solid var(--c); background: var(--sunk); border-radius: 6px 6px 0 0; padding: 0 8px; width: 9em; max-width: 100%; }
.answer-input { width: 100%; font: inherit; font-size: 19px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--rule); background: var(--surface); color: var(--ink); }
.answer-input:focus { border-color: var(--c); outline: none; }
.tray { min-height: 56px; border: 2px dashed var(--rule); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tray.built { border-style: solid; border-color: var(--c); }
.tray .hint { color: var(--muted); font-size: 14px; padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 18px; font-weight: 700; }
.chip:hover { border-color: var(--c); }
.end-mark { font-size: 20px; font-weight: 800; }

.feedback { margin-top: 16px; border-radius: 12px; padding: 12px 16px; font-size: 16px; }
.feedback.good { background: var(--good-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback b { font-family: var(--display); font-size: 18px; }
.feedback.good b { color: var(--good); }
.feedback.bad b { color: var(--bad); }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

.result { text-align: center; padding: 10px 0; }
.result .big { font-family: var(--display); font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.result .stars { font-size: 34px; }
.result .actions { justify-content: center; }
.review-list { text-align: left; margin-top: 18px; display: grid; gap: 8px; font-size: 15px; }
.review-list div { background: var(--sunk); border-radius: 10px; padding: 8px 12px; }

.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app"></div>

<script>
const TOPICS = [{"id":"sentences","num":1,"title":"What Is a Sentence?","zh":"什么是句子","bigIdea":"A sentence is a group of words that makes a **complete thought**. It needs a **subject** (who or what) and a **verb** (what they do or are). It always starts with a **capital letter** and ends with a full stop (.), a question mark (?) or an exclamation mark (!).","zhNote":"英文每个句子都必须以大写字母开头，并用 . ? ! 结尾。注意英文的句号是一个小圆点（.），不是中文的“。”。","rules":[{"rule":"A sentence needs a subject (who or what) and a verb (the action). Without both, it is not a complete thought.","examples":["**Emma** **swims**.","In the park. → **Leo** **plays** in the park.","The big red bus. → The big red bus **stopped**."]},{"rule":"Start every sentence with a capital letter. End it with an end mark: . ? or !","examples":["my dog is cute → **M**y dog is cute**.**","where is Mia → **W**here is Mia**?**"]},{"rule":"A statement tells something and ends with a full stop. A question asks something and ends with a question mark.","examples":["Statement: The MTR is fast**.**","Question: Do you like dim sum**?**"]},{"rule":"A command tells someone to do something. The subject 'you' is hidden. It usually ends with a full stop (or ! if it is strong).","examples":["Please close the window**.**","Open your books**.**","Watch out**!**"]},{"rule":"An exclamation shows a strong feeling, like surprise or joy. It ends with an exclamation mark.","examples":["**What** a beautiful view**!**","**How** fast you run**!**"]}],"tip":"Think **Capital at the start, mark at the end** — like putting a hat on its head and shoes on its feet!","mistakes":[{"wrong":"my friend likes swimming","right":"My friend likes swimming."},{"wrong":"Do you like pandas.","right":"Do you like pandas?"},{"wrong":"Plays the piano every day.","right":"Ava plays the piano every day."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Which is a complete sentence?","options":["The big red bus.","The bus is red.","On the big bus."],"answer":1,"why":"'The bus is red' has a subject (the bus) and a verb (is)."},{"type":"mc","q":"Which is a complete sentence?","options":["Leo plays football.","Plays football after school.","Leo and his friends."],"answer":0,"why":"It has a subject (Leo) and a verb (plays)."},{"type":"mc","q":"Which sentence is written correctly?","options":["my cat is sleeping.","My cat is sleeping","My cat is sleeping."],"answer":2,"why":"It starts with a capital letter and ends with a full stop."},{"type":"mc","q":"Choose the end mark: Where do you live___","options":[".","?","!"],"answer":1,"why":"It asks something, so it is a question. Questions end with ?"},{"type":"mc","q":"What kind of sentence is this? 'The MTR is very busy.'","options":["statement","question","command","exclamation"],"answer":0,"why":"It just tells us something, so it is a statement."},{"type":"mc","q":"What kind of sentence is this? 'Please open your books.'","options":["statement","question","command","exclamation"],"answer":2,"why":"It tells someone to do something, so it is a command."},{"type":"mc","q":"What kind of sentence is this? 'Can Mia come to my party?'","options":["statement","question","command","exclamation"],"answer":1,"why":"It asks something and ends with a question mark."},{"type":"mc","q":"What kind of sentence is this? 'What a beautiful view from Victoria Peak!'","options":["statement","question","command","exclamation"],"answer":3,"why":"It shows a strong feeling and ends with !"},{"type":"mc","q":"Choose the end mark: What a funny joke___","options":[".","!","?"],"answer":1,"why":"'What a…' shows a strong feeling, so it is an exclamation."},{"type":"mc","q":"Which sentence is written correctly?","options":["is it raining in Hong Kong?","Is it raining in Hong Kong.","Is it raining in Hong Kong?"],"answer":2,"why":"A capital letter at the start, and a question needs a question mark."}]},{"name":"Practice","items":[{"type":"fill","q":"In the sentence 'Leo runs.', the subject is ___.","answer":["Leo"],"why":"Leo is the person doing the action."},{"type":"fill","q":"In the sentence 'Leo runs.', the verb is ___.","answer":["runs"],"why":"'Runs' is the action word."},{"type":"fill","q":"In the sentence 'The puppy barked.', the verb is ___.","answer":["barked"],"why":"'Barked' is what the puppy did."},{"type":"fill","q":"In the sentence 'My sister laughed.', the subject is ___.","answer":["my sister","My sister","sister"],"why":"My sister is the one who laughed."},{"type":"fill","q":"Add a subject to make a sentence: ___ swims every Saturday. (Mia / quickly / in the pool)","answer":["Mia"],"why":"We need WHO swims. Mia is a person, so she is the subject."},{"type":"fill","q":"Add a verb to make a sentence: The children ___ in the playground. (happy / played / slowly)","answer":["played"],"why":"'Played' is an action word, so it is the verb."},{"type":"fill","q":"'Ms Lee teaches science.' This kind of sentence is a ___. (statement / question / command / exclamation)","answer":["statement"],"why":"It tells us a fact and ends with a full stop."},{"type":"fill","q":"'Do you like dim sum?' This kind of sentence is a ___. (statement / question / command / exclamation)","answer":["question"],"why":"It asks something and ends with a question mark."},{"type":"fill","q":"'Turn off the lights.' This kind of sentence is a ___. (statement / question / command / exclamation)","answer":["command"],"why":"It tells someone to do something."},{"type":"fill","q":"'What a huge typhoon!' This kind of sentence is called ___. (statement / question / command / exclamation)","answer":["an exclamation","exclamation"],"why":"It shows a strong feeling and ends with !"}]},{"name":"Challenge","items":[{"type":"order","words":["Emma","reads","a","book","every","night"],"end":".","alt":[["every","night","Emma","reads","a","book"]],"why":"Subject (Emma) + verb (reads). A statement ends with a full stop."},{"type":"order","words":["do","you","like","dim","sum"],"end":"?","alt":[],"why":"This asks something, so it is a question with ?"},{"type":"rewrite","task":"Write it correctly with a capital letter and the correct end mark.","s":"where is my pencil case","answer":["Where is my pencil case?"],"strict":true,"why":"Capital W at the start. It asks something, so end with ?"},{"type":"rewrite","task":"Write it correctly as a statement. Fix the capital letters and add an end mark.","s":"mia and i love swimming","answer":["Mia and I love swimming."],"strict":true,"why":"Capital at the start; Mia is a name and I is always a capital. Statements end with a full stop."},{"type":"order","words":["please","close","the","window"],"end":".","alt":[["close","the","window","please"]],"why":"A command tells someone to do something. The hidden subject is 'you'."},{"type":"order","words":["what","a","beautiful","view","this","is"],"end":"!","alt":[],"why":"'What a…' sentences show strong feeling, so they end with !"},{"type":"rewrite","task":"Turn it into an exclamation that starts with 'What a'.","s":"It is a big cake.","answer":["What a big cake!","What a big cake it is!"],"strict":true,"why":"Exclamations show strong feeling: What a big cake!"},{"type":"rewrite","task":"Make it a complete sentence by adding the subject 'Ava'.","s":"Plays the piano every day.","answer":["Ava plays the piano every day."],"strict":true,"why":"The sentence needed a subject. Now we know WHO plays the piano."}]}]},{"id":"nouns","num":2,"title":"Common & Proper Nouns","zh":"普通名词和专有名词","bigIdea":"A **noun** is a naming word. It names a person, a place, a thing or an idea. A **common noun** is a general name, like girl, city or day. A **proper noun** is the special name of one person, place or thing, like Emma, Hong Kong or Monday, and it always starts with a **capital letter**.","zhNote":"中文没有大小写，所以要特别注意：英文的人名、地名、星期、月份、国家和语言都要大写首字母。但季节（summer）和大部分科目（maths）不用大写。","rules":[{"rule":"Nouns name people, places, things and ideas.","examples":["Person: **teacher**, **friend**","Place: **school**, **beach**","Thing: **piano** — Idea: **kindness**"]},{"rule":"A common noun is a general name. It starts with a small letter (unless it starts the sentence).","examples":["a **girl** → **Emma**","a **city** → **Hong Kong**","a **day** → **Monday**"]},{"rule":"A proper noun is a special name. It always starts with a capital letter: names, days, months, cities, countries and languages.","examples":["**Mr Chan**, **Isabelle**","**Monday**, **July**","**Tokyo**, **Japan**, **English**, **Chinese**"]},{"rule":"Seasons and most school subjects are common nouns — no capital! But English and Chinese are languages, so they always get a capital.","examples":["I love **summer**.","We have **maths** and **science** today.","We have **English** and **Chinese** today."]}],"tip":"Is it the ONE special name of someone or something? Then give it a **capital crown**!","mistakes":[{"wrong":"I go swimming on saturday.","right":"I go swimming on **Saturday**."},{"wrong":"My Birthday is in may.","right":"My **birthday** is in **May**."},{"wrong":"She can speak english.","right":"She can speak **English**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Which word is a noun?","options":["happy","dog","run"],"answer":1,"why":"A dog is a thing (an animal) you can name."},{"type":"mc","q":"Which word is a noun?","options":["quickly","jump","school"],"answer":2,"why":"A school is a place, so it is a noun."},{"type":"mc","q":"Which word is a noun (an idea)?","options":["kindness","kind","kindly"],"answer":0,"why":"Kindness is an idea. You can't touch it, but it is still a noun."},{"type":"mc","q":"Which is a proper noun?","options":["city","Hong Kong","street"],"answer":1,"why":"Hong Kong is the special name of one city."},{"type":"mc","q":"Which is a proper noun?","options":["Tuesday","day","week"],"answer":0,"why":"Days of the week are special names, so they need capitals."},{"type":"mc","q":"Which is a common noun?","options":["Leo","Japan","teacher"],"answer":2,"why":"'Teacher' is a general word, not the name of one special person."},{"type":"mc","q":"Which sentence is written correctly?","options":["We have art on friday.","We have art on Friday.","We have Art on friday."],"answer":1,"why":"Days need a capital. School subjects like art don't."},{"type":"mc","q":"Which sentence is written correctly?","options":["My birthday is in March.","My Birthday is in march.","My birthday is in march."],"answer":0,"why":"Months are proper nouns. 'Birthday' is a common noun."},{"type":"mc","q":"Which sentence is written correctly?","options":["Mia can speak french.","Mia can speak French.","Mia Can speak French."],"answer":1,"why":"Languages are proper nouns, so French needs a capital F."},{"type":"mc","q":"Which sentence is written correctly?","options":["We go to Japan every Summer.","we go to Japan every summer.","We go to Japan every summer."],"answer":2,"why":"Countries get capitals, but seasons like summer do not."}]},{"name":"Practice","items":[{"type":"fill","q":"The ___ is on my desk. (book / blue / quickly)","answer":["book"],"why":"A book is a thing, so it is a noun."},{"type":"fill","q":"My ___ helps me with my homework. (brother / kindly / happy)","answer":["brother"],"why":"A brother is a person, so it is a noun."},{"type":"fill","q":"We like to swim at the ___ in summer. (beach / swim / wet)","answer":["beach"],"why":"A beach is a place, so it is a noun."},{"type":"fill","q":"The month after June is ___.","answer":["July"],"why":"Months are proper nouns, so July starts with a capital.","exact":"cs"},{"type":"fill","q":"People in Japan speak ___.","answer":["Japanese"],"why":"Languages are proper nouns, so Japanese needs a capital.","exact":"cs"},{"type":"fill","q":"Find the proper noun: 'My aunt visited us in December.' → ___","answer":["December"],"why":"December is the name of a month, so it is a proper noun.","exact":"cs"},{"type":"fill","q":"Find the proper noun: 'My uncle lives near a beach in Sai Kung.' → ___","answer":["Sai Kung"],"why":"Sai Kung is the name of one special place. 'Uncle' and 'beach' are common nouns.","exact":"cs"},{"type":"fill","q":"Find the common noun: 'Ava ate a mango in Tokyo.' → ___","answer":["mango"],"why":"Ava and Tokyo are special names. A mango is a general thing."},{"type":"fill","q":"Find the idea noun: 'Thank you for your kindness.' → ___","answer":["kindness"],"why":"Kindness is an idea — a noun you can't touch."},{"type":"fill","q":"Find the person's name: 'Our teacher, Mr Chan, likes chess.' → ___","answer":["Mr Chan"],"why":"Mr Chan is a special name, so both words have capitals.","exact":"cs"}]},{"name":"Challenge","items":[{"type":"order","words":["Emma","visited","Japan","in","April"],"end":".","alt":[["in","April","Emma","visited","Japan"]],"why":"Emma, Japan and April are proper nouns, so they have capitals."},{"type":"order","words":["Leo","has","swimming","on","Saturday"],"end":".","alt":[["on","Saturday","Leo","has","swimming"]],"why":"Leo and Saturday are special names. 'Swimming' is a common noun."},{"type":"order","words":["my","best","friend","speaks","English","and","French"],"end":".","alt":[["my","best","friend","speaks","French","and","English"]],"why":"Languages are proper nouns, so English and French have capitals."},{"type":"order","words":["Ms","Lee","took","us","to","Ocean","Park"],"end":".","alt":[],"why":"Ms Lee and Ocean Park are special names, so every word has a capital."},{"type":"rewrite","task":"Fix the capital letters.","s":"i live in hong kong.","answer":["I live in Hong Kong."],"strict":true,"why":"'I' is always a capital. Hong Kong is the name of a city."},{"type":"rewrite","task":"Fix the capital letters.","s":"my cousin isabelle lives in london.","answer":["My cousin Isabelle lives in London."],"strict":true,"why":"Start with a capital. Isabelle and London are special names."},{"type":"rewrite","task":"Fix the capital letters.","s":"we fly to Paris every Summer.","answer":["We fly to Paris every summer."],"strict":true,"why":"Start with a capital. Seasons like summer are common nouns, so no capital."},{"type":"rewrite","task":"Fix the capital letters.","s":"sam and i speak chinese at home on sundays.","answer":["Sam and I speak Chinese at home on Sundays."],"strict":true,"why":"Names, I, languages and days all need capitals."}]}]},{"id":"plurals","num":3,"title":"Singular & Plural Nouns","zh":"单数和复数名词","bigIdea":"**Singular** means one. **Plural** means more than one. In English, when there is more than one thing, the noun changes — usually we just add **-s** (one cat, two cats). Some words follow special spelling rules, and a few words change in their own funny way.","zhNote":"中文说“一只猫、两只猫”，“猫”字不变；英文名词有两个以上时要变成复数，例如 cat → cats，child → children。","rules":[{"rule":"Most nouns: add -s.","examples":["one cat → two **cats**","a book → many **books**"]},{"rule":"Nouns ending in -s, -x, -ch, -sh and some ending in -o: add -es.","examples":["bus → **buses**, box → **boxes**","watch → **watches**, dish → **dishes**","tomato → **tomatoes** (but piano → **pianos**, photo → **photos**)"]},{"rule":"Consonant + y: change y to i and add -es. Vowel + y (ay, ey, oy): just add -s.","examples":["baby → **babies**, city → **cities**","boy → **boys**, day → **days**"]},{"rule":"Many nouns ending in -f or -fe: change to -ves.","examples":["leaf → **leaves**, wolf → **wolves**","knife → **knives**"]},{"rule":"Irregular nouns change in their own way — learn them by heart! Some don't change at all.","examples":["child → **children**, man → **men**, woman → **women**, person → **people**","tooth → **teeth**, foot → **feet**, mouse → **mice**","sheep → **sheep**, fish → **fish**"]}],"tip":"One **tooth**, two **teeth**; one **foot**, two **feet** — the oo turns into ee! And one sheep, two sheep: sheep never change.","mistakes":[{"wrong":"I have two childs.","right":"I have two **children**."},{"wrong":"There are three box on the table.","right":"There are three **boxes** on the table."},{"wrong":"Hong Kong and Tokyo are big citys.","right":"Hong Kong and Tokyo are big **cities**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I have two ___.","options":["cat","cats","cates"],"answer":1,"why":"Two = more than one. Most nouns just add -s."},{"type":"mc","q":"There are three ___ on my desk.","options":["boxes","boxs","box"],"answer":0,"why":"Words ending in -x add -es."},{"type":"mc","q":"Mum washed all the ___.","options":["dishs","dish","dishes"],"answer":2,"why":"Words ending in -sh add -es."},{"type":"mc","q":"The ___ are sleeping.","options":["babys","babies","babyes"],"answer":1,"why":"Consonant + y: change y to i and add -es."},{"type":"mc","q":"Many ___ are playing in the park.","options":["boys","boies","boyes"],"answer":0,"why":"Vowel + y (oy): just add -s."},{"type":"mc","q":"In autumn, the ___ turn red and yellow.","options":["leafs","leaves","leafes"],"answer":1,"why":"Leaf ends in -f, so it changes to -ves."},{"type":"mc","q":"I brush my ___ every morning.","options":["teeth","tooths","teeths"],"answer":0,"why":"Tooth is irregular: one tooth, two teeth."},{"type":"mc","q":"The ___ are playing in the playground.","options":["childs","childrens","children"],"answer":2,"why":"Child is irregular: one child, many children."},{"type":"mc","q":"Three ___ are eating grass on the hill.","options":["sheeps","sheep","sheepes"],"answer":1,"why":"Sheep stays the same: one sheep, three sheep."},{"type":"mc","q":"There are two ___ in the music room.","options":["piano","pianoes","pianos"],"answer":2,"why":"Piano is a special -o word that just adds -s."}]},{"name":"Practice","items":[{"type":"fill","q":"I ate two ___ for lunch. (apple)","answer":["apples"],"why":"Most nouns just add -s."},{"type":"fill","q":"We waited for two ___. (bus)","answer":["buses"],"why":"Words ending in -s add -es."},{"type":"fill","q":"We need four ___ for the salad. (tomato)","answer":["tomatoes"],"why":"Tomato adds -es: tomatoes."},{"type":"fill","q":"Hong Kong and Tokyo are big ___. (city)","answer":["cities"],"why":"Consonant + y: change y to i and add -es."},{"type":"fill","q":"There are seven ___ in a week. (day)","answer":["days"],"why":"Vowel + y (ay): just add -s."},{"type":"fill","q":"We need six ___ for dinner. (knife)","answer":["knives"],"why":"Knife ends in -fe, so it changes to -ves."},{"type":"fill","q":"Our class has two pet ___. (mouse)","answer":["mice"],"why":"Mouse is irregular: one mouse, two mice."},{"type":"fill","q":"Two ___ are talking to Ms Lee. (woman)","answer":["women"],"why":"Woman is irregular: one woman, two women."},{"type":"fill","q":"Ten ___ are waiting at the MTR station. (person)","answer":["people"],"why":"Person is irregular: one person, many people."},{"type":"fill","q":"I have ten toes and two ___. (foot)","answer":["feet"],"why":"Foot is irregular: one foot, two feet."}]},{"name":"Challenge","items":[{"type":"order","words":["the","children","are","playing","football"],"end":".","alt":[],"why":"Children is the plural of child."},{"type":"order","words":["there","are","five","boxes","on","the","shelf"],"end":".","alt":[["on","the","shelf","there","are","five","boxes"]],"why":"Five boxes = more than one, and box adds -es."},{"type":"rewrite","task":"Change 'one' to 'three' and fix the noun.","s":"I saw one sheep on the farm.","answer":["I saw three sheep on the farm."],"why":"Sheep doesn't change: one sheep, three sheep."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Leo brushed his tooths.","answer":["Leo brushed his teeth."],"why":"The plural of tooth is teeth."},{"type":"order","words":["two","little","mice","live","in","our","garden"],"end":".","alt":[["in","our","garden","two","little","mice","live"]],"why":"Mice is the plural of mouse."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Mia has two rabbits and three mouses.","answer":["Mia has two rabbits and three mice."],"why":"The plural of mouse is mice."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"We saw some foxs and two wolfs.","answer":["We saw some foxes and two wolves."],"why":"Fox ends in -x, so add -es. Wolf ends in -f, so it becomes wolves."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"The womans put the knifes on the table.","answer":["The women put the knives on the table."],"why":"Woman → women (irregular). Knife → knives (-fe becomes -ves)."}]}]},{"id":"countable","num":4,"title":"Countable & Uncountable Nouns","zh":"可数名词和不可数名词","bigIdea":"Some things we can count one by one: one apple, two apples. These are **countable** nouns. Other things we can't count one by one, like water, rice or homework. These are **uncountable** nouns — they have no plural, and we don't put a or an in front of them.","zhNote":"中文说“一杯水”“一条信息”要用量词，英文的不可数名词也一样：a glass of water, a piece of information。注意 homework、information、bread 在英文里不可数，不能加 -s。","rules":[{"rule":"Countable nouns can be one or many. Use a/an for one, and add -s for more.","examples":["an apple → three **apples**","a friend → many **friends**"]},{"rule":"Uncountable nouns have no plural and no a/an.","examples":["**water**, **rice**, **bread**, **milk**, **juice**","**homework**, **information**, **money**, **music**","I have a lot of **homework**. (not homeworks)"]},{"rule":"To count an uncountable noun, use a container or amount word: a piece of, a glass of, a bowl of, a bottle of.","examples":["**a piece of** cake, **a piece of** information","**a glass of** water → **two glasses of** water","**a bowl of** rice, **a bottle of** juice"]},{"rule":"Use many with countable nouns and much with uncountable nouns (mostly in questions and negatives). A lot of works with both!","examples":["How **many** books? / How **much** water?","I don't have **much** time.","**a lot of** friends, **a lot of** homework"]},{"rule":"Use some in positive sentences. Use any in negatives and questions.","examples":["I have **some** rice.","There aren't **any** eggs.","Is there **any** milk?"]}],"tip":"Can you count it on your fingers? Then ask **How many?** If you can't, ask **How much?**","mistakes":[{"wrong":"I have a lot of homeworks.","right":"I have a lot of **homework**."},{"wrong":"Can you give me an information?","right":"Can you give me **some information**?"},{"wrong":"How much apples do you want?","right":"How **many** apples do you want?"}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Which noun is uncountable?","options":["apple","water","chair"],"answer":1,"why":"You can't count water one by one, so it is uncountable."},{"type":"mc","q":"Which noun is countable?","options":["rice","milk","egg"],"answer":2,"why":"You can count eggs: one egg, two eggs."},{"type":"mc","q":"Which noun is uncountable?","options":["homework","book","pencil"],"answer":0,"why":"Homework is uncountable in English — no -s!"},{"type":"mc","q":"I have a lot of ___ tonight.","options":["homeworks","homework","a homework"],"answer":1,"why":"Homework is uncountable: no -s and no a."},{"type":"mc","q":"Can I have ___ water, please?","options":["a piece of","a glass of","a slice of"],"answer":1,"why":"We drink water from a glass: a glass of water."},{"type":"mc","q":"Grandma gave me ___ cake.","options":["a piece of","a glass of","a bottle of"],"answer":0,"why":"We cut cake into pieces: a piece of cake."},{"type":"mc","q":"How ___ books do you have?","options":["much","many","a lot"],"answer":1,"why":"Books are countable, so we say How many."},{"type":"mc","q":"How ___ milk is in the fridge?","options":["many","much","a few"],"answer":1,"why":"Milk is uncountable, so we say How much."},{"type":"mc","q":"There isn't ___ bread left.","options":["any","some","many"],"answer":0,"why":"In negative sentences we use any."},{"type":"mc","q":"Which sentence is correct?","options":["Ms Lee gave us an information.","Ms Lee gave us some informations.","Ms Lee gave us some information."],"answer":2,"why":"Information is uncountable: no a/an and no -s."}]},{"name":"Practice","items":[{"type":"fill","q":"I'd like a ___ of orange juice. (glass / piece)","answer":["glass","bottle","cup"],"why":"Juice is uncountable, so we count it by the glass."},{"type":"fill","q":"Can I have a ___ of paper? (piece / bowl)","answer":["piece","sheet"],"why":"Paper is uncountable, so we say a piece of paper."},{"type":"fill","q":"Grandma cooked a big ___ of rice for me. (bowl / glass)","answer":["bowl","pot"],"why":"We eat rice from a bowl: a bowl of rice."},{"type":"fill","q":"We need two ___ of water for the hike. (bottle)","answer":["bottles"],"why":"Two = more than one, so bottle becomes bottles. Water stays the same."},{"type":"fill","q":"How ___ students are in your class? (much / many)","answer":["many"],"why":"Students are countable, so we use many."},{"type":"fill","q":"How ___ money do you have? (much / many)","answer":["much"],"why":"Money is uncountable, so we use much."},{"type":"fill","q":"There aren't ___ eggs in the box. (some / any)","answer":["any"],"why":"Negative sentence (aren't), so we use any."},{"type":"fill","q":"I bought ___ bread at the bakery. (some / any)","answer":["some"],"why":"Positive sentence, so we use some."},{"type":"fill","q":"Leo eats ___ rice every day. (a lot of / many)","answer":["a lot of","lots of"],"why":"Rice is uncountable, so not many. A lot of works with both kinds."},{"type":"fill","q":"Ms Lee gave us three ___ of information. (piece)","answer":["pieces"],"why":"Information can't take -s, so we count the pieces instead."}]},{"name":"Challenge","items":[{"type":"order","words":["can","I","have","a","glass","of","water"],"end":"?","alt":[],"why":"Water is uncountable, so we use a glass of."},{"type":"order","words":["how","much","juice","is","in","the","bottle"],"end":"?","alt":[],"why":"Juice is uncountable, so we ask How much."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I have a lot of homeworks today.","answer":["I have a lot of homework today."],"why":"Homework is uncountable, so it never takes -s."},{"type":"rewrite","task":"Find and fix the mistake.","s":"How much apples are in the bag?","answer":["How many apples are in the bag?"],"why":"Apples are countable, so we use How many."},{"type":"order","words":["there","are","a","lot","of","people","on","the","MTR"],"end":".","alt":[["on","the","MTR","there","are","a","lot","of","people"]],"why":"A lot of works with countable nouns like people."},{"type":"rewrite","task":"Find and fix the mistake.","s":"There aren't some cookies left.","answer":["There aren't any cookies left.","There are not any cookies left.","There are no cookies left."],"why":"In negative sentences, use any, not some."},{"type":"rewrite","task":"Fix the mistake using 'glasses of'.","s":"Mia drank two milks.","answer":["Mia drank two glasses of milk."],"why":"Milk is uncountable, so we count the glasses: two glasses of milk."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"Ms Lee gave us many informations.","answer":["Ms Lee gave us a lot of information.","Ms Lee gave us lots of information.","Ms Lee gave us much information."],"why":"Information is uncountable: no -s, and use a lot of instead of many."}]}]},{"id":"articles","num":5,"title":"A, An and The","zh":"冠词 a、an、the","bigIdea":"**A** and **an** mean 'one'. We use them for any one thing, or when we talk about something for the first time. **The** points to one special thing that we both know about. We choose a or an by the **sound** at the start of the next word, not the letter.","zhNote":"中文没有冠词，所以很容易漏掉 a/an/the。记住：单数可数名词前面通常要有 a、an 或 the（或 my、this 等）。a 还是 an 要听发音，不是看字母。","rules":[{"rule":"Use a before a consonant sound and an before a vowel sound (a, e, i, o, u sounds). Listen to the sound, not the letter!","examples":["**a** dog, **a** banana","**an** apple, **an** egg, **an** umbrella","**an** hour (the h is silent), **a** uniform (it sounds like 'you')"]},{"rule":"Use a/an when you talk about something for the first time, or one of many. Also for jobs.","examples":["I saw **a** cat in the garden.","Can I borrow **a** pen?","Emma's mum is **a** doctor."]},{"rule":"Use the for something we already know about, something specific, or the only one.","examples":["I saw a cat. **The** cat was black.","Please close **the** door.","**the** sun, **the** moon, **the** best player"]},{"rule":"No article when you talk about things in general (plural or uncountable nouns).","examples":["I like **dogs**.","**Milk** is good for you."]},{"rule":"No article before meals and sports. But musical instruments take the!","examples":["We have **lunch** at 12.","Leo plays **football**.","Emma plays **the piano**."]}],"tip":"**Listen, don't look!** If the next word starts with a vowel SOUND, use **an**: an hour, an egg — but a uniform, a unicorn.","mistakes":[{"wrong":"I have a apple.","right":"I have **an** apple."},{"wrong":"My mum is teacher.","right":"My mum is **a** teacher."},{"wrong":"I play the basketball after the lunch.","right":"I play **basketball** after **lunch**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I eat ___ apple every day.","options":["a","an","(no word)"],"answer":1,"why":"Apple starts with a vowel sound, so we use an."},{"type":"mc","q":"Leo has ___ new bike.","options":["a","an","(no word)"],"answer":0,"why":"New starts with an 'n' sound (a consonant), so we use a."},{"type":"mc","q":"Mia is ___ honest girl.","options":["(no word)","a","an"],"answer":2,"why":"The h in honest is silent. It starts with an 'o' sound, so an."},{"type":"mc","q":"Isabelle's new school has ___ uniform with a red tie.","options":["a","an","(no word)"],"answer":0,"why":"Uniform starts with a 'you' sound, so we use a."},{"type":"mc","q":"I'll be back in ___ hour.","options":["an","a","(no word)"],"answer":0,"why":"The h in hour is silent, so it starts with a vowel sound."},{"type":"mc","q":"Look at ___ moon! It's so bright tonight.","options":["a","the","(no word)"],"answer":1,"why":"There is only one moon, so we use the."},{"type":"mc","q":"I saw a dog in the park. ___ dog was chasing a ball.","options":["A","The","An"],"answer":1,"why":"We already talked about this dog, so now it's the dog."},{"type":"mc","q":"Emma plays ___ tennis on Saturdays.","options":["the","a","(no word)"],"answer":2,"why":"We don't use an article before sports."},{"type":"mc","q":"We have ___ breakfast at 7 o'clock.","options":["a","the","(no word)"],"answer":2,"why":"We don't use an article before meals."},{"type":"mc","q":"Which sentence is correct?","options":["My dad is engineer.","My dad is an engineer.","My dad is a engineer."],"answer":1,"why":"Jobs need a/an. Engineer starts with a vowel sound, so an."}]},{"name":"Practice","items":[{"type":"fill","q":"My sister wants ___ orange. (a / an)","answer":["an"],"why":"Orange starts with a vowel sound."},{"type":"fill","q":"There is ___ bird on the roof. (a / an)","answer":["a"],"why":"Bird starts with a consonant sound."},{"type":"fill","q":"Leo is reading ___ interesting book. (a / an)","answer":["an"],"why":"Look at the very next word: interesting starts with a vowel sound."},{"type":"fill","q":"It takes ___ hour to get to Lantau Island. (a / an)","answer":["an"],"why":"The h in hour is silent, so it starts with a vowel sound."},{"type":"fill","q":"My cousin studies at ___ university in London. (a / an)","answer":["a"],"why":"University starts with a 'you' sound, which is a consonant sound."},{"type":"fill","q":"Yesterday I found ___ wallet on the street. (a / the)","answer":["a"],"why":"It's the first time we hear about this wallet."},{"type":"fill","q":"___ sun is very hot today. (A / The)","answer":["The"],"why":"There is only one sun."},{"type":"fill","q":"Mia has a cat and a dog. ___ cat is called Mochi. (A / The)","answer":["The"],"why":"We already know which cat — Mia's cat."},{"type":"fill","q":"Can you pass me ___ salt, please? (a / the)","answer":["the"],"why":"Salt is uncountable, and we both know which salt — the one on the table."},{"type":"fill","q":"Isabelle is ___ best swimmer in our class. (a / the)","answer":["the"],"why":"There is only one best swimmer, so we use the."}]},{"name":"Challenge","items":[{"type":"order","words":["I","ate","an","egg","for","breakfast"],"end":".","alt":[["for","breakfast","I","ate","an","egg"]],"why":"An before egg (vowel sound). No article before meals like breakfast."},{"type":"order","words":["the","moon","is","very","bright","tonight"],"end":".","alt":[["tonight","the","moon","is","very","bright"]],"why":"There is only one moon, so we say the moon."},{"type":"rewrite","task":"Find and fix the mistake.","s":"I have a umbrella.","answer":["I have an umbrella."],"why":"Umbrella starts with a vowel sound, so we use an."},{"type":"rewrite","task":"Find and fix the mistake.","s":"My aunt is doctor.","answer":["My aunt is a doctor."],"why":"We need a/an before a job."},{"type":"order","words":["Leo","plays","basketball","after","lunch"],"end":".","alt":[["after","lunch","Leo","plays","basketball"]],"why":"No article before sports or meals."},{"type":"rewrite","task":"Find and fix the mistake.","s":"We play the football after school.","answer":["We play football after school."],"why":"We don't use the before sports."},{"type":"rewrite","task":"Find and fix the mistake in the second sentence.","s":"I saw a film yesterday. A film was very funny.","answer":["I saw a film yesterday. The film was very funny."],"why":"The second time we talk about the film, we use the."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"Emma ate a orange and an banana.","answer":["Emma ate an orange and a banana."],"why":"Orange starts with a vowel sound (an). Banana starts with a consonant sound (a)."}]}]},{"id":"pronouns","num":6,"title":"Subject & Object Pronouns","zh":"主格和宾格代词","bigIdea":"Pronouns are short words that take the place of nouns, so we don't have to repeat names again and again. **Subject pronouns** (I, you, he, she, it, we, they) do the action. **Object pronouns** (me, you, him, her, it, us, them) receive the action, or come after little words like with, to and for.","zhNote":"中文的“我”放在句首或句尾都一样，但英文要变：做主语用 I / he / she / we / they，做宾语用 me / him / her / us / them。另外，中文口语里“他/她”读音相同，英文一定要分清 he（男）和 she（女）。","rules":[{"rule":"Subject pronouns come before the verb. They tell us who does the action.","examples":["**I** like pizza.","**She** plays the piano.","**They** live in Sha Tin."]},{"rule":"Object pronouns come after the verb, or after words like with, to and for.","examples":["Mum loves **me**.","Can you help **him**?","Come with **us**!"]},{"rule":"You and it are the same in both places.","examples":["**You** are kind. I like **you**.","**It** is cute. I love **it**."]},{"rule":"Emma and I or Emma and me? Cover the other person and see which one sounds right. Be polite: put yourself last.","examples":["**Emma and I** went swimming. (I went swimming.)","Mr Chan helped **Emma and me**. (Mr Chan helped me.)","**Leo and I** (not I and Leo, not me and Leo)"]}],"tip":"**Cover up the other person!** If 'I' sounds right on its own, use I. If 'me' sounds right on its own, use me.","mistakes":[{"wrong":"Me and Leo went to the park.","right":"**Leo and I** went to the park."},{"wrong":"Grandma gave the book to I.","right":"Grandma gave the book to **me**."},{"wrong":"My sister is eight. He likes drawing.","right":"My sister is eight. **She** likes drawing."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"___ am in Grade 6.","options":["Me","I","My"],"answer":1,"why":"I is the subject — it does the action."},{"type":"mc","q":"This birthday card is for ___.","options":["her","she","I"],"answer":0,"why":"After 'for' we use an object pronoun: her."},{"type":"mc","q":"Leo is my friend. ___ is very funny.","options":["He","Him","She"],"answer":0,"why":"Leo is a boy and he is the subject, so we use he."},{"type":"mc","q":"Mia is kind. I like ___.","options":["she","he","her"],"answer":2,"why":"Mia comes after the verb 'like', so we use the object pronoun her."},{"type":"mc","q":"My grandparents live in Macau. We visit ___ every month.","options":["they","them","us"],"answer":1,"why":"After the verb 'visit' we use the object pronoun them."},{"type":"mc","q":"Sam and I are in the same class. ___ sit together.","options":["We","Us","They"],"answer":0,"why":"Sam and I = we. It is the subject, so we use we."},{"type":"mc","q":"Can you help ___ with my homework?","options":["I","we","me"],"answer":2,"why":"After the verb 'help' we use the object pronoun me."},{"type":"mc","q":"Ms Lee gave ___ some stickers.","options":["us","we","I"],"answer":0,"why":"After the verb 'gave' we use the object pronoun us."},{"type":"mc","q":"Which sentence is correct?","options":["Me and Emma went to the beach.","Emma and me went to the beach.","Emma and I went to the beach."],"answer":2,"why":"Cover 'Emma and': 'I went to the beach' sounds right."},{"type":"mc","q":"Which sentence is correct?","options":["Mr Chan took a photo of Emma and I.","Mr Chan took a photo of Emma and me.","Mr Chan took a photo of I and Emma."],"answer":1,"why":"Cover 'Emma and': 'a photo of me' sounds right."}]},{"name":"Practice","items":[{"type":"fill","q":"My brother is eight. ___ loves dinosaurs. (he / him)","answer":["He"],"why":"He is the subject, before the verb 'loves'."},{"type":"fill","q":"Isabelle is my best friend. I sit next to ___. (she / her)","answer":["her"],"why":"After 'next to' we use the object pronoun her."},{"type":"fill","q":"My bike is new. I ride ___ every weekend. (it / they)","answer":["it"],"why":"The bike is one thing, so we use it."},{"type":"fill","q":"Leo and Sam are twins. ___ are both in Grade 6. (they / them)","answer":["They"],"why":"Leo and Sam = they. It is the subject."},{"type":"fill","q":"The twins are funny. Everyone likes ___. (they / them)","answer":["them"],"why":"After the verb 'likes' we use the object pronoun them."},{"type":"fill","q":"Mum, can you take ___ to the library? (I / me)","answer":["me"],"why":"After the verb 'take' we use the object pronoun me."},{"type":"fill","q":"Ava and I love music. ___ play in the school band. (we / us)","answer":["We"],"why":"Ava and I = we, and it is the subject."},{"type":"fill","q":"Ms Lee is proud of ___ because we won the quiz. (we / us)","answer":["us"],"why":"After 'of' we use the object pronoun us."},{"type":"fill","q":"Mia and ___ are going to Ocean Park. (I / me)","answer":["I"],"why":"Cover 'Mia and': 'I am going' sounds right."},{"type":"fill","q":"Grandma made dumplings for Leo and ___. (I / me)","answer":["me"],"why":"Cover 'Leo and': 'for me' sounds right."}]},{"name":"Challenge","items":[{"type":"order","words":["she","plays","badminton","with","him"],"end":".","alt":[],"why":"She is the subject (before the verb). Him comes after 'with'."},{"type":"rewrite","task":"Replace 'Leo' with a pronoun.","s":"I played chess with Leo.","answer":["I played chess with him."],"why":"Leo is a boy and comes after 'with', so we use him."},{"type":"order","words":["can","you","come","with","us"],"end":"?","alt":[],"why":"After 'with' we use the object pronoun us."},{"type":"rewrite","task":"Replace 'Mia and Ava' with a pronoun.","s":"Mia and Ava are swimming.","answer":["They are swimming."],"why":"Two people as the subject = they."},{"type":"order","words":["Emma","and","I","love","dim","sum"],"end":".","alt":[],"why":"Emma and I is the subject. Put yourself last."},{"type":"order","words":["Mr","Chan","gave","them","a","big","smile"],"end":".","alt":[],"why":"Them comes after the verb 'gave', so we use the object pronoun."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Me and Sam went to the zoo.","answer":["Sam and I went to the zoo."],"why":"It's the subject, so use I — and put yourself last: Sam and I."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"Her gave I a birthday card.","answer":["She gave me a birthday card."],"why":"Subject = she (before the verb). Object = me (after the verb)."}]}]},{"id":"possessives","num":7,"title":"Possessives: my, mine and 's","zh":"所有格","bigIdea":"Possessives tell us who something belongs to. Words like **my**, **your** and **her** come before a noun (my bag). Words like **mine**, **yours** and **hers** stand alone (The bag is mine). With names and other nouns we add **'s**: Emma's piano.","zhNote":"中文都用“的”：我的书、这本书是我的。英文要分开：my book（后面有名词），mine（后面没有名词）。名字后面加 's 就像中文的“的”：Emma's book = Emma 的书。","rules":[{"rule":"Possessive adjectives come before a noun: my, your, his, her, its, our, their.","examples":["**my** bag, **our** classroom","Leo loves **his** dog.","The cat licked **its** paw."]},{"rule":"Possessive pronouns stand alone, with no noun after them: mine, yours, his, hers, ours, theirs.","examples":["This bag is **mine**.","Is this pencil **yours**?","The red house is **theirs**."]},{"rule":"Add 's to show who owns something. If a plural noun already ends in -s, just add an apostrophe (s').","examples":["Emma**'s** piano, the dog**'s** bone","the girl**'s** room (one girl) → the girls**'** room (two or more girls)","the children**'s** toys (children has no -s, so add 's)"]},{"rule":"Its = belongs to it. It's = it is. They are different!","examples":["The bird hurt **its** wing.","**It's** raining. (It is raining.)"]},{"rule":"Use whose to ask who something belongs to.","examples":["**Whose** bag is this? — It's Mia's.","**Whose** jacket is on the chair?"]}],"tip":"**its or it's?** Try saying 'it is'. If it works, write it's. If not, write its — no apostrophe, just like his and hers!","mistakes":[{"wrong":"This is Emma book.","right":"This is **Emma's** book."},{"wrong":"The dog wagged it's tail.","right":"The dog wagged **its** tail."},{"wrong":"This pen is my.","right":"This pen is **mine**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"This is ___ bag.","options":["me","my","mine"],"answer":1,"why":"A noun (bag) comes next, so we use my."},{"type":"mc","q":"That bag is ___.","options":["mine","my","me"],"answer":0,"why":"No noun after it, so we use mine."},{"type":"mc","q":"Leo is washing ___ bike.","options":["he","him","his"],"answer":2,"why":"The bike belongs to Leo, so we use his."},{"type":"mc","q":"Is this pencil ___?","options":["your","yours","you"],"answer":1,"why":"No noun after it, so we use yours."},{"type":"mc","q":"The cat is playing with ___ toy.","options":["it's","its","it"],"answer":1,"why":"The toy belongs to the cat, so its (no apostrophe)."},{"type":"mc","q":"___ raining again!","options":["It's","Its","It"],"answer":0,"why":"It's = it is. 'It is raining again!'"},{"type":"mc","q":"This is ___ piano.","options":["Emma","Emmas","Emma's"],"answer":2,"why":"Add 's to a name to show it belongs to her."},{"type":"mc","q":"All the ___ bags are on the bus. (many students)","options":["students'","student's","students"],"answer":0,"why":"Many students, and the word already ends in -s, so just add '."},{"type":"mc","q":"___ jacket is this?","options":["Who","Whose","Who's"],"answer":1,"why":"Whose asks who something belongs to."},{"type":"mc","q":"Which sentence is correct?","options":["The red bike is her's.","The red bike is her.","The red bike is hers."],"answer":2,"why":"Hers stands alone and never has an apostrophe."}]},{"name":"Practice","items":[{"type":"fill","q":"I love ___ new shoes. (I)","answer":["my"],"why":"A noun (shoes) comes next, so we use my.","exact":true},{"type":"fill","q":"We clean ___ classroom every Friday. (we)","answer":["our"],"why":"The classroom belongs to us, so we use our.","exact":true},{"type":"fill","q":"Mia and Ava live with ___ grandma. (they)","answer":["their"],"why":"The grandma belongs to them, so we use their.","exact":true},{"type":"fill","q":"This umbrella isn't mine. It's ___. (she)","answer":["hers"],"why":"No noun after it, so we use hers.","exact":true},{"type":"fill","q":"That flat is ___. We live there. (we)","answer":["ours"],"why":"No noun after it, so we use ours.","exact":true},{"type":"fill","q":"This is ___ cat. Isabelle loves her very much. (Isabelle)","answer":["Isabelle's","Isabelle’s"],"why":"Add 's to a name to show who owns something.","exact":true},{"type":"fill","q":"The ___ toys are all over the floor. (children)","answer":["children's","children’s"],"why":"Children doesn't end in -s, so we add 's.","exact":true},{"type":"fill","q":"Three girls sleep in that room. It is the ___ room. (girls)","answer":["girls'","girls’"],"why":"Girls already ends in -s, so we just add '.","exact":true},{"type":"fill","q":"The dog is wagging ___ tail. (it)","answer":["its"],"why":"The tail belongs to the dog, so its — no apostrophe.","exact":true},{"type":"fill","q":"___ book is this? — It's Leo's. (who / whose)","answer":["Whose"],"why":"Whose asks who something belongs to.","exact":true}]},{"name":"Challenge","items":[{"type":"order","words":["this","is","my","sister's","piano"],"end":".","alt":[],"why":"My comes before the noun, and sister's shows the piano is hers."},{"type":"order","words":["whose","jacket","is","this"],"end":"?","alt":[],"why":"Whose + noun asks who owns it."},{"type":"rewrite","task":"Find and fix the mistake.","s":"This is Leo book.","answer":["This is Leo's book."],"why":"Add 's to a name to show who owns something.","strict":true},{"type":"rewrite","task":"Find and fix the mistake.","s":"The bird hurt it's wing.","answer":["The bird hurt its wing."],"why":"It's means 'it is'. For 'belongs to it' we write its.","strict":true},{"type":"order","words":["the","blue","lunch","box","is","hers"],"end":".","alt":[],"why":"Hers stands alone at the end, with no noun after it."},{"type":"rewrite","task":"Rewrite the sentence using 'mine'.","s":"This is my seat.","answer":["This seat is mine."],"why":"Mine stands alone, so the noun moves before it: This seat is mine."},{"type":"rewrite","task":"Rewrite the sentence using 's.","s":"This is the bone of the dog.","answer":["This is the dog's bone."],"why":"The dog's bone is the short, natural way to say it.","strict":true},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"Is this you're bag or her's?","answer":["Is this your bag or hers?"],"why":"Your (not you're = you are) goes before a noun. Hers never has an apostrophe.","strict":true}]}]},{"id":"demonstratives","num":8,"title":"This, That, These, Those","zh":"指示代词","bigIdea":"We use **this**, **that**, **these** and **those** to point at things. **This** and **these** are for things near you (here). **That** and **those** are for things far away (there). **This** and **that** are for one thing; **these** and **those** are for more than one.","zhNote":"中文说“这/那”，后面的名词不变；英文要看单复数：this book → these books，that cat → those cats。","rules":[{"rule":"This = one thing, near (here).","examples":["**This** book in my hand is new.","**This** is my friend Mia."]},{"rule":"That = one thing, far (there).","examples":["Look at **that** bird in the sky!","**That** is Victoria Peak over there."]},{"rule":"These = more than one, near (here).","examples":["**These** cookies on my plate are yummy.","**These** are my new shoes."]},{"rule":"Those = more than one, far (there).","examples":["**Those** boats are far away.","Who are **those** girls over there?"]},{"rule":"Make the noun match: this/that + one thing, these/those + plural.","examples":["this cat → **these cats**","that box → **those boxes**","this child → **these children**"]}],"tip":"**This** and **these** are **here**. **That** and **those** are over **there**.","mistakes":[{"wrong":"This books are new.","right":"**These** books are new."},{"wrong":"Those is my bag over there.","right":"**That** is my bag over there."},{"wrong":"I like these shoe.","right":"I like these **shoes**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"___ apple in my hand is red.","options":["This","These","Those"],"answer":0,"why":"One apple, near me (in my hand) = this."},{"type":"mc","q":"Look at ___ birds over there!","options":["this","these","those"],"answer":2,"why":"Many birds, far away (over there) = those."},{"type":"mc","q":"___ cookies on my plate are yummy.","options":["This","These","That"],"answer":1,"why":"Many cookies, near me (on my plate) = these."},{"type":"mc","q":"Can you see ___ boat far away on the sea?","options":["this","that","these"],"answer":1,"why":"One boat, far away = that."},{"type":"mc","q":"___ is my friend Ava. (She is standing next to me.)","options":["This","These","Those"],"answer":0,"why":"One person, near me = this."},{"type":"mc","q":"___ are my new shoes. (I'm wearing them.)","options":["This","These","That"],"answer":1,"why":"Shoes are plural and near (on my feet) = these."},{"type":"mc","q":"Who is ___ man over there?","options":["this","those","that"],"answer":2,"why":"One man, far away (over there) = that."},{"type":"mc","q":"___ mountains far away are beautiful.","options":["These","That","Those"],"answer":2,"why":"Many mountains, far away = those."},{"type":"mc","q":"Which is correct?","options":["this books","these books","these book"],"answer":1,"why":"These goes with a plural noun: these books."},{"type":"mc","q":"Which sentence is correct?","options":["Those children over there are my cousins.","That children over there are my cousins.","These children over there are my cousins."],"answer":0,"why":"Children is plural and they are far away (over there) = those."}]},{"name":"Practice","items":[{"type":"fill","q":"___ pencil here is broken. (this / these)","answer":["This"],"why":"One pencil, near (here) = this."},{"type":"fill","q":"___ pencils here are broken. (this / these)","answer":["These"],"why":"Many pencils, near (here) = these."},{"type":"fill","q":"___ house over there is very old. (that / those)","answer":["That"],"why":"One house, far (over there) = that."},{"type":"fill","q":"___ houses over there are very old. (that / those)","answer":["Those"],"why":"Many houses, far (over there) = those."},{"type":"fill","q":"I really like ___ dumplings on my plate. (this / these)","answer":["these"],"why":"Many dumplings, near me = these."},{"type":"fill","q":"Can you pass me ___ book on the shelf over there? (that / those)","answer":["that"],"why":"One book, far away = that."},{"type":"fill","q":"___ children over there are from my school. (that / those)","answer":["Those"],"why":"Children is plural and far away = those."},{"type":"fill","q":"Hi Grandma! ___ is my friend Leo. (this / these)","answer":["This"],"why":"We use this to introduce one person who is with us."},{"type":"fill","q":"These ___ are very heavy. (box)","answer":["boxes"],"why":"These needs a plural noun: box → boxes."},{"type":"fill","q":"Those ___ are very tall. (man)","answer":["men"],"why":"Those needs a plural noun: man → men."}]},{"name":"Challenge","items":[{"type":"order","words":["these","are","my","new","shoes"],"end":".","alt":[],"why":"Shoes are plural and near me, so we use these."},{"type":"order","words":["is","that","your","bike","over","there"],"end":"?","alt":[],"why":"One bike, far away = that."},{"type":"rewrite","task":"Make it plural.","s":"This cat is sleepy.","answer":["These cats are sleepy."],"why":"This → these, cat → cats, is → are."},{"type":"rewrite","task":"Make it plural.","s":"That box is heavy.","answer":["Those boxes are heavy."],"why":"That → those, box → boxes, is → are."},{"type":"order","words":["those","boats","are","sailing","to","Lamma","Island"],"end":".","alt":[],"why":"Many boats, far away = those."},{"type":"rewrite","task":"Make it singular (only one).","s":"These children are happy.","answer":["This child is happy."],"why":"These → this, children → child, are → is."},{"type":"rewrite","task":"Find and fix the mistake.","s":"Those is my school over there.","answer":["That is my school over there."],"why":"One school, far away = that."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"These book on the table over there are Mia's.","answer":["Those books on the table over there are Mia's."],"why":"Far away (over there) = those, and those needs a plural noun: books."}]}]},{"id":"be","num":9,"title":"The Verb To Be: am, is, are","zh":"be动词 am/is/are","bigIdea":"**Am**, **is** and **are** are forms of the verb 'to be'. We use them to say who someone is, what something is like, or where something is. **I** goes with **am**; **he, she, it** (and one person or thing) go with **is**; **you, we, they** (and more than one) go with **are**.","zhNote":"中文的“是”只有一个形式，但英文要跟主语搭配：I am, she is, they are。另外，形容词前面也需要 be 动词：I am happy（不能说 I happy）。","rules":[{"rule":"I → am. He, she, it (or one person or thing) → is. You, we, they (or more than one) → are.","examples":["**I am** eleven.","**She is** my teacher. **Leo is** tall.","**We are** friends. **Leo and Sam are** tall."]},{"rule":"We often use short forms (contractions) when we speak.","examples":["I am → **I'm**, you are → **you're**","he is → **he's**, it is → **it's**","we are → **we're**, they are → **they're**"]},{"rule":"To make it negative, add not. There is no short form 'amn't' — say I'm not.","examples":["I am not → **I'm not**","is not → **isn't**: She **isn't** hungry.","are not → **aren't**: They **aren't** late."]},{"rule":"To make a question, move am, is or are to the front.","examples":["She is tired. → **Is she** tired?","You are ready. → **Are you** ready?","**Am I** late?"]},{"rule":"Short answers: Yes, + pronoun + am/is/are. Never use a short form in a 'yes' short answer!","examples":["Is he your brother? — Yes, **he is**. / No, **he isn't**.","Are you hungry? — Yes, **I am**. / No, **I'm not**."]}],"tip":"**I am Emma, you are Leo, she is Mia!** One person → is. Two or more → are. And I always gets its own word: am.","mistakes":[{"wrong":"I happy today.","right":"I **am** happy today."},{"wrong":"My friends is kind.","right":"My friends **are** kind."},{"wrong":"Are you ready? — Yes, I'm.","right":"Are you ready? — Yes, **I am**."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I ___ in Grade 6.","options":["is","am","are"],"answer":1,"why":"I always goes with am."},{"type":"mc","q":"She ___ my best friend.","options":["is","are","am"],"answer":0,"why":"She goes with is."},{"type":"mc","q":"They ___ at the swimming pool.","options":["is","am","are"],"answer":2,"why":"They goes with are."},{"type":"mc","q":"My dog ___ very cute.","options":["are","is","am"],"answer":1,"why":"My dog = it (one thing), so is."},{"type":"mc","q":"Leo and Sam ___ brothers.","options":["are","is","am"],"answer":0,"why":"Leo and Sam = they (two people), so are."},{"type":"mc","q":"It ___ cold today. It's warm and sunny!","options":["aren't","isn't","not"],"answer":1,"why":"It goes with is, so the negative is isn't."},{"type":"mc","q":"We ___ late for school. We're early!","options":["isn't","not","aren't"],"answer":2,"why":"We goes with are, so the negative is aren't."},{"type":"mc","q":"___ you ready for the test?","options":["Is","Am","Are"],"answer":2,"why":"You goes with are. In questions, are comes first."},{"type":"mc","q":"Is Mia at home? — Yes, ___.","options":["she is","she's","she are"],"answer":0,"why":"In a 'yes' short answer we don't use a short form."},{"type":"mc","q":"Which sentence is correct?","options":["I amn't hungry.","I'm not hungry.","I not hungry."],"answer":1,"why":"There is no 'amn't'. We say I'm not."}]},{"name":"Practice","items":[{"type":"fill","q":"I ___ eleven years old. (be)","answer":["am"],"why":"I always goes with am.","exact":true},{"type":"fill","q":"The MTR trains ___ very clean. (be)","answer":["are"],"why":"Trains are more than one, so are.","exact":true},{"type":"fill","q":"Emma and I ___ in the school choir. (be)","answer":["are"],"why":"Emma and I = we, so are.","exact":true},{"type":"fill","q":"My brother ___ at home. He's at school. (not)","answer":["isn't","is not","isn’t"],"why":"My brother = he, so is not / isn't.","exact":true},{"type":"fill","q":"The cookies ___ ready yet. (not)","answer":["aren't","are not","aren’t"],"why":"Cookies are more than one, so are not / aren't.","exact":true},{"type":"fill","q":"I ___ tired. I feel great! (not)","answer":["am not"],"why":"I goes with am, so the negative is am not.","exact":true},{"type":"fill","q":"___ your sister in Grade 4? (be)","answer":["Is"],"why":"Your sister = she, so is comes first in the question.","exact":true},{"type":"fill","q":"___ they from Hong Kong? (be)","answer":["Are"],"why":"They goes with are, so are comes first in the question.","exact":true},{"type":"fill","q":"Is it raining? — Yes, ___.","answer":["it is"],"why":"Short answer: Yes, it is. No short form in a 'yes' answer.","exact":true},{"type":"fill","q":"Are you hungry? — No, ___.","answer":["I'm not","I am not","I’m not"],"why":"Short answer: No, I'm not.","exact":true}]},{"name":"Challenge","items":[{"type":"order","words":["my","grandma","is","very","kind"],"end":".","alt":[],"why":"My grandma = she, so is."},{"type":"rewrite","task":"Make it negative.","s":"Leo is hungry.","answer":["Leo isn't hungry.","Leo is not hungry."],"why":"Add not after is: is not / isn't."},{"type":"order","words":["we","are","not","late","for","school"],"end":".","alt":[],"why":"We goes with are. Not comes after are."},{"type":"rewrite","task":"Make it a question.","s":"They are at the beach.","answer":["Are they at the beach?"],"why":"Move are to the front to make a question."},{"type":"rewrite","task":"Make it negative.","s":"I am scared of dogs.","answer":["I'm not scared of dogs.","I am not scared of dogs."],"why":"Add not after am: I am not / I'm not."},{"type":"order","words":["are","you","in","Ms","Lee's","class"],"end":"?","alt":[],"why":"In questions, are comes before you."},{"type":"rewrite","task":"Make it a question.","s":"Your brother is ten.","answer":["Is your brother ten?"],"why":"Move is to the front to make a question."},{"type":"rewrite","task":"Find and fix the TWO mistakes.","s":"Mia's parents is doctors and they is very busy.","answer":["Mia's parents are doctors and they are very busy."],"why":"Parents and they are more than one, so we use are."}]}]},{"id":"there-is","num":10,"title":"There Is & There Are","zh":"There is / There are","bigIdea":"We use **there is** and **there are** to say that something is in a place. Use **there is** for one thing, or for 'stuff' you can't count, like water. Use **there are** for two or more things.","zhNote":"There is / There are 相当于中文的'某处有某物'，表示存在，不是'拥有'，所以不能说 There have。一个或不可数的东西用 is，两个或以上用 are。","rules":[{"rule":"There is + one thing (a / an + singular noun).","examples":["**There is** a cat on the sofa.","**There is** an apple in my bag."]},{"rule":"There is + uncountable nouns (water, milk, rice, money).","examples":["**There is** some milk in the fridge.","**There is** a lot of rice in the pot."]},{"rule":"There are + plural nouns (two or more).","examples":["**There are** three pens on the desk.","**There are** many people on the MTR."]},{"rule":"Negatives: there isn't / there aren't. Use 'any' with plurals and uncountable nouns.","examples":["**There isn't** a park near my flat.","**There aren't any** clouds today.","**There isn't any** juice left."]},{"rule":"Questions: Is there…? Are there…? How many … are there?","examples":["**Is there** a pool at your school? – Yes, there is.","**Are there** any cookies? – No, there aren't.","**How many** students **are there** in your class?"]}],"tip":"Look at the noun right after it: one thing or uncountable 'stuff' → **there is**; two or more → **there are**. And never say 'there have'!","mistakes":[{"wrong":"There have a cat in my house.","right":"There is a cat in my house."},{"wrong":"There is two dogs in the park.","right":"There are two dogs in the park."},{"wrong":"There aren't some apples.","right":"There aren't any apples."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"___ a dog in the garden.","options":["There is","There are","There have"],"answer":0,"why":"One dog, so we use 'there is'."},{"type":"mc","q":"There ___ five books on my desk.","options":["is","are","has"],"answer":1,"why":"Five books = more than one, so 'are'."},{"type":"mc","q":"There ___ an orange in the fridge.","options":["are","has","is"],"answer":2,"why":"One orange, so 'is'."},{"type":"mc","q":"There ___ some water in the bottle.","options":["is","are","have"],"answer":0,"why":"Water is uncountable, so we use 'is'."},{"type":"mc","q":"There ___ many people at Victoria Peak today.","options":["is","are","be"],"answer":1,"why":"People is plural, so 'are'."},{"type":"mc","q":"There ___ any milk left.","options":["isn't","aren't","don't"],"answer":0,"why":"Milk is uncountable, so 'isn't'."},{"type":"mc","q":"There ___ any sharks in the swimming pool!","options":["isn't","doesn't","aren't"],"answer":2,"why":"Sharks is plural, so 'aren't'."},{"type":"mc","q":"___ a library at your school?","options":["Are there","Is there","There is"],"answer":1,"why":"One library, and questions start with 'Is there'."},{"type":"mc","q":"How many students ___ in your class?","options":["is there","are there","there are"],"answer":1,"why":"'How many' asks about plurals, so 'are there'."},{"type":"mc","q":"Which sentence is correct?","options":["There is three cats on the roof.","There are a cat on the roof.","There are three cats on the roof."],"answer":2,"why":"Three cats = plural, so 'there are'."}]},{"name":"Practice","items":[{"type":"fill","q":"There ___ a pencil case on the desk. (is / are)","answer":["is"],"why":"One pencil case, so 'is'."},{"type":"fill","q":"There ___ two cats under the bed. (is / are)","answer":["are"],"why":"Two cats = plural, so 'are'."},{"type":"fill","q":"There ___ some rice in the bowl. (is / are)","answer":["is"],"why":"Rice is uncountable, so 'is'."},{"type":"fill","q":"There ___ lots of shops in Mong Kok. (is / are)","answer":["are"],"why":"Shops is plural, so 'are'."},{"type":"fill","q":"There ___ a swimming pool near my flat. (is – negative)","answer":["isn't","is not"],"why":"One pool, negative, so 'isn't'."},{"type":"fill","q":"There ___ any bananas in the kitchen. (are – negative)","answer":["aren't","are not"],"why":"Bananas is plural, negative, so 'aren't'."},{"type":"fill","q":"___ a bus stop near the school? (be + there)","answer":["Is there"],"why":"One bus stop, so the question starts 'Is there'."},{"type":"fill","q":"___ any eggs in the fridge? (be + there)","answer":["Are there"],"why":"Eggs is plural, so 'Are there'."},{"type":"fill","q":"Are there any dumplings left? – No, there ___.","answer":["aren't","are not"],"why":"Short answers repeat 'are': No, there aren't."},{"type":"fill","q":"How many planets ___ in our solar system? (be + there)","answer":["are there"],"why":"'How many' + plural noun, then 'are there'."}]},{"name":"Challenge","items":[{"type":"order","words":["there","is","a","cat","on","my","bed"],"end":".","alt":[["on","my","bed","there","is","a","cat"]],"why":"One cat, so 'there is' + a cat."},{"type":"rewrite","task":"Find and fix the mistake.","s":"There is three dogs in the park.","answer":["There are three dogs in the park."],"why":"Three dogs = plural, so 'there are'."},{"type":"order","words":["are","there","any","cookies","in","the","jar"],"end":"?","alt":[],"why":"Questions swap the order: Are there…?"},{"type":"rewrite","task":"Make it negative.","s":"There are some fish in the pond.","answer":["There aren't any fish in the pond.","There are not any fish in the pond.","There are no fish in the pond."],"why":"In negatives, 'some' changes to 'any'."},{"type":"order","words":["how","many","students","are","there","in","your","class"],"end":"?","alt":[],"why":"How many + plural noun + are there…?"},{"type":"rewrite","task":"Make it a question.","s":"There is some juice in the fridge.","answer":["Is there any juice in the fridge?","Is there some juice in the fridge?"],"why":"Move 'is' to the front; we usually use 'any' in questions."},{"type":"order","words":["there","aren't","any","clouds","in","the","sky"],"end":".","alt":[["in","the","sky","there","aren't","any","clouds"]],"why":"Clouds is plural, so 'there aren't any'."},{"type":"rewrite","task":"Find and fix the mistake.","s":"There have a big park near my school.","answer":["There is a big park near my school.","There's a big park near my school."],"why":"To say something is in a place, use 'there is', not 'there have'."}]}]},{"id":"have-has","num":11,"title":"Have & Has","zh":"have 和 has","bigIdea":"We use **have** and **has** to say what someone owns, or what is part of them, like long hair or blue eyes. Use **has** with he, she, it and one person or thing. Use **have** with I, you, we and they.","zhNote":"have/has 表示'拥有'。中文的'有'不变形，但英语里 he/she/it 或一个人、一样东西要用 has。否定和疑问要借助 do/does，does 后面要用回原形 have。","rules":[{"rule":"I / you / we / they + have.","examples":["I **have** a little brother.","We **have** a new teacher.","They **have** two cats."]},{"rule":"He / she / it (or one person or thing) + has.","examples":["Emma **has** long hair.","My dog **has** a red collar.","It **has** four legs."]},{"rule":"Negatives: don't have / doesn't have. After doesn't, use have (not has).","examples":["I **don't have** a pet.","Leo **doesn't have** a bike.","She doesn't has → She **doesn't have**"]},{"rule":"Questions: Do … have…? / Does … have…?","examples":["**Do** you **have** a ruler? – Yes, I do.","**Does** Mia **have** a sister? – No, she doesn't."]},{"rule":"Have got / has got means the same (common in British English). Negative: haven't got / hasn't got. Question: Have you got…? / Has she got…?","examples":["I**'ve got** a new phone. = I have a new phone.","Sam **hasn't got** a scooter.","**Has** she **got** a pet? – Yes, she has."]}],"tip":"He, she, it — **has** is it! Everyone else — **have**. And remember: **does + have**, never does + has.","mistakes":[{"wrong":"She have a new bag.","right":"She **has** a new bag."},{"wrong":"Does he has a brother?","right":"Does he **have** a brother?"},{"wrong":"I don't have got a pen.","right":"I **haven't got** a pen. / I **don't have** a pen."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"I ___ a little sister.","options":["has","have","haves"],"answer":1,"why":"With 'I' we use 'have'."},{"type":"mc","q":"Emma ___ a blue schoolbag.","options":["has","have","is"],"answer":0,"why":"Emma = she, so 'has'."},{"type":"mc","q":"They ___ a big garden.","options":["has","is","have"],"answer":2,"why":"With 'they' we use 'have'."},{"type":"mc","q":"My cat ___ green eyes.","options":["have","has","are"],"answer":1,"why":"My cat = it, so 'has'."},{"type":"mc","q":"We ___ got a new classroom.","options":["have","has","are"],"answer":0,"why":"With 'we' we use 'have got'."},{"type":"mc","q":"Leo ___ got a cold today.","options":["have","has","is"],"answer":1,"why":"Leo = he, so 'has got'."},{"type":"mc","q":"I ___ have a pet.","options":["doesn't","don't","not"],"answer":1,"why":"With 'I' the negative is 'don't have'."},{"type":"mc","q":"Mia ___ have a phone.","options":["don't","isn't","doesn't"],"answer":2,"why":"Mia = she, so 'doesn't have'."},{"type":"mc","q":"Does your brother ___ a bike?","options":["has","have","having"],"answer":1,"why":"After 'does' we always use 'have'."},{"type":"mc","q":"___ you got a pencil?","options":["Do","Has","Have"],"answer":2,"why":"With 'got', questions start with Have/Has; 'you' takes 'Have'."}]},{"name":"Practice","items":[{"type":"fill","q":"My best friend ___ a dog called Max. (have)","answer":["has","has got"],"why":"My best friend = one person, so 'has'."},{"type":"fill","q":"We ___ PE on Mondays. (have)","answer":["have","have got"],"why":"With 'we' we use 'have'."},{"type":"fill","q":"Ms Lee ___ a red car. (have)","answer":["has","has got"],"why":"Ms Lee = she, so 'has'."},{"type":"fill","q":"The flat ___ three bedrooms. (have)","answer":["has","has got"],"why":"The flat = it, so 'has'."},{"type":"fill","q":"I ___ a skateboard. (not have)","answer":["don't have","do not have","haven't got","have not got"],"why":"With 'I': don't have (or haven't got)."},{"type":"fill","q":"Sam ___ any brother
