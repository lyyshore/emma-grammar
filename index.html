e exact words. The comma, full stop or question mark goes INSIDE the speech marks.","examples":["Emma said**,** \"Let's go**.**\"","\"Let's go**,**\" said Emma.","\"Are you ready**?**\" asked Leo."]}],"tip":"Its or it's? Say 'it is' instead. If it still makes sense, write **it's**. If not, write **its**.","mistakes":[{"wrong":"The dog wagged it's tail.","right":"The dog wagged **its** tail."},{"wrong":"I bought apple's and banana's.","right":"I bought **apples** and **bananas**. (plurals don't need an apostrophe)"},{"wrong":"Emma said \"Let's go\".","right":"Emma said**,** \"Let's go**.**\""}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Which sentence uses commas correctly?","options":["I like, apples bananas and grapes.","I like apples, bananas and grapes.","I like apples bananas, and, grapes."],"answer":1,"why":"Commas go between the items in a list."},{"type":"mc","q":"Which sentence is correct?","options":["After lunch, we played football.","After lunch we, played football.","After, lunch we played football."],"answer":0,"why":"Put a comma after the opening words 'After lunch'."},{"type":"mc","q":"Which sentence is correct?","options":["Come here Leo!","Come, here Leo!","Come here, Leo!"],"answer":2,"why":"Use a comma before the name of the person you are talking to."},{"type":"mc","q":"I ___ like spiders. (do not)","options":["dont","don't","do'nt"],"answer":1,"why":"The apostrophe goes where the letter o is missing: don't."},{"type":"mc","q":"___ raining again!","options":["Its","Its'","It's"],"answer":2,"why":"It is raining → It's raining."},{"type":"mc","q":"The cat licked ___ paw.","options":["its","it's","its'"],"answer":0,"why":"The paw belongs to the cat, so use its (no apostrophe)."},{"type":"mc","q":"This is ___ bag. (The bag belongs to Emma.)","options":["Emmas","Emmas'","Emma's"],"answer":2,"why":"One owner: add 's."},{"type":"mc","q":"The ___ bowls are empty. (There are three dogs.)","options":["dog's","dogs'","dogs"],"answer":1,"why":"Many dogs ending in s: just add an apostrophe after the s."},{"type":"mc","q":"Which sentence is punctuated correctly?","options":["Emma said \"Let's go\".","Emma said, Let's go.","Emma said, \"Let's go.\""],"answer":2,"why":"Comma before the speech marks, full stop inside them."},{"type":"mc","q":"Which sentence is punctuated correctly?","options":["\"Are you ready?\" asked Leo.","\"Are you ready\"? asked Leo.","\"Are you ready.\" asked Leo?"],"answer":0,"why":"The question mark goes inside the speech marks."}]},{"name":"Practice","items":[{"type":"fill","q":"___ a sunny day today. (it is → short form)","answer":["It's","it's"],"why":"It is → It's. The apostrophe replaces the i.","exact":true},{"type":"fill","q":"I ___ find my pencil case. (cannot → short form)","answer":["can't"],"why":"Cannot → can't.","exact":true},{"type":"fill","q":"The bird built ___ nest in the tree. (its / it's)","answer":["its"],"why":"The nest belongs to the bird: its, no apostrophe.","exact":true},{"type":"fill","q":"I think ___ going to rain. (its / it's)","answer":["it's"],"why":"It is going to rain → it's.","exact":true},{"type":"fill","q":"This is ___ piano. (Mia)","answer":["Mia's"],"why":"One owner: add 's.","exact":true},{"type":"fill","q":"The ___ tail is very long. (one cat)","answer":["cat's"],"why":"One cat owns the tail: cat's.","exact":true},{"type":"fill","q":"___ umbrella is red. (Ms Lee)","answer":["Ms Lee's"],"why":"One owner: add 's to the end of the name.","exact":true},{"type":"fill","q":"The ___ lunch boxes are on the shelf. (many students)","answer":["students'"],"why":"Plural owners ending in s: just add '.","exact":true},{"type":"fill","q":"The ___ playground is new. (children)","answer":["children's"],"why":"Children has no s at the end, so add 's.","exact":true},{"type":"fill","q":"The ___ shirts are in the changing room. (many boys)","answer":["boys'"],"why":"Many boys, ending in s: add ' after the s.","exact":true}]},{"name":"Challenge","items":[{"type":"order","words":["the","dog","wagged","its","tail"],"end":".","alt":[],"why":"The tail belongs to the dog: its (no apostrophe)."},{"type":"order","words":["it's","Mia's","turn","to","play"],"end":".","alt":[],"why":"It's = it is; Mia's = belonging to Mia."},{"type":"order","words":["where","are","the","girls'","bags"],"end":"?","alt":[],"why":"Many girls own the bags: girls'."},{"type":"rewrite","strict":true,"task":"Add the missing comma.","s":"After school we went swimming.","answer":["After school, we went swimming."],"why":"Put a comma after the opening words 'After school'."},{"type":"rewrite","strict":true,"task":"Add the missing commas.","s":"We bought eggs milk bread and cheese.","answer":["We bought eggs, milk, bread and cheese.","We bought eggs, milk, bread, and cheese."],"why":"Commas separate the items in a list."},{"type":"rewrite","strict":true,"task":"Add the two missing apostrophes.","s":"Its Emmas birthday today.","answer":["It's Emma's birthday today."],"why":"It's = it is; Emma's = belonging to Emma."},{"type":"rewrite","strict":true,"task":"Add speech marks, a comma and a full stop.","s":"Leo said Let's play football","answer":["Leo said, \"Let's play football.\""],"why":"Comma after said, then the words inside speech marks with the full stop inside."},{"type":"rewrite","strict":true,"task":"Add speech marks, a question mark and a full stop.","s":"Can I come too asked Ava","answer":["\"Can I come too?\" asked Ava.","\"Can I come, too?\" asked Ava."],"why":"The question mark goes inside the speech marks; the full stop ends the sentence."}]}]},{"id":"fragments-runons","num":37,"title":"Fragments & Run-on Sentences","zh":"句子片段和连写句","bigIdea":"A full sentence needs a **subject** (who or what) and a **verb** (the action), and it must make sense on its own. A **fragment** is a broken piece of a sentence that is missing something. A **run-on** is two sentences squashed together with nothing between them, or with only a comma.","zhNote":"中文常用逗号把好几个句子连在一起（“一逗到底”），但英语不行！两个完整的句子要用句号分开，或者用逗号 + and/but/so，或用 because/when 连接。只用逗号连接两个句子是错误的。","rules":[{"rule":"A full sentence = subject + verb + a complete idea.","examples":["Emma **plays** the piano. ✓","Plays the piano every day. ✗ (Who plays?)","My best friend Mia. ✗ (What does she do?)"]},{"rule":"A fragment is missing a subject or a verb, or it is only a 'because/when' part. Fix it by adding what is missing or joining it to a full sentence.","examples":["Because I was tired. ✗ → I went to bed early **because I was tired**. ✓","The big red bus. ✗ → The big red bus **stopped**. ✓","When the bell rings. ✗ → We go home **when the bell rings**. ✓"]},{"rule":"A run-on joins two sentences with nothing. A comma splice joins them with only a comma. Both are wrong.","examples":["I like cats they are cute. ✗","It was raining, we stayed inside. ✗ (comma splice)"]},{"rule":"Fix it with a full stop, or with a comma + and / but / so.","examples":["It was raining**.** We stayed inside.","It was raining**, so** we stayed inside.","I like cats**, but** my brother likes dogs."]},{"rule":"Or fix it with because or when. If the because/when part comes first, put a comma after it.","examples":["We stayed inside **because** it was raining.","**When** the bell rang, we ran outside."]}],"tip":"Read it alone. Does it make sense by itself? If not, it's a **fragment**. Two complete ideas? Give them a **full stop** or a **joining word** – a comma alone is not enough!","mistakes":[{"wrong":"Because I was hungry.","right":"I ate a sandwich **because I was hungry**."},{"wrong":"I love Hong Kong, it is very exciting.","right":"I love Hong Kong**.** It is very exciting."},{"wrong":"Went to the park after school.","right":"**We** went to the park after school."}],"levels":[{"name":"Warm-up","items":[{"type":"mc","q":"Which is a complete sentence?","options":["Plays the piano every day.","Emma plays the piano every day.","The piano every day."],"answer":1,"why":"It has a subject (Emma) and a verb (plays)."},{"type":"mc","q":"Which is a complete sentence?","options":["The big red bus.","Under the table.","The cat is under the table."],"answer":2,"why":"It has a subject (the cat) and a verb (is)."},{"type":"mc","q":"What is missing in \"Went to the beach on Sunday.\"?","options":["a subject (who?)","a verb (the action)","nothing – it is correct"],"answer":0,"why":"We don't know who went. Add a subject: We went…"},{"type":"mc","q":"What is missing in \"My best friend Mia.\"?","options":["a subject (who?)","a verb (the action)","nothing – it is correct"],"answer":1,"why":"There is no action. Add a verb: My best friend Mia sings."},{"type":"mc","q":"Which is a fragment?","options":["Because I was tired.","I was tired.","I went to bed because I was tired."],"answer":0,"why":"A 'because' part can't stand alone. It needs a main sentence."},{"type":"mc","q":"Which is a fragment?","options":["The bell rings at three.","We go home when the bell rings.","When the bell rings."],"answer":2,"why":"A 'when' part alone is not a full idea – what happens?"},{"type":"mc","q":"Which is a run-on sentence?","options":["I like cats. They are cute.","I like cats they are cute.","I like cats because they are cute."],"answer":1,"why":"Two sentences are squashed together with nothing between them."},{"type":"mc","q":"Which sentence is correct?","options":["I love swimming, it is fun.","I love swimming it is fun.","I love swimming. It is fun."],"answer":2,"why":"A full stop separates the two sentences."},{"type":"mc","q":"Which sentence is correct?","options":["It was raining, we stayed inside.","It was raining, so we stayed inside.","It was raining we stayed inside."],"answer":1,"why":"A comma alone can't join two sentences. Add so."},{"type":"mc","q":"Which is the best fix for \"Leo was hungry he ate a sandwich.\"?","options":["Leo was hungry, so he ate a sandwich.","Leo was hungry, he ate a sandwich.","Leo was hungry so, he ate a sandwich."],"answer":0,"why":"Comma + so joins two sentences correct const STAGES = [
  { n: 1, name: "Words & Sentences", zh: "词与句子：打好地基", c: "var(--l1)", from: 1, to: 9 },
  { n: 2, name: "Describe & Place", zh: "描述和位置", c: "var(--l2)", from: 10, to: 17 },
  { n: 3, name: "Time Travel: Tenses", zh: "时态", c: "var(--l3)", from: 18, to: 26 },
  { n: 4, name: "Building Bigger Sentences", zh: "句子进阶", c: "var(--l4)", from: 27, to: 99 }
];
const LEVELS = [
  { name: "Warm-up", zh: "热身 · 选一选" },
  { name: "Practice", zh: "练习 · 填一填" },
  { name: "Challenge", zh: "挑战 · 写一写" }
];
const PASS = 0.8;
const KEY = "emma-grammar-v1";

TOPICS.sort((a, b) => a.num - b.num);
const byId = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const stageOf = t => STAGES.find(s => t.num >= s.from && t.num <= s.to);

/* ---------- storage ---------- */
let store = { best: {}, wrong: {} };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const best = (id, li) => store.best[id + ":" + li];
const starsFor = id => [0, 1, 2].filter(li => (best(id, li) || 0) >= PASS).length;

/* ---------- text helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const starHTML = (n, of = 3) => `<span class="stars" aria-label="${n} of ${of} stars">${[...Array(of)].map((_, i) => `<span class="${i < n ? "on" : ""}">★</span>`).join("")}</span>`;

const CONTRACTIONS = [
  [/\bcan't\b/g, "cannot"], [/\bcan not\b/g, "cannot"], [/\bwon't\b/g, "will not"], [/\bshan't\b/g, "shall not"],
  [/\bain't\b/g, "is not"], [/n't\b/g, " not"], [/'m\b/g, " am"], [/'re\b/g, " are"], [/'ve\b/g, " have"],
  [/'ll\b/g, " will"], [/'d\b/g, " would"],
  [/\b(it|he|she|that|there|what|who|where|here|how)'s\b/g, "$1 is"], [/\blet's\b/g, "let us"]
];
function norm(s, strict, exact) {
  s = String(s).replace(/[‘’ʼ`]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, " ").trim();
  if (strict) return s.replace(/\s+([,.!?])/g, "$1");
  if (exact !== "cs") s = s.toLowerCase();
  if (exact) return s.replace(/[.!?]+$/, "").trim();
  for (const [re, to] of CONTRACTIONS) s = s.replace(re, to);
  return s.replace(/[.,!?;:"()…]/g, " ").replace(/\s+/g, " ").trim();
}
const loose = s => String(s).toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
function matches(input, answers, strict, exact) {
  if (exact) return answers.some(x => norm(x, false, exact) === norm(input, false, exact));
  const a = norm(input, strict), l = loose(input);
  return answers.some(x => norm(x, strict) === a || (!strict && loose(x) === l));
}
function sentenceFromWords(ws, end) {
  const s = ws.join(" ");
  return s.charAt(0).toUpperCase() + s.slice(1) + end;
}
function shuffle(arr, seed) {
  const a = arr.slice(); let x = seed || 7;
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.join() === arr.join() && a.length > 1) [a[0], a[a.length - 1]] = [a[a.length - 1], a[0]];
  return a;
}
function correctText(it) {
  if (it.type === "mc") return it.options[it.answer];
  if (it.type === "fill") return it.answer[0];
  if (it.type === "order") return sentenceFromWords(it.words, it.end);
  return it.answer[0];
}

/* ---------- views ---------- */
const app = document.getElementById("app");
let view = { name: "home" };

function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else route(); }
window.addEventListener("hashchange", route);

function route() {
  const h = location.hash.slice(1);
  if (h === "review") return showReview();
  if (byId[h]) return showTopic(h);
  showHome();
}

function showHome() {

      <div class="howto-actions">
        ${nextUp ? `<button class="btn small" style="--c:${stageOf(nextUp).c}" data-go="${nextUp.id}">${starsFor(nextUp.id) ? "Continue" : "Start"}: ${nextUp.num}. ${esc(nextUp.title)}</button>` : ""}
        <button class="btn small ghost" data-go="review" ${wrongCount ? "" : "disabled"}>Mistake notebook 错题本 (${wrongCount})</button>
      </div>

      ${STAGES.map(s => {
        const ts = TOPICS.filter(t => t.num >= s.from && t.num <= s.to);

    <p class="muted" style="margin-top:28px;font-size:14px">Progress is saved in this browser on this device.

  bindGo();
  document.getElementById("resetBtn").onclick = () => {

    document.getElementById("resetYes").onclick = () => { store = { best: {}, wrong: {} }; save(); showHome(); };

function bindGo() { app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); }

function lessonHTML(t) {
  return `<section class="panel">

function showTopic(id, li) {
  const t = byId[id], s = stageOf(t);
  if (li === undefined) li = Math.min([0, 1, 2].find(i => (best(id, i) || 0) < PASS) ?? 0, 2);
  view = { name: "topic", id, li };
  const idx = TOPICS.indexOf(t), next = TOPICS[idx + 1], prev = TOPICS[idx - 1];
  app.innerHTML = `<div class="topic" style="--c:${s.c}">
    <div class="topbar"><button class="back" data-go="map">← All stations</button>${starHTML(starsFor(id))}</div>
    <header class="t-head"><div class="eyebrow">Line ${s.n} · Station ${t.num}</div><h1>${esc(t.title)}</h1><div class="zh">${esc(t.zh)}</div></header>
    ${lessonHTML(t)}
    <section class="panel" id="practice">
      <h2>Practise it</h2>
      <div class="levels" role="tablist">${LEVELS.map((L, i) => {
        const b = best(id, i);
        return `<button class="lvl ${i === li ? "active" : ""}" role="tab" aria-selected="${i === li}" data-li="${i}"><b>${"★".repeat(i + 1)} ${L.name}</b><span class="zh">${L.zh}</span><br><span>${b === undefined ? "not tried" : "best " + Math.round(b * 100) + "%"}</span></button>`;
      }).join("")}</div>
      <div id="quiz"></div>
    </section>
    <div class="actions" style="justify-content:space-between">
      ${prev ? `<button class="btn ghost" data-go="${prev.id}">← ${prev.num}. ${esc(prev.title)}</button>` : "<span></span>"}
      ${next ? `<button class="btn" style="--c:${stageOf(next).c}" data-go="${next.id}">${next.num}. ${esc(next.title)} →</button>` : ""}
    </div></div>`;
  bindGo();
  app.querySelectorAll(".lvl").forEach(b => b.onclick = () => { showTopic(id, +b.dataset.li); document.getElementById("practice").scrollIntoView({ block: "start" }); });
  const items = t.levels[li].items.map((it, i) => ({ it, key: `${id}:${li}:${i}` }));
  runQuiz(document.getElementById("quiz"), items, {
    seed: t.num * 10 + li,
    onDone(score, wrongs, redo) {
      if (!redo) { const prevBest = best(id, li) || 0; store.best[id + ":" + li] = Math.max(prevBest, score); save(); }
      const stars = starsFor(id);
      return {
        title: score >= PASS ? (li < 2 ? "Star earned! Ready for the next level?" : "Station complete!") : "Good try! Score 80% to earn the star.",
        extra: !redo && li < 2 && score >= PASS ? `<button class="btn" id="nextLevel">Next level: ${LEVELS[li + 1].name}</button>` :
               (!redo && li === 2 && stars === 3 && next ? `<button class="btn" style="--c:${stageOf(next).c}" data-go="${next.id}">Next station →</button>` : ""),
        bind(root) {

          root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
        },
        again() { showTopic(id, li); document.getElementById("practice").scrollIntoView({ block: "start" }); }
      };
    }
  });
  window.scrollTo(0, 0);
}

function showReview() {
  view = { name: "review" };
  const keys = Object.keys(store.wrong).filter(k => { const [id, li, i] = k.split(":"); return byId[id] && byId[id].levels[li] && byId[id].levels[li].items[i]; });
  const items = keys.map(k => { const [id, li, i] = k.split(":"); return { it: byId[id].levels[li].items[i], key: k, topic: byId[id] }; });
  app.innerHTML = `<div class="topic" style="--c:var(--l4)">
    <div class="topbar"><button class="back" data-go="map">← All stations</button></div>
    <header class="t-head"><div class="eyebrow">Mistake notebook</div><h1>Fix your mistakes</h1><div class="zh">错题本：答对一次就会从这里移除</div></header>
    <section class="panel"><div id="quiz"></div></section></div>`;
  bindGo();
  const box = document.getElementById("quiz");
  if (!items.length) { box.innerHTML = `<p>Nothing to review right now. Great work!</p>`; return; }
  runQuiz(box, items, {
    seed: 3, review: true,
    onDone(score) {
      return { title: Object.keys(store.wrong).length ? "Keep going! The ones you missed stay in the notebook." : "Notebook empty. Brilliant!", extra: "", bind() {}, again: showReview };
    }
  });
  window.scrollTo(0, 0);
}

/* ---------- quiz engine ---------- */
function runQuiz(root, items, opts, redo) {
  let i = 0, firstTry = 0, tries = 0, wrongs = [];
  let state = null;

  function render() {
    const { it, topic } = items[i];
    tries = 0;
    state = { picked: null, built: [], pool: [] };
    const pct = (i / items.length) * 100;
    let body = "";
    if (it.type === "mc") {
      body = `<p class="q">${md(it.q).replace(/___/g, "<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</p>
        <div class="opts">${it.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${md(o)}</span></button>`).join("")}</div>`;
    } else if (it.type === "fill") {
      const [a, b] = esc(it.q).split("___");
      body = `<p class="q">${a}<input class="blank" id="blank" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">${b}</p>`;
    } else if (it.type === "order") {
      state.pool = shuffle(it.words.map((w, k) => ({ w, k })), (opts.seed || 1) * 31 + i).map(x => x);
      body = `<div class="task">Put the words in order</div>
        <div class="tray" id="tray"></div><div class="chips" id="pool"></div>`;
    } else {
      body = `<div class="task">${esc(it.task)}</div><div class="given">${esc(it.s)}</div>
        <input class="answer-input" id="free" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="Write the new sentence" placeholder="Write the whole sentence here">`;
    }
    root.innerHTML = `<div class="qbar"><i style="width:${pct}%"></i></div>
      <div class="qmeta"><span>Question ${i + 1} of ${items.length}</span><span>${topic ? esc(topic.num + ". " + topic.title) : `First-try correct: ${firstTry}`}</span></div>
      ${body}<div id="fb"></div>
      <div class="actions"><button class="btn" id="check">Check</button><button class="btn ghost" id="skip">Show answer</button></div>`;
    if (it.type === "mc") root.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      root.querySelectorAll(".opt").forEach(x => x.classList.remove("picked")); b.classList.add("picked"); state.picked = +b.dataset.k;
    });
    if (it.type === "order") drawOrder(it);
    const inp = root.querySelector("#blank, #free");
    if (inp) { inp.focus({ preventScroll: true }); inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); root.querySelector("#check").click(); } }); }
    root.querySelector("#check").onclick = check;
    root.querySelector("#skip").onclick = () => finish(false, true);
  }

  function drawOrder(it) {
    const tray = root.querySelector("#tray"), pool = root.querySelector("#pool");
    const shown = state.built.map(x => x.w);
    tray.classList.toggle("built", state.built.length === it.words.length);
    tray.innerHTML = state.built.length
      ? state.built.map((x, j) => `<button class="chip" data-j="${j}">${esc(j === 0 ? x.w.charAt(0).toUpperCase() + x.w.slice(1) : x.w)}</button>`).join("") + `<span class="end-mark">${esc(it.end)}</span>`
      : `<span class="hint">Tap the words below to build the sentence.</span>`;
    pool.innerHTML = state.pool.map((x, j) => `<button class="chip" data-p="${j}">${esc(x.w)}</button>`).join("");
    tray.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (state.locked) return; state.pool.push(state.built.splice(+b.dataset.j, 1)[0]); drawOrder(it); });
    pool.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { if (state.locked) return; state.built.push(state.pool.splice(+b.dataset.p, 1)[0]); drawOrder(it); });
  }

  function check() {
    const { it } = items[i];
    let ok;
    if (it.type === "mc") { if (state.picked === null) return; ok = state.picked === it.answer; }
    else if (it.type === "fill") { const v = root.querySelector("#blank").value; if (!v.trim()) return; ok = matches(v, it.answer, false, it.exact); }
    else if (it.type === "order") {
      if (state.pool.length) return;
      const got = state.built.map(x => x.w).join(" ").toLowerCase();
      ok = [it.words, ...(it.alt || [])].some(ws => ws.join(" ").toLowerCase() === got);
    } else { const v = root.querySelector("#free").value; if (!v.trim()) return; ok = matches(v, it.answer, it.strict); }
    tries++;
    if (ok) return finish(true);
    if (tries < 2) {
      root.querySelector("#fb").innerHTML = `<div class="feedback bad"><b>Not quite.</b> Look at the rule again and try once more.</div>`;
      if (it.type === "mc") root.querySelector(`.opt[data-k="${state.picked}"]`).classList.add("wrong");
      return;
    }
    finish(false);
  }

  function finish(ok, gaveUp) {
    const { it, key } = items[i];
    state.locked = true;
    const first = ok && tries === 1;
    if (first) firstTry++; else wrongs.push(items[i]);
    if (first && opts.review) delete store.wrong[key];
    if (!first) store.wrong[key] = 1;
    save();
    if (it.type === "mc") root.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.k; if (k === it.answer) b.classList.add("right"); else if (b.classList.contains("picked") && !ok) b.classList.add("wrong"); });
    root.querySelectorAll("input").forEach(x => x.disabled = true);
    const ans = it.type === "mc" ? "" : `<div>Answer: <strong>${it.type === "fill" ? esc(it.answer.join(" / ")) : esc(correctText(it))}</strong></div>`;
    root.querySelector("#fb").innerHTML = ok
      ? `<div class="feedback good"><b>${tries === 1 ? "Correct!" : "Got it on the second try."}</b> ${md(it.why)}</div>`
      : `<div class="feedback bad"><b>${gaveUp ? "Here's the answer." : "Not this time."}</b> ${ans}<div>${md(it.why)}</div></div>`;
    const last = i === items.length - 1;
    root.querySelector(".actions").innerHTML = `<button class="btn" id="next">${last ? "See my score" : "Next →"}</button>`;
    const nb = root.querySelector("#next");
    nb.focus({ preventScroll: true });
    nb.onclick = () => { if (last) done(); else { i++; render(); } };
  }

  function done() {
    const score = firstTry / items.length;
    const r = opts.onDone(score, wrongs, redo);
    const stars = score >= PASS ? 1 : 0;
    root.innerHTML = `<div class="result">
      <div class="big">${firstTry} / ${items.length}</div>
      <p class="muted">${Math.round(score * 100)}% right on the first try</p>
      ${opts.review ? "" : starHTML(stars, 1)}
      <h3 style="margin-top:10px">${esc(r.title)}</h3>
      <div class="actions">${r.extra}
        ${wrongs.length && !opts.review ? `<button class="btn ghost" id="redo">Redo the ${wrongs.length} I missed</button>` : ""}
        <button class="btn ghost" id="again">${opts.review ? "Review again" : "Try the whole level again"}</button></div>
      ${wrongs.length ? `<div class="review-list"><strong>To remember:</strong>${wrongs.map(w => `<div>${w.it.type === "rewrite" ? esc(w.it.s) + " → " : ""}<strong>${esc(correctText(w.it))}</strong> <span class="muted">${md(w.it.why)}</span></div>`).join("")}</div>` : ""}
    </div>`;
    r.bind(root);
    const rd = root.querySelector("#redo");
    if (rd) rd.onclick = () => runQuiz(root, wrongs.slice(), opts, true);
    root.querySelector("#again").onclick = r.again;
  }

  render();
}

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName === "INPUT") return;
  const b = document.querySelector("#next") || (document.querySelector(".opt.picked") && document.querySelector("#check"));
  if (b && e.target.tagName !== "BUTTON") { e.preventDefault(); b.click(); }
});

route();
</script>

</body>
</html>
